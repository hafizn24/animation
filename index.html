<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Character Viewer</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
    }
  }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 15px 25px;
      border-radius: 8px;
      display: flex;
      gap: 15px;
      z-index: 100;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 90vw;
    }
    .controls button {
      padding: 8px 16px;
      cursor: pointer;
      background: #4a90d9;
      border: none;
      border-radius: 4px;
      color: white;
      font-size: 12px;
    }
    .controls button:hover {
      background: #357abd;
    }
    .controls button.active {
      background: #ff6b6b;
    }
    .info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      z-index: 100;
      max-width: 250px;
    }
    .info h3 {
      margin-bottom: 10px;
      color: #4a90d9;
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 30px;
      border-radius: 8px;
      z-index: 200;
      display: none;
    }
    .loading.active {
      display: block;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  
  <div class="info">
    <h3>Controls</h3>
    <div>🖱️ Left click + drag: Rotate</div>
    <div>🖱️ Right click + drag: Pan</div>
    <div>🖱️ Scroll: Zoom</div>
    <br>
  </div>
  
  <div class="controls">
    <select id="character-selector">
      <optgroup label="Characters">
        <option value="default">👨 Default Hoodie</option>
        <option value="suit">👔 Three-Piece Suit</option>
        <option value="coach">👕 Coach Tracksuit</option>
        <option value="soccer">⚽ Soccer Jersey</option>
        <option value="casual">🧥 Casual Sweater</option>
        <option value="chairman">👤 The Chairman</option>
        <option value="newowner">👔 The New Owner</option>
        <option value="sponsor">💼 Sponsor Executive</option>
        <option value="karim">⭐ Karim (Captain #8 — Match Jersey)</option>
        <option value="azam">🙅 Azam (#7 Defender)</option>
        <option value="karim-away">🏟️ Karim Away Kit</option>
      </optgroup>
      <optgroup label="Environments">
        <option value="stadium">⚽ Stadium (Buluh FC)</option>
        <option value="locker">🚿 Locker Room</option>
        <option value="manager-office">🏢 Manager Office</option>
        <option value="boardroom">🏛️ Lender Boardroom</option>
        <option value="players-tunnel">🚇 Players Tunnel</option>
        <option value="sponsor-office">🏢 Sponsor Office (Nexus Sports)</option>
        <option value="bakery">🥐 Bakery (Kek Maju)</option>
        <option value="club-office">🚪 Club Office (Episode 4)</option>
        <option value="pitch-hero-stand">🏆 Pitch Hero Stand (Finale)</option>
        <option value="pitch-crisis-night">⛈️ Pitch Crisis Night</option>
        <option value="modular-pitch-zone">📐 Modular Pitch Zone</option>
      </optgroup>
    </select>
    <button id="btn-procedural">Load Selected</button>
    <button id="btn-gltf">Load GLTF File</button>
    <button id="btn-inspector" class="active">Inspector ON</button>
    <button id="btn-reset">Reset View</button>
  </div>
  
  <div class="loading" id="loading">
    <div>Loading character...</div>
  </div>

  <script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { DefaultApp } from './characters/character-default.js';
import { SuitOutfitApp } from './characters/character-suit.js';
import { SoccerCoachOutfitApp } from './characters/character-coach.js';
import { SoccerOutfitApp } from './characters/character-soccer.js';
import { AnotherCasualOutfitApp } from './characters/character-casual.js';
import { ChairmanApp } from './characters/character-chairman.js';
import { NewOwnerApp } from './characters/character-new-owner.js';
import { SponsorApp } from './characters/character-sponsor.js';
import { KarimApp } from './characters/character-karim.js';
import { AzamApp } from './characters/character-azam.js';
import { KarimAwayApp } from './characters/character-karim-away.js';
import { StadiumApp } from './environments/stadium.js';
import { LockerRoomApp } from './environments/locker-room.js';
import { ManagerOfficeApp } from './environments/manager-office.js';
import { LenderBoardroomApp } from './environments/lender-boardroom.js';
import { PlayersTunnelApp } from './environments/players-tunnel.js';
import { SponsorOfficeApp } from './environments/sponsor-office.js';
import { BakeryApp } from './environments/bakery.js';
import { ClubOfficeApp } from './environments/club-office.js';
import { PitchHeroStandApp } from './environments/pitch-hero-stand.js';
import { PitchCrisisNightApp } from './environments/pitch-crisis-night.js';
import { ModularPitchZoneApp } from './environments/modular-pitch-zone.js';

/**
 * Shared hairstyle builder used by every character in the viewer.
 *
 * Styles are built against the standard head rig used across the codebase:
 * a 0.46 radius sphere centred at y = 0.36 inside a head group placed at
 * y = 1.95. Every style therefore sits correctly on any character.
 */

const HAIR_STYLES = [
  'crop',
  'messy',
  'buzz',
  'swept',
  'sidePart',
  'long',
  'afro',
  'receding',
  'bald'
];

/**
 * Builds a hairstyle group.
 *
 * @param {string} style        one of HAIR_STYLES
 * @param {THREE.Material} material  hair material (toon, shared per character)
 * @param {Function} createOutlinedMesh  (geometry, material, thickness) => Object3D
 * @param {number} radius       head radius, so the hair scales with the head
 * @param {number} offsetY      vertical offset of the head centre
 * @returns {THREE.Group} the hair group, parented to the head group
 */
function createHairstyle(style, material, createOutlinedMesh, radius = 0.46, offsetY = 0) {
  const group = new THREE.Group();
  group.name = 'Hair';

  const add = (geometry, thickness = 0.028) => {
    const mesh = createOutlinedMesh(geometry, material, thickness);
    group.add(mesh);
    return mesh;
  };

  switch (style) {
    // Very short, close to the scalp
    case 'buzz': {
      const cap = add(new THREE.SphereGeometry(0.468, 22, 16, 0, Math.PI * 2, 0, Math.PI * 0.30));
      cap.position.y = 0.352;
      break;
    }

    // Short hair with an even fringe
    case 'crop': {
      const cap = add(new THREE.SphereGeometry(0.478, 24, 18, 0, Math.PI * 2, 0, Math.PI * 0.40));
      cap.position.y = 0.348;
      const fringe = add(new THREE.SphereGeometry(0.2, 16, 12));
      fringe.position.set(0, 0.47, 0.31);
      fringe.scale.set(1.55, 0.55, 0.75);
      break;
    }

    // Short hair pushed up and out of place
    case 'messy': {
      const cap = add(new THREE.SphereGeometry(0.478, 24, 18, 0, Math.PI * 2, 0, Math.PI * 0.40));
      cap.position.y = 0.348;
      const tufts = [
        [0.16, 0.60, 0.16, 0.19],
        [-0.22, 0.55, 0.02, 0.17],
        [0.04, 0.62, -0.24, 0.16],
        [-0.08, 0.58, 0.26, 0.15]
      ];
      tufts.forEach(([tx, ty, tz, r]) => {
        const tuft = add(new THREE.SphereGeometry(r, 14, 12));
        tuft.position.set(tx, ty, tz);
        tuft.scale.set(1, 0.7, 1);
      });
      break;
    }

    // Volume swept back off the forehead
    case 'swept': {
      const cap = add(new THREE.SphereGeometry(0.482, 24, 18, 0, Math.PI * 2, 0, Math.PI * 0.38));
      cap.position.y = 0.345;
      const quiff = add(new THREE.SphereGeometry(0.30, 20, 16));
      quiff.position.set(0.03, 0.60, 0.17);
      quiff.scale.set(1.02, 0.72, 1.06);
      const sweep = add(new THREE.SphereGeometry(0.22, 16, 14));
      sweep.position.set(-0.17, 0.53, 0.26);
      sweep.scale.set(1.25, 0.52, 0.85);
      sweep.rotation.z = 0.5;
      break;
    }

    // Neat side part
    case 'sidePart': {
      const cap = add(new THREE.SphereGeometry(0.478, 24, 18, 0, Math.PI * 2, 0, Math.PI * 0.38));
      cap.position.y = 0.348;
      const parting = add(new THREE.SphereGeometry(0.23, 16, 14));
      parting.position.set(0.13, 0.50, 0.30);
      parting.scale.set(1.3, 0.55, 0.85);
      parting.rotation.z = -0.35;
      break;
    }

    // Longer hair falling past the ears
    case 'long': {
      const cap = add(new THREE.SphereGeometry(0.492, 24, 18, 0, Math.PI * 2, 0, Math.PI * 0.46));
      cap.position.y = 0.345;
      [-1, 1].forEach((dir) => {
        const side = add(new THREE.SphereGeometry(0.22, 16, 14));
        side.position.set(dir * 0.40, 0.16, -0.02);
        side.scale.set(0.85, 1.5, 1.05);
        const fringe = add(new THREE.SphereGeometry(0.19, 16, 14));
        fringe.position.set(dir * 0.19, 0.45, 0.30);
        fringe.scale.set(1.1, 0.6, 0.8);
        fringe.rotation.z = dir * 0.25;
      });
      break;
    }

    // Rounded volume
    case 'afro': {
      const cap = add(new THREE.SphereGeometry(0.56, 24, 18, 0, Math.PI * 2, 0, Math.PI * 0.56));
      cap.position.y = 0.325;
      cap.scale.set(1, 0.92, 1);
      const bumps = [
        [0.28, 0.66, 0.16, 0.20],
        [-0.30, 0.60, -0.10, 0.18],
        [0.05, 0.74, -0.26, 0.19]
      ];
      bumps.forEach(([bx, by, bz, r]) => {
        const bump = add(new THREE.SphereGeometry(r, 14, 12));
        bump.position.set(bx, by, bz);
      });
      break;
    }

    // High hairline with hair only at the sides and back
    case 'receding': {
      const band = add(new THREE.SphereGeometry(
        0.478, 26, 20,
        Math.PI * 0.72, Math.PI * 1.56,
        Math.PI * 0.30, Math.PI * 0.70
      ));
      band.position.y = 0.348;
      const sideBurn = add(new THREE.BoxGeometry(0.09, 0.15, 0.14));
      sideBurn.position.set(-0.40, 0.28, 0.10);
      const sideBurn2 = add(new THREE.BoxGeometry(0.09, 0.15, 0.14));
      sideBurn2.position.set(0.40, 0.28, 0.10);
      break;
    }

    // Deliberately bald
    case 'bald':
    default:
      break;
  }

  // Match the hairstyle to the head it sits on
  group.scale.setScalar(radius / 0.46);
  group.position.y = offsetY;

  return group;
}

class App {
  constructor(container) {
    this.container = container;
    this.scene = null;
    this.camera = null;
    this.renderer = null;
    this.controls = null;
    this.character = null;
    this.characterParts = {};
    this.animations = {};
    this.clock = new THREE.Clock();
    this.isWalking = false;

    // 1. Mentakrifkan senarai pilihan pakaian (Outfit Palettes)
    this.headRadius = 0.46;   // head sphere radius the hair is built around
    this.headOffsetY = 0;  // vertical offset of the head centre
    this.hairStyle = 'messy';

    this.outfits = {
      default: {
        hoodie: 0x528558,      // Forest Green
        pocket: 0x3f6b44,      // Dark Forest Green
        pants: 0x425770,       // Dark Slate Blue
        cuffs: 0x677c94,       // Lighter Blue Cuffs
        boots: 0x95583f,       // Brown Boots
        belt: 0xf2a04f         // Orange Belt
      },
      casualRed: {
        hoodie: 0xd9534f,      // Crimson Red
        pocket: 0xa94442,      // Dark Burgundy
        pants: 0x2b2b2b,       // Charcoal Black
        cuffs: 0x555555,       // Grey Cuffs
        boots: 0x111111,       // Dark Boots
        belt: 0xf0ad4e         // Golden Yellow Belt
      },
      neonCyber: {
        hoodie: 0x00f0ff,      // Electric Cyan
        pocket: 0x008fa0,      // Dark Cyan
        pants: 0x1a1a2e,       // Cyber Blue-Purple
        cuffs: 0xff007f,       // Neon Pink Cuffs
        boots: 0xff007f,       // Neon Pink Boots
        belt: 0x39ff14         // Lime Green Belt
      }
    };
  }

  async init() {
    this.setupScene();
    this.setupCamera();
    this.setupRenderer();
    this.setupControls();
    this.addLights();
    this.createProceduralCharacter();
    this.animate();
    return this;
  }

  setupScene() {
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0xfcf9e8); // Latar belakang krim
  }

  setupCamera() {
    const aspect = this.container.clientWidth / this.container.clientHeight;
    this.camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
    this.camera.position.set(0, 1.8, 4.2);
  }

  setupRenderer() {
    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.container.appendChild(this.renderer.domElement);
  }

  setupControls() {
    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.05;
    this.controls.target.set(0, 1.3, 0);
  }

  addLights() {
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    this.scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
    directionalLight.position.set(4, 8, 5);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    this.scene.add(directionalLight);
  }

  createToonMaterial(colorHex) {
    const colors = new Uint8Array([215, 255]);
    const gradientMap = new THREE.DataTexture(colors, colors.length, 1, THREE.RedFormat);
    gradientMap.minFilter = THREE.NearestFilter;
    gradientMap.magFilter = THREE.NearestFilter;
    gradientMap.needsUpdate = true;

    return new THREE.MeshToonMaterial({
      color: colorHex,
      gradientMap: gradientMap
    });
  }

  createOutlinedMesh(geometry, material, outlineThickness = 0.022) {
    const group = new THREE.Group();
    const mesh = new THREE.Mesh(geometry, material);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    group.add(mesh);

    // Simpan rujukan mesh asal untuk dikemas kini warnanya nanti
    group.userData = { mainMesh: mesh };

    if (outlineThickness > 0) {
      const outlineMat = new THREE.MeshBasicMaterial({
        color: 0x0b0b0b,
        side: THREE.BackSide
      });
      const outlineMesh = new THREE.Mesh(geometry, outlineMat);
      outlineMesh.scale.setScalar(1 + outlineThickness);
      group.add(outlineMesh);
    }

    return group;
  }

  createProceduralCharacter() {
    if (this.character) {
      this.dispose();
    }

    const group = new THREE.Group();

    // 2. Gunakan pakaian lalai (default) semasa permulaan
    const defaultColors = this.outfits.default;

    // Membina Materials
    this.materials = {
      hair: this.createToonMaterial(0x6b4a2f),
      white: this.createToonMaterial(0xffffff),
      hoodie: this.createToonMaterial(defaultColors.hoodie),
      pocket: this.createToonMaterial(defaultColors.pocket),
      pants: this.createToonMaterial(defaultColors.pants),
      cuffs: this.createToonMaterial(defaultColors.cuffs),
      boots: this.createToonMaterial(defaultColors.boots),
      belt: this.createToonMaterial(defaultColors.belt),
      black: new THREE.MeshBasicMaterial({ color: 0x111111 })
    };

    // ==================== 1. FACELESS HEAD & NECK ====================
    const headGroup = new THREE.Group();
    headGroup.name = 'Head';
    headGroup.position.set(0, 1.95, 0);

    const headGeom = new THREE.SphereGeometry(0.46, 32, 32);
    const head = this.createOutlinedMesh(headGeom, this.materials.white, 0.03);
    head.position.y = 0.36;
    headGroup.add(head);

    // Hairstyle
    this.hairGroup = this.buildHairstyle(this.hairStyle);
    headGroup.add(this.hairGroup);

    const neckGeom = new THREE.CylinderGeometry(0.11, 0.13, 0.22, 16);
    const neck = this.createOutlinedMesh(neckGeom, this.materials.white, 0.025);
    neck.position.y = -0.02;
    headGroup.add(neck);
    group.add(headGroup);

    // ==================== 2. GREEN HOODIE ====================
    const torsoGroup = new THREE.Group();
    torsoGroup.name = 'Torso';
    torsoGroup.position.set(0, 1.45, 0);

    const torsoGeom = new THREE.CylinderGeometry(0.30, 0.36, 0.72, 24);
    const torso = this.createOutlinedMesh(torsoGeom, this.materials.hoodie, 0.028);
    torso.scale.set(1.08, 1, 0.78);
    torsoGroup.add(torso);

    const shoulderGeom = new THREE.SphereGeometry(0.32, 24, 16);
    const shoulders = this.createOutlinedMesh(shoulderGeom, this.materials.hoodie, 0.025);
    shoulders.position.y = 0.26;
    shoulders.scale.set(1.12, 0.55, 0.78);
    torsoGroup.add(shoulders);

    const collarGeom = new THREE.TorusGeometry(0.22, 0.09, 16, 24);
    const collar = this.createOutlinedMesh(collarGeom, this.materials.hoodie, 0.03);
    collar.position.set(0, 0.40, -0.02);
    collar.rotation.x = Math.PI / 2 + 0.15;
    collar.scale.set(1.1, 1.15, 0.9);
    torsoGroup.add(collar);

    const backHoodGeom = new THREE.SphereGeometry(0.22, 20, 20);
    const backHood = this.createOutlinedMesh(backHoodGeom, this.materials.hoodie, 0.03);
    backHood.position.set(0, 0.36, -0.22);
    backHood.scale.set(1.05, 0.85, 0.95);
    torsoGroup.add(backHood);

    const pocketGeom = new THREE.BoxGeometry(0.36, 0.17, 0.08);
    const pocket = this.createOutlinedMesh(pocketGeom, this.materials.pocket, 0.025);
    pocket.position.set(0, -0.18, 0.25);
    torsoGroup.add(pocket);
    group.add(torsoGroup);

    // ==================== 3. BELT & PELVIS ====================
    const pelvisGroup = new THREE.Group();
    pelvisGroup.name = 'Pelvis';
    pelvisGroup.position.set(0, 1.04, 0);

    const beltGeom = new THREE.CylinderGeometry(0.355, 0.355, 0.10, 24);
    const belt = this.createOutlinedMesh(beltGeom, this.materials.belt, 0.025);
    belt.scale.set(1.06, 1, 0.78);
    pelvisGroup.add(belt);

    const buckleGeom = new THREE.CylinderGeometry(0.065, 0.065, 0.05, 20);
    const buckle = this.createOutlinedMesh(buckleGeom, this.materials.belt, 0.04);
    buckle.rotation.x = Math.PI / 2;
    buckle.position.set(0, 0, 0.27);
    pelvisGroup.add(buckle);

    const loopGeom = new THREE.BoxGeometry(0.035, 0.11, 0.03);
    [-0.18, 0.18].forEach((xPos) => {
      const loop = new THREE.Mesh(loopGeom, this.materials.black);
      loop.position.set(xPos, 0, 0.26);
      pelvisGroup.add(loop);
    });

    const hipsGeom = new THREE.CylinderGeometry(0.35, 0.34, 0.18, 24);
    const hips = this.createOutlinedMesh(hipsGeom, this.materials.pants, 0.025);
    hips.position.y = -0.12;
    hips.scale.set(1.05, 1, 0.76);
    pelvisGroup.add(hips);
    group.add(pelvisGroup);

    // ==================== 4. ARMS & HANDS ====================
    const createArm = (isLeft) => {
      const dir = isLeft ? -1 : 1;
      const armPivot = new THREE.Group();
      armPivot.position.set(dir * 0.34, 1.74, 0);

      const sleeveGeom = new THREE.CylinderGeometry(0.11, 0.15, 0.62, 16);
      const sleeve = this.createOutlinedMesh(sleeveGeom, this.materials.hoodie, 0.03);
      sleeve.position.y = -0.28;
      armPivot.add(sleeve);

      const sleeveCuffGeom = new THREE.TorusGeometry(0.115, 0.035, 12, 20);
      const sleeveCuff = this.createOutlinedMesh(sleeveCuffGeom, this.materials.hoodie, 0.03);
      sleeveCuff.rotation.x = Math.PI / 2;
      sleeveCuff.position.y = -0.58;
      armPivot.add(sleeveCuff);

      const handGroup = new THREE.Group();
      handGroup.name = 'Hand';
      handGroup.position.set(0, -0.68, 0);

      const palmGeom = new THREE.SphereGeometry(0.11, 16, 16);
      const palm = this.createOutlinedMesh(palmGeom, this.materials.white, 0.035);
      palm.scale.set(1.08, 1.14, 0.72);
      handGroup.add(palm);


      armPivot.add(handGroup);
      armPivot.rotation.z = dir * 0.32;

      return armPivot;
    };

    const leftArm = createArm(true);
    const rightArm = createArm(false);
    group.add(leftArm);
    group.add(rightArm);

    // ==================== 5. JEANS & BOOTS ====================
    const createLeg = (isLeft) => {
      const dir = isLeft ? -1 : 1;
      const legPivot = new THREE.Group();
      legPivot.position.set(dir * 0.18, 0.90, 0);

      const pantGeom = new THREE.CylinderGeometry(0.145, 0.155, 0.62, 18);
      const pant = this.createOutlinedMesh(pantGeom, this.materials.pants, 0.03);
      pant.position.y = -0.30;
      legPivot.add(pant);

      const cuffGeom = new THREE.CylinderGeometry(0.17, 0.17, 0.11, 20);
      const cuff = this.createOutlinedMesh(cuffGeom, this.materials.cuffs, 0.03);
      cuff.position.y = -0.60;
      legPivot.add(cuff);

      const bootShaftGeom = new THREE.CylinderGeometry(0.135, 0.15, 0.22, 18);
      const bootShaft = this.createOutlinedMesh(bootShaftGeom, this.materials.boots, 0.03);
      bootShaft.position.y = -0.74;
      legPivot.add(bootShaft);

      const bootFootGeom = new THREE.CapsuleGeometry(0.13, 0.16, 12, 16);
      const bootFoot = this.createOutlinedMesh(bootFootGeom, this.materials.boots, 0.03);
      bootFoot.rotation.x = Math.PI / 2;
      bootFoot.position.set(0, -0.82, 0.07);
      bootFoot.scale.set(1.12, 1.0, 0.85);
      legPivot.add(bootFoot);

      return legPivot;
    };

    const leftLeg = createLeg(true);
    const rightLeg = createLeg(false);
    group.add(leftLeg);
    group.add(rightLeg);

    this.characterParts = {
      head: headGroup,
      torso: torsoGroup,
      leftArm,
      rightArm,
      leftLeg,
      rightLeg
    };

    this.character = group;
    this.scene.add(this.character);
    return group;
  }

  // 3. Fungsi Utama untuk Menukar Pakaian
  /**
   * Builds a hairstyle for the head rig using the shared style library.
   * @param {string} style one of HAIR_STYLES
   */
  buildHairstyle(style) {
    return createHairstyle(style, this.materials.hair,
      (geometry, material, thickness) => this.createOutlinedMesh(geometry, material, thickness),
      this.headRadius, this.headOffsetY);
  }

  /**
   * Swaps the character's hairstyle.
   * @param {string} style one of HAIR_STYLES
   */
  changeHairStyle(style) {
    if (!HAIR_STYLES.includes(style)) {
      console.warn(`Hair style "${style}" not found.`);
      return;
    }
    this.hairStyle = style;

    const head = this.characterParts.head;
    if (!head) return;

    if (this.hairGroup) {
      head.remove(this.hairGroup);
      this.hairGroup.traverse((child) => {
        if (child.isMesh) child.geometry.dispose();
      });
    }
    this.hairGroup = this.buildHairstyle(style);
    head.add(this.hairGroup);
  }

  changeOutfit(outfitName) {
    const palette = this.outfits[outfitName];
    if (!palette) {
      console.warn(`Pakaian bernama "${outfitName}" tidak dijumpai.`);
      return;
    }

    // Kemas kini warna materials secara langsung
    this.materials.hoodie.color.setHex(palette.hoodie);
    this.materials.pocket.color.setHex(palette.pocket);
    this.materials.pants.color.setHex(palette.pants);
    this.materials.cuffs.color.setHex(palette.cuffs);
    this.materials.boots.color.setHex(palette.boots);
    this.materials.belt.color.setHex(palette.belt);
  }

  setWalking(walking) {
    this.isWalking = walking;
  }

  animate() {
    if (this._dead) return;
    requestAnimationFrame(() => this.animate());
    const elapsed = this.clock.getElapsedTime();

    if (this.character && this.characterParts.head) {
      const { head, leftArm, rightArm, leftLeg, rightLeg } = this.characterParts;

      if (this.isWalking) {
        const speed = 6;
        leftLeg.rotation.x = Math.sin(elapsed * speed) * 0.5;
        rightLeg.rotation.x = -Math.sin(elapsed * speed) * 0.5;
        leftArm.rotation.x = -Math.sin(elapsed * speed) * 0.4;
        rightArm.rotation.x = Math.sin(elapsed * speed) * 0.4;
        this.character.position.y = Math.abs(Math.cos(elapsed * speed)) * 0.06;
      } else {
        head.position.y = 1.95 + Math.sin(elapsed * 2) * 0.015;
        leftArm.rotation.z = -0.32 - Math.sin(elapsed * 2) * 0.02;
        rightArm.rotation.z = 0.32 + Math.sin(elapsed * 2) * 0.02;
        this.character.position.y = 0;
      }
    }

    this.controls.update();
    this.renderer.render(this.scene, this.camera);
  }

  onWindowResize() {
    const width = this.container.clientWidth;
    const height = this.container.clientHeight;
    this.camera.aspect = width / height;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(width, height);
  }

  resetScene() {
    this.dispose();
    this.setupScene();
    this.addLights();
    this.createProceduralCharacter();
  }

  dispose() {
    if (this.scene && this.character) {
      this.scene.remove(this.character);
      this.character.traverse((child) => {
        if (child.isMesh) {
          child.geometry.dispose();
          if (child.material) {
            if (Array.isArray(child.material)) {
              child.material.forEach(m => m.dispose());
            } else {
              child.material.dispose();
            }
          }
        }
      });
    }
    this.character = null;
    this.characterParts = {};
    this.animations = {};
  }
}

  setupScene() {

  setupCamera() {
    const aspect = this.container.clientWidth / this.container.clientHeight;
    this.camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
    this.camera.position.set(0, 1.8, 4.2);

  setupRenderer() {
    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.container.appendChild(this.renderer.domElement);
  }

  setupControls() {
    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.05;
    this.controls.target.set(0, 1.3, 0);
  }

  addLights() {
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    this.scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
    directionalLight.position.set(4, 8, 5);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    this.scene.add(directionalLight);
  }

  createToonMaterial(colorHex) {
    const colors = new Uint8Array([215, 255]);
    const gradientMap = new THREE.DataTexture(colors, colors.length, 1, THREE.RedFormat);
    gradientMap.minFilter = THREE.NearestFilter;
    gradientMap.magFilter = THREE.NearestFilter;
    gradientMap.needsUpdate = true;

    return new THREE.MeshToonMaterial({
      color: colorHex,
      gradientMap: gradientMap
    });
  }

  createOutlinedMesh(geometry, material, outlineThickness = 0.022) {
    const group = new THREE.Group();
    const mesh = new THREE.Mesh(geometry, material);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    group.add(mesh);
    group.userData = { mainMesh: mesh };

    if (outlineThickness > 0) {
      const outlineMat = new THREE.MeshBasicMaterial({
        color: 0x0b0b0b,
        side: THREE.BackSide
      });
      const outlineMesh = new THREE.Mesh(geometry, outlineMat);
      outlineMesh.scale.setScalar(1 + outlineThickness);
      group.add(outlineMesh);
    }
    return group;
  }

  createProceduralCharacter() {
    if (this.character) this.dispose();

    const group = new THREE.Group();
    const palette = this.outfits.classicGraySuit;

    this.materials = {
      hair: this.createToonMaterial(0x3f2b1c),
      white: this.createToonMaterial(0xffffff),
      jacket: this.createToonMaterial(palette.jacket),
      vest: this.createToonMaterial(palette.vest),
      lapel: this.createToonMaterial(palette.lapel),
      shirt: this.createToonMaterial(palette.shirt),
      tie: this.createToonMaterial(palette.tie),
      pants: this.createToonMaterial(palette.pants),
      shoes: this.createToonMaterial(palette.shoes)
    };

    // ==================== 1. FACELESS HEAD & NECK ====================
    const headGroup = new THREE.Group();
    headGroup.name = 'Head';
    headGroup.position.set(0, 1.95, 0);

    const headGeom = new THREE.SphereGeometry(0.46, 32, 32);
    const head = this.createOutlinedMesh(headGeom, this.materials.white, 0.03);
    head.position.y = 0.36;
    headGroup.add(head);

    // Hairstyle
    this.hairGroup = this.buildHairstyle(this.hairStyle);
    headGroup.add(this.hairGroup);

    const neckGeom = new THREE.CylinderGeometry(0.11, 0.13, 0.22, 16);
    const neck = this.createOutlinedMesh(neckGeom, this.materials.white, 0.025);
    neck.position.y = -0.02;
    headGroup.add(neck);
    group.add(headGroup);

    // ==================== 2. THREE-PIECE SUIT TORSO ====================
    const torsoGroup = new THREE.Group();
    torsoGroup.name = 'Torso';
    torsoGroup.position.set(0, 1.45, 0);

    // Main Tailored Jacket Body
    const jacketGeom = new THREE.CylinderGeometry(0.30, 0.35, 0.74, 24);
    const jacket = this.createOutlinedMesh(jacketGeom, this.materials.jacket, 0.028);
    jacket.scale.set(1.08, 1, 0.76);
    torsoGroup.add(jacket);

    // Inner Waistcoat (Vest) Center Panel
    const vestGeom = new THREE.CylinderGeometry(0.26, 0.30, 0.68, 20);
    const vest = this.createOutlinedMesh(vestGeom, this.materials.vest, 0.015);
    vest.position.set(0, -0.01, 0.045);
    vest.scale.set(0.65, 1, 0.78);
    torsoGroup.add(vest);

    // White Dress Shirt V-Front & Collar
    const shirtFrontGeom = new THREE.ConeGeometry(0.14, 0.30, 4);
    const shirtFront = this.createOutlinedMesh(shirtFrontGeom, this.materials.shirt, 0.02);
    shirtFront.rotation.z = Math.PI;
    shirtFront.rotation.y = Math.PI / 4;
    shirtFront.position.set(0, 0.23, 0.20);
    shirtFront.scale.set(1.1, 1, 0.5);
    torsoGroup.add(shirtFront);

    // Black Necktie (Knot + Blade)
    const knotGeom = new THREE.BoxGeometry(0.055, 0.055, 0.04);
    const tieKnot = this.createOutlinedMesh(knotGeom, this.materials.tie, 0.03);
    tieKnot.position.set(0, 0.31, 0.24);
    torsoGroup.add(tieKnot);

    const tieBladeGeom = new THREE.BoxGeometry(0.05, 0.26, 0.03);
    const tieBlade = this.createOutlinedMesh(tieBladeGeom, this.materials.tie, 0.03);
    tieBlade.position.set(0, 0.16, 0.25);
    torsoGroup.add(tieBlade);

    // Tailored Jacket Lapels (Left & Right)
    const lapelGeom = new THREE.BoxGeometry(0.08, 0.42, 0.04);
    [-1, 1].forEach((dir) => {
      const lapel = this.createOutlinedMesh(lapelGeom, this.materials.lapel, 0.03);
      lapel.position.set(dir * 0.11, 0.14, 0.25);
      lapel.rotation.z = dir * -0.22;
      torsoGroup.add(lapel);
    });

    // Three Vest Buttons
    const btnGeom = new THREE.SphereGeometry(0.018, 8, 8);
    [-0.04, -0.13, -0.22].forEach((yPos) => {
      const btn = new THREE.Mesh(btnGeom, this.materials.tie);
      btn.position.set(0, yPos, 0.27);
      torsoGroup.add(btn);
    });

    // White Pocket Square on Left Chest
    const squareGeom = new THREE.ConeGeometry(0.035, 0.05, 3);
    const pocketSquare = this.createOutlinedMesh(squareGeom, this.materials.shirt, 0.03);
    pocketSquare.position.set(0.18, 0.16, 0.25);
    torsoGroup.add(pocketSquare);

    // Structured Suit Shoulders
    const shoulderGeom = new THREE.SphereGeometry(0.32, 24, 16);
    const shoulders = this.createOutlinedMesh(shoulderGeom, this.materials.jacket, 0.025);
    shoulders.position.y = 0.27;
    shoulders.scale.set(1.14, 0.50, 0.76);
    torsoGroup.add(shoulders);

    group.add(torsoGroup);

    // ==================== 3. SUIT TROUSER PELVIS ====================
    const pelvisGroup = new THREE.Group();
    pelvisGroup.name = 'Pelvis';
    pelvisGroup.position.set(0, 1.02, 0);

    const hipsGeom = new THREE.CylinderGeometry(0.33, 0.33, 0.18, 24);
    const hips = this.createOutlinedMesh(hipsGeom, this.materials.pants, 0.025);
    hips.position.y = -0.08;
    hips.scale.set(1.04, 1, 0.74);
    pelvisGroup.add(hips);
    group.add(pelvisGroup);

    // ==================== 4. SUIT SLEEVES, WHITE SHIRT CUFFS & HANDS ====================
    const createArm = (isLeft) => {
      const dir = isLeft ? -1 : 1;
      const armPivot = new THREE.Group();
      armPivot.position.set(dir * 0.34, 1.74, 0);

      // Tailored Suit Sleeve
      const sleeveGeom = new THREE.CylinderGeometry(0.105, 0.13, 0.58, 16);
      const sleeve = this.createOutlinedMesh(sleeveGeom, this.materials.jacket, 0.03);
      sleeve.position.y = -0.27;
      armPivot.add(sleeve);

      // Crisp White Shirt Cuff Peeking Out
      const shirtCuffGeom = new THREE.CylinderGeometry(0.115, 0.115, 0.05, 16);
      const shirtCuff = this.createOutlinedMesh(shirtCuffGeom, this.materials.shirt, 0.03);
      shirtCuff.position.y = -0.58;
      armPivot.add(shirtCuff);

      // Cartoon Hand
      const handGroup = new THREE.Group();
      handGroup.name = 'Hand';
      handGroup.position.set(0, -0.68, 0);

      const palmGeom = new THREE.SphereGeometry(0.11, 16, 16);
      const palm = this.createOutlinedMesh(palmGeom, this.materials.white, 0.035);
      palm.scale.set(1.08, 1.14, 0.72);
      handGroup.add(palm);


      armPivot.add(handGroup);
      armPivot.rotation.z = dir * 0.30;
      return armPivot;
    };

    const leftArm = createArm(true);
    const rightArm = createArm(false);
    group.add(leftArm, rightArm);

    // ==================== 5. STRAIGHT TROUSERS & BLACK DRESS SHOES ====================
    const createLeg = (isLeft) => {
      const dir = isLeft ? -1 : 1;
      const legPivot = new THREE.Group();
      legPivot.position.set(dir * 0.18, 0.90, 0);

      // Straight Tailored Trouser Leg (no rolled cuffs)
      const pantGeom = new THREE.CylinderGeometry(0.145, 0.15, 0.72, 18);
      const pant = this.createOutlinedMesh(pantGeom, this.materials.pants, 0.03);
      pant.position.y = -0.36;
      legPivot.add(pant);

      // Black Formal Dress Shoe
      const shoeFootGeom = new THREE.CapsuleGeometry(0.12, 0.18, 12, 16);
      const shoeFoot = this.createOutlinedMesh(shoeFootGeom, this.materials.shoes, 0.03);
      shoeFoot.rotation.x = Math.PI / 2;
      shoeFoot.position.set(0, -0.80, 0.08);
      shoeFoot.scale.set(1.08, 1.05, 0.75);
      legPivot.add(shoeFoot);

      return legPivot;
    };

    const leftLeg = createLeg(true);
    const rightLeg = createLeg(false);
    group.add(leftLeg, rightLeg);

    this.characterParts = { head: headGroup, torso: torsoGroup, leftArm, rightArm, leftLeg, rightLeg };
    this.character = group;
    this.scene.add(this.character);
    return group;
  }

  /**
   * Builds a hairstyle for the head rig using the shared style library.
   * @param {string} style one of HAIR_STYLES
   */
  buildHairstyle(style) {
    return createHairstyle(style, this.materials.hair,
      (geometry, material, thickness) => this.createOutlinedMesh(geometry, material, thickness),
      this.headRadius, this.headOffsetY);
  }

  /**

  changeHairStyle(style) {

      console.warn(`Hair style "${style}" not found.`);
      return;

    this.hairStyle = style;

    const head = this.characterParts.head;
    if (!head) return;

    if (this.hairGroup) {
      head.remove(this.hairGroup);
      this.hairGroup.traverse((child) => {
        if (child.isMesh) child.geometry.dispose();
      });
    }
    this.hairGroup = this.buildHairstyle(style);
    head.add(this.hairGroup);

  changeOutfit(outfitName) {

    if (!palette) return;

    this.materials.jacket.color.setHex(palette.jacket);
    this.materials.vest.color.setHex(palette.vest);

    this.materials.shoes.color.setHex(palette.shoes);

  setWalking(walking) {

  }

  animate() {

    requestAnimationFrame(() => this.animate());
    const elapsed = this.clock.getElapsedTime();

    if (this.character && this.characterParts.head) {
      const { head, leftArm, rightArm, leftLeg, rightLeg } = this.characterParts;
      if (this.isWalking) {
        const speed = 5.5;
        leftLeg.rotation.x = Math.sin(elapsed * speed) * 0.45;
        rightLeg.rotation.x = -Math.sin(elapsed * speed) * 0.45;
        leftArm.rotation.x = -Math.sin(elapsed * speed) * 0.35;
        rightArm.rotation.x = Math.sin(elapsed * speed) * 0.35;
        this.character.position.y = Math.abs(Math.cos(elapsed * speed)) * 0.05;
      } else {
        head.position.y = 1.95 + Math.sin(elapsed * 2) * 0.015;
        leftArm.rotation.z = -0.30 - Math.sin(elapsed * 2) * 0.02;
        rightArm.rotation.z = 0.30 + Math.sin(elapsed * 2) * 0.02;
        this.character.position.y = 0;
      }
    }

    this.controls.update();
    this.renderer.render(this.scene, this.camera);

  onWindowResize() {

    const height = this.container.clientHeight;
    this.camera.aspect = width / height;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(width, height);
  }

  resetScene() {
    this.dispose();
    this.setupScene();
    this.addLights();
    this.createProceduralCharacter();
  }

  dispose() {
    if (this.scene && this.character) {
      this.scene.remove(this.character);
      this.character.traverse((child) => {
        if (child.isMesh) {
          child.geometry.dispose();
          if (child.material) {
            Array.isArray(child.material) ? child.material.forEach(m => m.dispose()) : child.material.dispose();
          }
        }
      });
    }
    this.character = null;
    this.characterParts = {};
  }
}

    mesh.receiveShadow = true;
    group.add(mesh);
    group.userData = { mainMesh: mesh };

    if (outlineThickness > 0) {
      const outlineMat = new THREE.MeshBasicMaterial({
        color: 0x0b0b0b,
        side: THREE.BackSide
      });
      const outlineMesh = new THREE.Mesh(geometry, outlineMat);
      outlineMesh.scale.setScalar(1 + outlineThickness);
      group.add(outlineMesh);
    }
    return group;
  }

  createProceduralCharacter() {
    if (this.character) this.dispose();

    const group = new THREE.Group();
    const palette = this.outfits.navyCoach;

    this.materials = {
      hair: this.createToonMaterial(0x9a7a52),
      white: this.createToonMaterial(0xffffff),
      tracksuit: this.createToonMaterial(palette.tracksuit),
      ribbing: this.createToonMaterial(palette.ribbing),
      poloShirt: this.createToonMaterial(palette.poloShirt),
      whistle: this.createToonMaterial(palette.whistle),

      coachBadge: new THREE.MeshBasicMaterial({
        map: this.createCoachBackBadgeTexture(palette.tracksuit)
      })
    };

    // ==================== 1. FACELESS HEAD & NECK ====================
    const headGroup = new THREE.Group();
    headGroup.name = 'Head';
    headGroup.position.set(0, 1.95, 0);

    const headGeom = new THREE.SphereGeometry(0.46, 32, 32);
    const head = this.createOutlinedMesh(headGeom, this.materials.white, 0.03);
    head.position.y = 0.36;
    headGroup.add(head);

    // Hairstyle
    this.hairGroup = this.buildHairstyle(this.hairStyle);
    headGroup.add(this.hairGroup);

    const neckGeom = new THREE.CylinderGeometry(0.11, 0.13, 0.22, 16);
    const neck = this.createOutlinedMesh(neckGeom, this.materials.white, 0.025);
    neck.position.y = -0.02;
    headGroup.add(neck);
    group.add(headGroup);

    // ==================== 2. COACH TRACKSUIT HOODIE & WHISTLE ====================
    const torsoGroup = new THREE.Group();
    torsoGroup.name = 'Torso';
    torsoGroup.position.set(0, 1.45, 0);

    // Main Navy Tracksuit Torso
    const torsoGeom = new THREE.CylinderGeometry(0.30, 0.35, 0.70, 24);
    const torso = this.createOutlinedMesh(torsoGeom, this.materials.tracksuit, 0.028);
    torso.scale.set(1.08, 1, 0.78);

    // Ribbed Waistband Hem

    const hem = this.createOutlinedMesh(hemGeom, this.materials.ribbing, 0.025);
    hem.position.y = -0.34;
    hem.scale.set(1.08, 1, 0.78);
    torsoGroup.add(hem);

    // White Inner Polo Collar V-Insert
    const poloInsertGeom = new THREE.ConeGeometry(0.13, 0.22, 4);
    const poloInsert = this.createOutlinedMesh(poloInsertGeom, this.materials.poloShirt, 0.02);
    poloInsert.rotation.z = Math.PI;
    poloInsert.rotation.y = Math.PI / 4;
    poloInsert.position.set(0, 0.28, 0.20);
    poloInsert.scale.set(1, 1, 0.5);
    torsoGroup.add(poloInsert);

    // Hood & Collar around Neck
    const collarGeom = new THREE.TorusGeometry(0.22, 0.085, 16, 24);
    const collar = this.createOutlinedMesh(collarGeom, this.materials.tracksuit, 0.03);
    collar.position.set(0, 0.40, -0.02);
    collar.rotation.x = Math.PI / 2 + 0.15;
    collar.scale.set(1.1, 1.15, 0.9);
    torsoGroup.add(collar);

    const backHoodGeom = new THREE.SphereGeometry(0.22, 20, 20);
    const backHood = this.createOutlinedMesh(backHoodGeom, this.materials.tracksuit, 0.03);
    backHood.position.set(0, 0.36, -0.22);
    backHood.scale.set(1.05, 0.85, 0.95);
    torsoGroup.add(backHood);

    // "COACH" Back Text Plate (Visible when rotating character to the back)
    const badgeGeom = new THREE.PlaneGeometry(0.34, 0.16);
    const badgeMesh = new THREE.Mesh(badgeGeom, this.materials.coachBadge);
    badgeMesh.position.set(0, 0.10, -0.275);
    badgeMesh.rotation.y = Math.PI;
    torsoGroup.add(badgeMesh);

    // Orange Lanyard & Whistle on Front Chest
    const lanyardGeom = new THREE.TorusGeometry(0.15, 0.015, 10, 24);
    const lanyard = this.createOutlinedMesh(lanyardGeom, this.materials.whistle, 0.04);
    lanyard.position.set(0, 0.26, 0.23);
    lanyard.scale.set(0.75, 1.35, 0.5);
    torsoGroup.add(lanyard);

    const whistleBodyGeom = new THREE.CylinderGeometry(0.035, 0.035, 0.07, 16);
    const whistleBody = this.createOutlinedMesh(whistleBodyGeom, this.materials.whistle, 0.04);
    whistleBody.rotation.z = Math.PI / 2;
    whistleBody.position.set(0, 0.04, 0.28);
    torsoGroup.add(whistleBody);

    const whistleTipGeom = new THREE.BoxGeometry(0.04, 0.05, 0.04);
    const whistleTip = this.createOutlinedMesh(whistleTipGeom, this.materials.whistle, 0.04);
    whistleTip.position.set(0, 0.07, 0.28);
    torsoGroup.add(whistleTip);

    // Rounded Shoulders
    const shoulderGeom = new THREE.SphereGeometry(0.32, 24, 16);
    const shoulders = this.createOutlinedMesh(shoulderGeom, this.materials.tracksuit, 0.025);
    shoulders.position.y = 0.26;
    shoulders.scale.set(1.12, 0.55, 0.78);
    torsoGroup.add(shoulders);

    group.add(torsoGroup);

    // ==================== 3. TRACKSUIT PANTS PELVIS ====================
    const pelvisGroup = new THREE.Group();
    pelvisGroup.name = 'Pelvis';
    pelvisGroup.position.set(0, 1.02, 0);

    const hipsGeom = new THREE.CylinderGeometry(0.34, 0.34, 0.18, 24);
    const hips = this.createOutlinedMesh(hipsGeom, this.materials.tracksuit, 0.025);
    hips.position.y = -0.08;
    hips.scale.set(1.05, 1, 0.76);
    pelvisGroup.add(hips);
    group.add(pelvisGroup);

    // ==================== 4. ARMS & HANDS ====================
    const createArm = (isLeft) => {
      const dir = isLeft ? -1 : 1;
      const armPivot = new THREE.Group();
      armPivot.position.set(dir * 0.34, 1.74, 0);

      const sleeveGeom = new THREE.CylinderGeometry(0.11, 0.15, 0.60, 16);
      const sleeve = this.createOutlinedMesh(sleeveGeom, this.materials.tracksuit, 0.03);
      sleeve.position.y = -0.28;
      armPivot.add(sleeve);

      const sleeveCuffGeom = new THREE.TorusGeometry(0.115, 0.035, 12, 20);
      const sleeveCuff = this.createOutlinedMesh(sleeveCuffGeom, this.materials.ribbing, 0.03);
      sleeveCuff.rotation.x = Math.PI / 2;
      sleeveCuff.position.y = -0.58;
      armPivot.add(sleeveCuff);

      const handGroup = new THREE.Group();
      handGroup.name = 'Hand';
      handGroup.position.set(0, -0.68, 0);

      const palmGeom = new THREE.SphereGeometry(0.11, 16, 16);
      const palm = this.createOutlinedMesh(palmGeom, this.materials.white, 0.035);
      palm.scale.set(1.08, 1.14, 0.72);
      handGroup.add(palm);


      armPivot.add(handGroup);
      armPivot.rotation.z = dir * 0.32;
      return armPivot;
    };

    const leftArm = createArm(true);
    const rightArm = createArm(false);
    group.add(leftArm, rightArm);

    // ==================== 5. TRACKPANTS & WHITE-SOLED SNEAKERS ====================
    const createLeg = (isLeft) => {
      const dir = isLeft ? -1 : 1;
      const legPivot = new THREE.Group();
      legPivot.position.set(dir * 0.18, 0.90, 0);

      // Navy Tracksuit Pant Leg
      const pantGeom = new THREE.CylinderGeometry(0.15, 0.145, 0.68, 18);
      const pant = this.createOutlinedMesh(pantGeom, this.materials.tracksuit, 0.03);
      pant.position.y = -0.34;
      legPivot.add(pant);

      // Ribbed Ankle Jogger Cuff
      const ankleCuffGeom = new THREE.CylinderGeometry(0.14, 0.135, 0.08, 18);
      const ankleCuff = this.createOutlinedMesh(ankleCuffGeom, this.materials.ribbing, 0.03);
      ankleCuff.position.y = -0.68;
      legPivot.add(ankleCuff);

      // Dark Navy Athletic Sneaker Upper
      const sneakerGeom = new THREE.CapsuleGeometry(0.125, 0.16, 12, 16);
      const sneaker = this.createOutlinedMesh(sneakerGeom, this.materials.sneakers, 0.03);
      sneaker.rotation.x = Math.PI / 2;
      sneaker.position.set(0, -0.79, 0.07);
      sneaker.scale.set(1.1, 1.0, 0.80);
      legPivot.add(sneaker);

      // White Sneaker Sole Rim
      const soleGeom = new THREE.CapsuleGeometry(0.13, 0.17, 12, 16);
      const sole = this.createOutlinedMesh(soleGeom, this.materials.sole, 0.025);
      sole.rotation.x = Math.PI / 2;
      sole.position.set(0, -0.84, 0.07);
      sole.scale.set(1.12, 1.02, 0.28);
      legPivot.add(sole);

      return legPivot;
    };

    const leftLeg = createLeg(true);
    const rightLeg = createLeg(false);
    group.add(leftLeg, rightLeg);

    this.characterParts = { head: headGroup, torso: torsoGroup, leftArm, rightArm, leftLeg, rightLeg };
    this.character = group;
    this.scene.add(this.character);
    return group;
  }

  /**
   * Builds a hairstyle for the head rig using the shared style library.
   * @param {string} style one of HAIR_STYLES
   */
  buildHairstyle(style) {
    return createHairstyle(style, this.materials.hair,
      (geometry, material, thickness) => this.createOutlinedMesh(geometry, material, thickness),
      this.headRadius, this.headOffsetY);
  }

  /**
   * Swaps the character's hairstyle.
   * @param {string} style one of HAIR_STYLES
   */
  changeHairStyle(style) {
    if (!HAIR_STYLES.includes(style)) {
      console.warn(`Hair style "${style}" not found.`);
      return;
    }
    this.hairStyle = style;

    const head = this.characterParts.head;
    if (!head) return;

    if (this.hairGroup) {
      head.remove(this.hairGroup);
      this.hairGroup.traverse((child) => {
        if (child.isMesh) child.geometry.dispose();
      });
    }
    this.hairGroup = this.buildHairstyle(style);
    head.add(this.hairGroup);
  }

  changeOutfit(outfitName) {
    const palette = this.outfits[outfitName];
    if (!palette) return;

    this.materials.tracksuit.color.setHex(palette.tracksuit);
    this.materials.ribbing.color.setHex(palette.ribbing);
    this.materials.poloShirt.color.setHex(palette.poloShirt);
    this.materials.whistle.color.setHex(palette.whistle);
    this.materials.sneakers.color.setHex(palette.sneakers);
    this.materials.sole.color.setHex(palette.sole);
    this.materials.coachBadge.map = this.createCoachBackBadgeTexture(palette.tracksuit);
    this.materials.coachBadge.needsUpdate = true;
  }

  setWalking(walking) {
    this.isWalking = walking;
  }

  animate() {
    if (this._dead) return;
    requestAnimationFrame(() => this.animate());
    const elapsed = this.clock.getElapsedTime();

    if (this.character && this.characterParts.head) {
      const { head, leftArm, rightArm, leftLeg, rightLeg } = this.characterParts;
      if (this.isWalking) {
        const speed = 6;
        leftLeg.rotation.x = Math.sin(elapsed * speed) * 0.5;
        rightLeg.rotation.x = -Math.sin(elapsed * speed) * 0.5;
        leftArm.rotation.x = -Math.sin(elapsed * speed) * 0.4;
        rightArm.rotation.x = Math.sin(elapsed * speed) * 0.4;
        this.character.position.y = Math.abs(Math.cos(elapsed * speed)) * 0.06;
      } else {
        head.position.y = 1.95 + Math.sin(elapsed * 2) * 0.015;
        leftArm.rotation.z = -0.32 - Math.sin(elapsed * 2) * 0.02;
        rightArm.rotation.z = 0.32 + Math.sin(elapsed * 2) * 0.02;
        this.character.position.y = 0;
      }
    }

    this.controls.update();
    this.renderer.render(this.scene, this.camera);
  }

  onWindowResize() {
    const width = this.container.clientWidth;
    const height = this.container.clientHeight;
    this.camera.aspect = width / height;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(width, height);
  }

  resetScene() {
    this.dispose();
    this.setupScene();
    this.addLights();
    this.createProceduralCharacter();
  }

  dispose() {
    if (this.scene && this.character) {
      this.scene.remove(this.character);
      this.character.traverse((child) => {
        if (child.isMesh) {
          child.geometry.dispose();
          if (child.material) {
            Array.isArray(child.material) ? child.material.forEach(m => m.dispose()) : child.material.dispose();
          }
        }
      });
    }
    this.character = null;
    this.characterParts = {};
  }
}

class SoccerOutfitApp {
  constructor(container) {
    this.container = container;
    this.scene = null;
    this.camera = null;
    this.renderer = null;
    this.controls = null;
    this.character = null;
    this.characterParts = {};
    this.animations = {};
    this.clock = new THREE.Clock();
    this.isWalking = false;
    this._dead = false;

    this.headRadius = 0.47;   // head sphere radius the hair is built around
    this.headOffsetY = 0.01;  // vertical offset of the head centre
    this.hairStyle = 'crop';

    this.outfits = {
      soccerRedWhite: {
        jerseyPrimary: 0xde1326,   // Vivid Classic Red
        jerseySecondary: 0xffffff, // White Stripes
        shorts: 0xde1326,          // Red Shorts
        socks: 0xffffff,           // White Socks
        sockStripes: 0xde1326,     // Red Sock Hoops
        cleats: 0xffffff,          // White Soccer Cleats
        studs: 0xd4d4d8            // Cleat Studs
      },
      awayBlueWhite: {
        jerseyPrimary: 0x1d4ed8,
        jerseySecondary: 0xffffff,
        shorts: 0x1e3a8a,
        socks: 0xffffff,
        sockStripes: 0x1d4ed8,
        cleats: 0x111111,
        studs: 0xffffff
      }
    };
  }

  async init() {
    this.setupScene();
    this.setupCamera();
    this.setupRenderer();
    this.setupControls();
    this.addLights();
    this.createProceduralCharacter();
    this.animate();
    return this;
  }

  setupScene() {
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0xfcf9e8);
  }

  setupCamera() {
    const aspect = this.container.clientWidth / this.container.clientHeight;
    this.camera = new THREE.PerspectiveCamera(40, aspect, 0.1, 1000);
    this.camera.position.set(0, 1.55, 4.3);
  }

  setupRenderer() {
    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.container.appendChild(this.renderer.domElement);
  }

  setupControls() {
    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.05;
    this.controls.target.set(0, 1.35, 0);
  }

  addLights() {
    const ambientLight = new THREE.AmbientLight(0xffffff, 2.2);
    this.scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.4);
    directionalLight.position.set(3, 6, 5);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    directionalLight.shadow.bias = -0.0005;
    this.scene.add(directionalLight);
  }

  createToonMaterial(colorHex, map = null) {
    const colors = new Uint8Array([230, 255]);
    const gradientMap = new THREE.DataTexture(colors, colors.length, 1, THREE.RedFormat);
    gradientMap.minFilter = THREE.NearestFilter;
    gradientMap.magFilter = THREE.NearestFilter;
    gradientMap.needsUpdate = true;

    const baseColor = new THREE.Color(colorHex);

    return new THREE.MeshToonMaterial({
      color: baseColor,
      map: map,
      gradientMap: gradientMap,
      emissive: baseColor,
      emissiveMap: map,
      emissiveIntensity: 0.35
    });
  }

  createStripedTexture(primaryHex, secondaryHex) {
    const canvas = document.createElement('canvas');
    canvas.width = 1024;
    canvas.height = 1024;
    const ctx = canvas.getContext('2d');
    const c1 = '#' + new THREE.Color(primaryHex).getHexString();
    const c2 = '#' + new THREE.Color(secondaryHex).getHexString();

    const stripes = 14;
    const stripeWidth = canvas.width / stripes;
    for (let i = 0; i < stripes; i++) {
      ctx.fillStyle = i % 2 === 0 ? c1 : c2;
      ctx.fillRect(Math.floor(i * stripeWidth), 0, Math.ceil(stripeWidth), canvas.height);
    }

    ctx.fillStyle = '#111111';
    ctx.fillRect(0, canvas.height - 22, canvas.width, 22);

    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.ClampToEdgeWrapping;
    texture.minFilter = THREE.NearestFilter;
    texture.magFilter = THREE.NearestFilter;
    texture.needsUpdate = true;
    return texture;
  }

  createOutlinedMesh(geometry, material, outlineThickness = 0.026) {
    const group = new THREE.Group();
    const mesh = new THREE.Mesh(geometry, material);
    mesh.castShadow = true;
    mesh.receiveShadow = false;
    group.add(mesh);
    group.userData = { mainMesh: mesh };

    if (outlineThickness > 0) {
      const outlineMat = new THREE.MeshBasicMaterial({
        color: 0x0b0b0b,
        side: THREE.BackSide
      });
      const outlineMesh = new THREE.Mesh(geometry, outlineMat);
      outlineMesh.scale.set(
        1 + outlineThickness,
        1 + outlineThickness * 0.85,
        1 + outlineThickness
      );
      outlineMesh.castShadow = false;
      outlineMesh.receiveShadow = false;
      group.add(outlineMesh);
    }
    return group;
  }

  createProceduralCharacter() {
    if (this.character) this.dispose();

    const group = new THREE.Group();
    const palette = this.outfits.soccerRedWhite;
    const stripedTex = this.createStripedTexture(palette.jerseyPrimary, palette.jerseySecondary);

    headGroup.position.set(0, 1.96, 0);

    const headGeom = new THREE.SphereGeometry(0.47, 36, 36);

    head.position.y = 0.37;
    headGroup.add(head);

    // Hairstyle
    this.hairGroup = this.buildHairstyle(this.hairStyle);
    headGroup.add(this.hairGroup);

    const neckGeom = new THREE.CylinderGeometry(0.115, 0.125, 0.20, 20);
    const neck = this.createOutlinedMesh(neckGeom, this.materials.graySkin, 0.028);
    neck.position.y = -0.04;
    headGroup.add(neck);

    group.add(headGroup);

    // ==================== 2. SEAMLESS STRIPED SOCCER JERSEY ====================
    const torsoGroup = new THREE.Group();
    torsoGroup.name = 'Torso';

    const torsoOutline = new THREE.Mesh(

    pelvisGroup.add(seam);

    group.add(pelvisGroup);

    // ==================== 4. SLEEVES & GRAY SKIN ARMS ====================
    const createArm = (isLeft) => {
      const dir = isLeft ? -1 : 1;

      const shoulderCapGeom = new THREE.SphereGeometry(0.125, 20, 16);

      const trimGeom = new THREE.CylinderGeometry(0.153, 0.153, 0.038, 20);
      const trim = this.createOutlinedMesh(trimGeom, this.materials.white, 0.028);
      trim.position.set(dir * 0.02, -0.28, 0);
      armPivot.add(trim);

      const forearmGeom = new THREE.CylinderGeometry(0.095, 0.105, 0.34, 20);
      const forearm = this.createOutlinedMesh(forearmGeom, this.materials.graySkin, 0.03);
      forearm.position.set(dir * 0.02, -0.44, 0);
      armPivot.add(forearm);

      const handGroup = new THREE.Group();
      handGroup.name = 'Hand';
      handGroup.position.set(dir * 0.02, -0.64, 0);

      const palmGeom = new THREE.SphereGeometry(0.115, 20, 20);
      const palm = this.createOutlinedMesh(palmGeom, this.materials.graySkin, 0.032);
      palm.scale.set(1.12, 1.08, 0.70);
      handGroup.add(palm);


      armPivot.add(handGroup);
      armPivot.rotation.z = dir * 0.28;
      return armPivot;
    };

    const leftArm = createArm(true);
    const rightArm = createArm(false);
    group.add(leftArm, rightArm);

    // ==================== 5. SHORTS LEGS, STRIPED SOCKS & CLEATS ====================
    const createLeg = (isLeft) => {
      const dir = isLeft ? -1 : 1;
      const legPivot = new THREE.Group();
      legPivot.position.set(dir * 0.175, 0.90, 0);

      const shortLegGeom = new THREE.CylinderGeometry(0.155, 0.175, 0.26, 20);
      const shortLeg = this.createOutlinedMesh(shortLegGeom, this.materials.shorts, 0.03);
      shortLeg.position.y = -0.12;
      legPivot.add(shortLeg);

      const kneeGeom = new THREE.CylinderGeometry(0.115, 0.112, 0.18, 20);
      const knee = this.createOutlinedMesh(kneeGeom, this.materials.graySkin, 0.03);
      knee.position.y = -0.32;
      legPivot.add(knee);

      const sockGeom = new THREE.CylinderGeometry(0.12, 0.115, 0.38, 20);
      const sock = this.createOutlinedMesh(sockGeom, this.materials.socks, 0.03);
      sock.position.y = -0.58;
      legPivot.add(sock);

      [-0.45, -0.52].forEach((yPos) => {
        const hoopGeom = new THREE.CylinderGeometry(0.124, 0.124, 0.034, 20);
        const hoop = this.createOutlinedMesh(hoopGeom, this.materials.sockStripes, 0.02);
        hoop.position.y = yPos;
        legPivot.add(hoop);
      });

      const cleatGroup = new THREE.Group();
      cleatGroup.position.set(0, -0.80, 0.06);
      cleatGroup.rotation.y = dir * 0.18;

      const cleatFootGeom = new THREE.CapsuleGeometry(0.12, 0.18, 14, 16);
      const cleatFoot = this.createOutlinedMesh(cleatFootGeom, this.materials.cleats, 0.032);
      cleatFoot.rotation.x = Math.PI / 2;
      cleatFoot.scale.set(1.08, 1.0, 0.78);
      cleatGroup.add(cleatFoot);

      const laceGeom = new THREE.BoxGeometry(0.08, 0.02, 0.09);
      const laces = new THREE.Mesh(laceGeom, this.materials.black);
      laces.position.set(0, 0.085, -0.01);
      laces.rotation.x = 0.25;
      cleatGroup.add(laces);

      const studGeom = new THREE.CylinderGeometry(0.022, 0.016, 0.045, 10);
      [-0.08, 0.02, 0.11].forEach((zOff) => {
        [-0.055, 0.055].forEach((xOff) => {
          const stud = this.createOutlinedMesh(studGeom, this.materials.studs, 0.035);
          stud.position.set(xOff, -0.095, zOff);
          cleatGroup.add(stud);
        });
      });

      legPivot.add(cleatGroup);
      return legPivot;
    };

    const leftLeg = createLeg(true);
    const rightLeg = createLeg(false);
    group.add(leftLeg, rightLeg);

    this.characterParts = {
      head: headGroup,
      torso: torsoGroup,
      leftArm,
      rightArm,
      leftLeg,
      rightLeg
    };

    this.character = group;
    this.scene.add(this.character);
    return group;
  }

  /**
   * Builds a hairstyle for the head rig using the shared style library.
   * @param {string} style one of HAIR_STYLES
   */
  buildHairstyle(style) {
    return createHairstyle(style, this.materials.hair,
      (geometry, material, thickness) => this.createOutlinedMesh(geometry, material, thickness),
      this.headRadius, this.headOffsetY);
  }

  /**
   * Swaps the character's hairstyle.
   * @param {string} style one of HAIR_STYLES
   */
  changeHairStyle(style) {
    if (!HAIR_STYLES.includes(style)) {
      console.warn(`Hair style "${style}" not found.`);
      return;
    }
    this.hairStyle = style;

    const head = this.characterParts.head;
    if (!head) return;

    if (this.hairGroup) {
      head.remove(this.hairGroup);
      this.hairGroup.traverse((child) => {
        if (child.isMesh) child.geometry.dispose();
      });
    }
    this.hairGroup = this.buildHairstyle(style);
    head.add(this.hairGroup);
  }

  changeOutfit(outfitName) {
    const palette = this.outfits[outfitName];
    if (!palette) return;

    const newStripeTex = this.createStripedTexture(palette.jerseyPrimary, palette.jerseySecondary);
    this.materials.jerseyStriped.map = newStripeTex;
    this.materials.jerseyStriped.emissiveMap = newStripeTex;
    this.materials.jerseyStriped.needsUpdate = true;

    const setMatColor = (mat, hex) => {
      mat.color.setHex(hex);
      if (mat.emissive) mat.emissive.setHex(hex);
    };

    setMatColor(this.materials.jerseySolid, palette.jerseyPrimary);
    setMatColor(this.materials.shorts, palette.shorts);
    setMatColor(this.materials.socks, palette.socks);
    setMatColor(this.materials.sockStripes, palette.sockStripes);
    setMatColor(this.materials.cleats, palette.cleats);
    setMatColor(this.materials.studs, palette.studs);
  }

  setWalking(walking) {
    this.isWalking = walking;
  }

  animate() {
    if (this._dead) return;
    requestAnimationFrame(() => this.animate());
    const elapsed = this.clock.getElapsedTime();

    if (this.character && this.characterParts.head) {
      const { head, leftArm, rightArm, leftLeg, rightLeg } = this.characterParts;
      if (this.isWalking) {
        const speed = 7;
        leftLeg.rotation.x = Math.sin(elapsed * speed) * 0.6;
        rightLeg.rotation.x = -Math.sin(elapsed * speed) * 0.6;
        leftArm.rotation.x = -Math.sin(elapsed * speed) * 0.45;
        rightArm.rotation.x = Math.sin(elapsed * speed) * 0.45;
        this.character.position.y = Math.abs(Math.cos(elapsed * speed)) * 0.07;
      } else {
        head.position.y = 1.96 + Math.sin(elapsed * 2) * 0.015;
        leftArm.rotation.z = -0.28 - Math.sin(elapsed * 2) * 0.02;
        rightArm.rotation.z = 0.28 + Math.sin(elapsed * 2) * 0.02;
        this.character.position.y = 0;
      }
    }

    this.controls.update();
    this.renderer.render(this.scene, this.camera);
  }

  onWindowResize() {
    const width = this.container.clientWidth;
    const height = this.container.clientHeight;
    this.camera.aspect = width / height;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(width, height);
  }

  resetScene() {
    this.dispose();
    this.setupScene();
    this.addLights();
    this.createProceduralCharacter();
  }

  dispose() {
    if (this.scene && this.character) {
      this.scene.remove(this.character);
      this.character.traverse((child) => {
        if (child.isMesh) {
          child.geometry.dispose();
          if (child.material) {
            Array.isArray(child.material) ? child.material.forEach(m => m.dispose()) : child.material.dispose();
          }
        }
      });
    }
    this.character = null;
    this.characterParts = {};
  }
}

class AnotherCasualOutfitApp {
  constructor(container) {
    this.container = container;
    this.scene = null;
    this.camera = null;
    this.renderer = null;
    this.controls = null;
    this.character = null;
    this.characterParts = {};
    this.animations = {};
    this.clock = new THREE.Clock();
    this.isWalking = false;

    this.headRadius = 0.46;   // head sphere radius the hair is built around
    this.headOffsetY = 0;  // vertical offset of the head centre

        sweater: 0xd5c1a1,     // Warm Beige Cable-Knit Sweater
        knitRibbing: 0xbeac90, // Ribbed Collar, Cuffs & Hem
        jeans: 0x7b98b2,       // Light-Wash Denim Blue Jeans

  async init() {
    this.setupScene();
    this.setupCamera();
    this.setupRenderer();
    this.setupControls();
    this.addLights();

  }

  setupScene() {
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0xfcf9e8);
  }

  setupCamera() {
    const aspect = this.container.clientWidth / this.container.clientHeight;
    this.camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
    this.camera.position.set(0, 1.8, 4.2);
  }

  setupRenderer() {
    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.container.appendChild(this.renderer.domElement);
  }

  setupControls() {
    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.05;
    this.controls.target.set(0, 1.3, 0);
  }

  addLights() {
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    this.scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
    directionalLight.position.set(4, 8, 5);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    this.scene.add(directionalLight);
  }

  createToonMaterial(colorHex, map = null) {
    const colors = new Uint8Array([215, 255]);
    const gradientMap = new THREE.DataTexture(colors, colors.length, 1, THREE.RedFormat);
    gradientMap.minFilter = THREE.NearestFilter;
    gradientMap.magFilter = THREE.NearestFilter;
    gradientMap.needsUpdate = true;

    return new THREE.MeshToonMaterial({
      color: colorHex,
      map: map,
      gradientMap: gradientMap
    });
  }

  createCableKnitTexture(baseHex, lineHex) {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#' + new THREE.Color(baseHex).getHexString();
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#' + new THREE.Color(lineHex).getHexString();
    ctx.lineWidth = 6;

    const cols = 12;
    const colW = canvas.width / cols;
    for (let i = 0; i <= cols; i++) {
      const x = i * colW;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
      ctx.stroke();

      // Subtle cable wave pattern between ribs
      if (i < cols) {
        ctx.beginPath();
        for (let y = 0; y < canvas.height; y += 32) {
          ctx.moveTo(x + colW * 0.25, y);
          ctx.quadraticCurveTo(x + colW * 0.5, y + 16, x + colW * 0.75, y + 32);
        }
        ctx.stroke();
      }
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.needsUpdate = true;
    return texture;
  }

  createOutlinedMesh(geometry, material, outlineThickness = 0.022) {
    const group = new THREE.Group();
    const mesh = new THREE.Mesh(geometry, material);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    group.add(mesh);
    group.userData = { mainMesh: mesh };

    if (outlineThickness > 0) {
      const outlineMat = new THREE.MeshBasicMaterial({
        color: 0x0b0b0b,
        side: THREE.BackSide
      });
      const outlineMesh = new THREE.Mesh(geometry, outlineMat);
      outlineMesh.scale.setScalar(1 + outlineThickness);
      group.add(outlineMesh);
    }
    return group;
  }

  createProceduralCharacter() {
    if (this.character) this.dispose();

    const group = new THREE.Group();
    const palette = this.outfits.beigeSweater;
    const knitTex = this.createCableKnitTexture(palette.sweater, palette.knitRibbing);

    this.materials = {
      hair: this.createToonMaterial(0x8a4a2a),
      white: this.createToonMaterial(0xffffff),
      sweaterKnit: this.createToonMaterial(0xffffff, knitTex),
      knitRibbing: this.createToonMaterial(palette.knitRibbing),
      jeans: this.createToonMaterial(palette.jeans),
      cuffs: this.createToonMaterial(palette.cuffs),

      boots: this.createToonMaterial(palette.boots),

    };

    // ==================== 1. FACELESS HEAD & NECK ====================
    const headGroup = new THREE.Group();
    headGroup.name = 'Head';
    headGroup.position.set(0, 1.95, 0);

    const headGeom = new THREE.SphereGeometry(0.46, 32, 32);
    const head = this.createOutlinedMesh(headGeom, this.materials.white, 0.03);

    // Hairstyle

    const neckGeom = new THREE.CylinderGeometry(0.11, 0.13, 0.22, 16);
    const neck = this.createOutlinedMesh(neckGeom, this.materials.white, 0.025);
    neck.position.y = -0.02;
    headGroup.add(neck);
    group.add(headGroup);

    // ==================== 2. CABLE-KNIT SWEATER (NO HOOD) ====================
    const torsoGroup = new THREE.Group();
    torsoGroup.name = 'Torso';
    torsoGroup.position.set(0, 1.45, 0);

    // Main Knit Sweater Torso
    const torsoGeom = new THREE.CylinderGeometry(0.30, 0.35, 0.68, 24);
    const torso = this.createOutlinedMesh(torsoGeom, this.materials.sweaterKnit, 0.028);
    torso.scale.set(1.08, 1, 0.78);

    // Rounded Knit Shoulders

    // ==================== 3. TAN BELT & LIGHT-WASH JEANS PELVIS ====================

    // ==================== 4. KNIT SLEEVES, RIBBED CUFFS & HANDS ====================
    const createArm = (isLeft) => {
      const dir = isLeft ? -1 : 1;

    this.addLights();
    this.createProceduralCharacter();
  }

  dispose() {
    if (this.scene && this.character) {
      this.scene.remove(this.character);
      this.character.traverse((child) => {
        if (child.isMesh) {
          child.geometry.dispose();
          if (child.material) {
            Array.isArray(child.material) ? child.material.forEach(m => m.dispose()) : child.material.dispose();
          }
        }
      });
    }
    this.character = null;
    this.characterParts = {};
  }
}

/**

 * Chairman shares the same proportions and joint positions as every other

      }
