<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Character Viewer</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
    }
  }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 15px 25px;
      border-radius: 8px;
      display: flex;
      gap: 15px;
      z-index: 100;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 90vw;
    }
    .character-select {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .character-select label {
      font-size: 10px;
      color: #888;
    }
    .character-select select {
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      background: #2a2a2a;
      color: white;
      border: 1px solid #444;
      cursor: pointer;
    }
    .character-select select:hover {
      border-color: #4a90d9;
    }
    .controls button {
      padding: 8px 16px;
      cursor: pointer;
      background: #4a90d9;
      border: none;
      border-radius: 4px;
      color: white;
      font-size: 12px;
    }
    .controls button:hover {
      background: #357abd;
    }
    .controls button.active {
      background: #ff6b6b;
    }
    .info {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      z-index: 100;
      max-width: 250px;
    }
    .info h3 {
      margin-bottom: 10px;
      color: #4a90d9;
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 30px;
      border-radius: 8px;
      z-index: 200;
      display: none;
    }
    .loading.active {
      display: block;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  
  <div class="info">
    <h3>Controls</h3>
    <div>🖱️ Left click + drag: Rotate</div>
    <div>🖱️ Right click + drag: Pan</div>
    <div>🖱️ Scroll: Zoom</div>
    <br>
  </div>
  
  <div class="controls">
    <select id="character-selector">
      <optgroup label="Characters">
        <option value="default">Default Hoodie</option>
        <option value="suit">Three-Piece Suit</option>
        <option value="coach">Coach Tracksuit</option>
        <option value="soccer">Soccer Jersey</option>
        <option value="casual">Casual Sweater</option>
        <option value="chairman">The Chairman</option>
        <option value="newowner">The New Owner</option>
      </optgroup>
      <optgroup label="Environments">
        <option value="stadium">⚽ Stadium (Buluh FC)</option>
        <option value="locker">🚿 Locker Room</option>
        <option value="office">🏢 Manager Office</option>
      </optgroup>
    </select>
    <button id="btn-procedural">Load Selected</button>
    <button id="btn-gltf">Load GLTF File</button>
    <button id="btn-inspector" class="active">Inspector ON</button>
    <button id="btn-reset">Reset View</button>
  </div>
  
  <div class="loading" id="loading">
    <div>Loading character...</div>
  </div>

  <script type="module">
    import { CharacterInspector } from './Inspector.js';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

    const characterClasses = {
      default: () => import('./characters/character-default.js').then(m => m.App),
      suit: () => import('./characters/character-suit.js').then(m => m.SuitOutfitApp),
      coach: () => import('./characters/character-coach.js').then(m => m.SoccerCoachOutfitApp),
      soccer: () => import('./characters/character-soccer.js').then(m => m.SoccerOutfitApp),
      casual: () => import('./characters/character-casual.js').then(m => m.AnotherCasualOutfitApp),
      stadium: () => import('./environments/stadium.js').then(m => m.StadiumApp),
      chairman: () => import('./characters/character-chairman.js').then(m => m.ChairmanApp),
      newowner: () => import('./characters/character-new-owner.js').then(m => m.NewOwnerApp),
      locker: () => import('./environments/locker-room.js').then(m => m.LockerRoomApp),
      office: () => import('./environments/manager-office.js').then(m => m.ManagerOfficeApp)
    };
    const characterLabels = {
      default: 'Default Hoodie',
      suit: 'Three-Piece Suit',
      coach: 'Coach Tracksuit',
      soccer: 'Soccer Jersey',
      casual: 'Casual Sweater',
      stadium: 'Stadium – Buluh FC',
      chairman: 'The Chairman',
      newowner: 'The New Owner',
      locker: 'Locker Room',
      office: 'Manager Office'
    };

    const container = document.getElementById('canvas-container');
    const loadingEl = document.getElementById('loading');
    const inspectorEl = document.getElementById('btn-inspector');
    const characterSelector = document.getElementById('character-selector');

    let manager = null;
    let inspector = null;
    let inspectorVisible = true;
    let currentClass = null;

    async function loadCharacter(characterType) {
      loadingEl.classList.add('active');
      try {
        const loader = characterClasses[characterType];
        if (!loader) throw new Error(`Unknown character type: ${characterType}`);
        const CharClass = await loader();

        if (manager) {
          manager._dead = true;
          manager.dispose();
          manager.renderer?.domElement?.remove();
          manager.renderer?.dispose(); // free the WebGL context, browsers cap them ~16
        }
        if (inspector?.inspectorPanel) inspector.inspectorPanel.remove();

        manager = new CharClass(container);
        await manager.init();

        manager.character.userData.charName = characterLabels[characterType] || characterType;
        currentClass = CharClass;

        inspector = new CharacterInspector(manager);
        inspector.createPanel(container);
        inspector.character = manager.character;
        inspector.selectedObject = null;
        inspector.update();
        window.inspector = inspector;
      } catch (err) {
        console.error('Error loading character:', err);
        alert(`Error loading ${characterType}: ${err.message}`);
      }
      loadingEl.classList.remove('active');
    }

    async function init() {
      await loadCharacter('default');
      window.addEventListener('resize', () => manager?.onWindowResize());
    }

    document.getElementById('btn-procedural').addEventListener('click', () => {
      if (characterSelector.value) loadCharacter(characterSelector.value);
    });

    characterSelector.addEventListener('change', () => {
      loadCharacter(characterSelector.value);
    });

    document.getElementById('btn-gltf').addEventListener('click', () => {
      if (!manager || !currentClass) return;
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.gltf,.glb';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        loadingEl.classList.add('active');
        const url = URL.createObjectURL(file);
        try {
          const gltf = await new Promise((resolve, reject) => {
            new GLTFLoader().load(url, resolve, undefined, reject);
          });
          if (manager.character) {
            manager.scene.remove(manager.character);
            manager.character.traverse((child) => {
              if (!child.isMesh) return;
              child.geometry.dispose();
              const mats = Array.isArray(child.material) ? child.material : [child.material];
              mats.forEach((m) => m?.dispose());
            });
          }
          manager.character = gltf.scene;
          manager.characterParts = {}; // stale parts would snap the model to y=0 every frame
          manager.scene.add(gltf.scene);
          inspector.character = manager.character;
          inspector.selectedObject = null;
          inspector.update();
        } catch (err) {
          console.error('Error loading GLTF:', err);
          alert('Error loading GLTF file');
        }
        loadingEl.classList.remove('active');
        URL.revokeObjectURL(url);
      };
      input.click();
    });

    inspectorEl.addEventListener('click', () => {
      inspectorVisible = !inspectorVisible;
      inspectorEl.textContent = inspectorVisible ? 'Inspector ON' : 'Inspector OFF';
      inspectorEl.classList.toggle('active', inspectorVisible);
      if (inspector?.inspectorPanel) {
        inspector.inspectorPanel.style.display = inspectorVisible ? 'block' : 'none';
      }
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      if (manager?.homeCamera) {
        manager.camera.position.set(...manager.homeCamera);
        manager.controls.target.set(...manager.homeTarget);
      } else {
        manager.camera.position.set(3, 2, 3);
        manager.controls.target.set(0, 1, 0);
      }
      manager.controls.update();
    });

    init();
  </script>
</body>
</html>
