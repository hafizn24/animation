<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Character Viewer</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; font-family: sans-serif; }
    #canvas-container { width: 100%; height: 100%; }
    .controls {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8); color: white; padding: 15px 25px;
      border-radius: 8px; display: flex; gap: 15px; z-index: 100;
      flex-wrap: wrap; justify-content: center; max-width: 90vw;
    }
    .controls button {
      padding: 8px 16px; cursor: pointer; background: #4a90d9;
      border: none; border-radius: 4px; color: white; font-size: 12px;
    }
    .controls button:hover { background: #357abd; }
    .controls button.active { background: #ff6b6b; }
    .info {
      position: absolute; top: 10px; left: 10px; background: rgba(0, 0, 0, 0.8);
      color: white; padding: 15px; border-radius: 8px; font-family: monospace;
      font-size: 12px; z-index: 100; max-width: 250px;
    }
    .info h3 { margin-bottom: 10px; color: #4a90d9; }
    .loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9); color: white; padding: 30px;
      border-radius: 8px; z-index: 200; display: none;
    }
    .loading.active { display: block; }
    #error-panel {
      position: absolute; top: 10px; right: 10px; z-index: 300;
      background: rgba(120, 0, 0, 0.9); color: white; padding: 12px 16px;
      border-radius: 8px; font-family: monospace; font-size: 12px;
      max-width: 420px;
    }
    #error-panel[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="info">
    <h3>Controls</h3>
    <div>Left click + drag: Rotate</div>
    <div>Right click + drag: Pan</div>
    <div>Scroll: Zoom</div>
  </div>

  <div class="controls">
    <select id="character-selector"></select>
    <button id="btn-procedural">Load Selected</button>
    <button id="btn-gltf">Load GLTF File</button>
    <button id="btn-inspector" class="active">Inspector ON</button>
    <button id="btn-reset">Reset View</button>
  </div>

  <div class="loading" id="loading"><div>Loading character...</div></div>
  <div id="error-panel" hidden></div>

  <script type="module" src="./viewer/main.js"></script>
</body>
</html>
