  async init() {
    this.setupScene();
    this.setupCamera();
    this.setupRenderer();
    this.setupControls();
    this.addLights();
    this.createProceduralCharacter();
    this.animate();
    return this;
  }

  setupScene() {
    this.scene = new THREE.Scene();

    // Soft studio backdrop – keeps the near-white skin and shirt readable
    if (typeof document === 'undefined') {
      this.scene.background = new THREE.Color(0xd7d2c4);
      return;
    }
    const canvas = document.createElement('canvas');
    canvas.width = 8;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, '#9fb0ba');
    grad.addColorStop(0.5, '#d7d2c4');
    grad.addColorStop(1, '#efe9da');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 8, 256);
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    this.scene.background = texture;
  }

  setupCamera() {
    const aspect = this.container.clientWidth / this.container.clientHeight;
    this.camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
    this.camera.position.set(0, 1.8, 4.2);
    this.homeCamera = [0, 1.8, 4.2];
    this.homeTarget = [0, 1.3, 0];
  }

  setupRenderer() {
    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.container.appendChild(this.renderer.domElement);
  }

  setupControls() {
    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.05;
    this.controls.target.set(0, 1.3, 0);
  }

  addLights() {
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    this.scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
    directionalLight.position.set(4, 8, 5);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    this.scene.add(directionalLight);
  }

  createToonMaterial(colorHex) {
    const colors = new Uint8Array([215, 255]);
    const gradientMap = new THREE.DataTexture(colors, colors.length, 1, THREE.RedFormat);
    gradientMap.minFilter = THREE.NearestFilter;
    gradientMap.magFilter = THREE.NearestFilter;
    gradientMap.needsUpdate = true;

    return new THREE.MeshToonMaterial({
      color: colorHex,
      gradientMap: gradientMap
    });
  }

  createOutlinedMesh(geometry, material, outlineThickness = 0.022) {
    const group = new THREE.Group();
    const mesh = new THREE.Mesh(geometry, material);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    group.add(mesh);

    group.userData = { mainMesh: mesh };

    if (outlineThickness > 0) {
      const outlineMat = new THREE.MeshBasicMaterial({
        color: 0x0b0b0b,
        side: THREE.BackSide
      });
      const outlineMesh = new THREE.Mesh(geometry, outlineMat);
      outlineMesh.scale.setScalar(1 + outlineThickness);
      group.add(outlineMesh);
    }

    return group;
  }

  createProceduralCharacter() {
    if (this.character) {
      this.dispose();
    }

    const group = new THREE.Group();
    group.name = 'Chairman';
    const palette = this.outfits.boardroomGrey;

    this.materials = {
      hair: this.createToonMaterial(0xb9b7b0),
      skin: this.createToonMaterial(palette.skin),
      jacket: this.createToonMaterial(palette.jacket),
      vest: this.createToonMaterial(palette.vest),
      lapel: this.createToonMaterial(palette.lapel),
      shirt: this.createToonMaterial(palette.shirt),
      tie: this.createToonMaterial(palette.tie),
      pocket: this.createToonMaterial(palette.pocket),
      pants: this.createToonMaterial(palette.pants),
      cuffs: this.createToonMaterial(palette.cuffs),
      shoes: this.createToonMaterial(palette.shoes),
      gold: this.createToonMaterial(0xd9a441),
      wood: this.createToonMaterial(0x6b4a2e),
      black: new THREE.MeshBasicMaterial({ color: 0x111111 })
    };

    this.props = {};

    // ==================== 1. FACELESS HEAD & NECK ====================
    const headGroup = new THREE.Group();
    headGroup.name = 'Head';
    headGroup.position.set(0, 1.95, 0);

    const headGeom = new THREE.SphereGeometry(0.46, 32, 32);
    const head = this.createOutlinedMesh(headGeom, this.materials.skin, 0.03);
    head.position.y = 0.36;
    headGroup.add(head);

    // Hairstyle
    this.hairGroup = this.buildHairstyle(this.hairStyle);
    headGroup.add(this.hairGroup);

    // Round gold spectacles – seated on the face
    const rimGeom = new THREE.TorusGeometry(0.085, 0.013, 8, 20);
    [-1, 1].forEach((dir) => {
      const rim = this.createOutlinedMesh(rimGeom, this.materials.gold, 0.02);
      rim.position.set(dir * 0.155, 0.40, 0.452);
      rim.rotation.y = dir * 0.18;
      headGroup.add(rim);
    });
    const bridge = this.createOutlinedMesh(new THREE.BoxGeometry(0.085, 0.015, 0.015), this.materials.gold, 0.02);
    bridge.position.set(0, 0.412, 0.468);
    headGroup.add(bridge);
    [-1, 1].forEach((dir) => {
      const temple = this.createOutlinedMesh(new THREE.BoxGeometry(0.015, 0.015, 0.4), this.materials.gold, 0.02);
      temple.position.set(dir * 0.329, 0.412, 0.278);
      temple.rotation.y = dir > 0 ? 2.667 : -2.667;
      headGroup.add(temple);
    });

    const neckGeom = new THREE.CylinderGeometry(0.11, 0.13, 0.22, 16);
    const neck = this.createOutlinedMesh(neckGeom, this.materials.skin, 0.025);
    neck.position.y = -0.02;
    headGroup.add(neck);
    group.add(headGroup);

    // ==================== 2. GREY THREE-PIECE SUIT ====================
    const torsoGroup = new THREE.Group();
    torsoGroup.name = 'Torso';
    torsoGroup.position.set(0, 1.45, 0);

    const torsoGeom = new THREE.CylinderGeometry(0.30, 0.36, 0.72, 24);
    const torso = this.createOutlinedMesh(torsoGeom, this.materials.jacket, 0.028);
    torso.scale.set(1.08, 1, 0.78);
    torsoGroup.add(torso);

    // Waistcoat panel
    const vestGeom = new THREE.CylinderGeometry(0.26, 0.30, 0.68, 20);
    const vest = this.createOutlinedMesh(vestGeom, this.materials.vest, 0.015);
    vest.position.set(0, -0.01, 0.045);
    vest.scale.set(0.65, 1, 0.78);
    torsoGroup.add(vest);

    // White dress shirt V-front
    const shirtFrontGeom = new THREE.ConeGeometry(0.14, 0.30, 4);
    const shirtFront = this.createOutlinedMesh(shirtFrontGeom, this.materials.shirt, 0.02);
    shirtFront.rotation.z = Math.PI;
    shirtFront.rotation.y = Math.PI / 4;
    shirtFront.position.set(0, 0.26, 0.19);

    // Waistcoat buttons
    const btnGeom = new THREE.SphereGeometry(0.018, 8, 8);
    [-0.04, -0.13, -0.22].forEach((yPos) => {
      const btn = this.createOutlinedMesh(btnGeom, this.materials.gold, 0.03);

    // Gold watch chain across the waistcoat

      new THREE.TorusGeometry(0.12, 0.009, 6, 18, Math.PI),

    );
    chain.rotation.z = Math.PI;
    chain.position.set(0.03, -0.02, 0.265);
    torsoGroup.add(chain);

    // Red pocket square

    const pocketSquare = this.createOutlinedMesh(squareGeom, this.materials.pocket, 0.03);
    pocketSquare.position.set(0.18, 0.16, 0.25);
    torsoGroup.add(pocketSquare);

    const shoulderGeom = new THREE.SphereGeometry(0.32, 24, 16);
    const shoulders = this.createOutlinedMesh(shoulderGeom, this.materials.jacket, 0.025);
    shoulders.position.y = 0.26;
    shoulders.scale.set(1.12, 0.55, 0.78);
    torsoGroup.add(shoulders);
    group.add(torsoGroup);

    // ==================== 3. BELT & PELVIS ====================
    const pelvisGroup = new THREE.Group();
    pelvisGroup.name = 'Pelvis';
    pelvisGroup.position.set(0, 1.04, 0);

    const beltGeom = new THREE.CylinderGeometry(0.355, 0.355, 0.10, 24);
    const belt = this.createOutlinedMesh(beltGeom, this.materials.shoes, 0.025);
    belt.scale.set(1.06, 1, 0.78);
    pelvisGroup.add(belt);

    const buckleGeom = new THREE.CylinderGeometry(0.065, 0.065, 0.05, 20);
    const buckle = this.createOutlinedMesh(buckleGeom, this.materials.gold, 0.04);

    const hipsGeom = new THREE.CylinderGeometry(0.35, 0.34, 0.18, 24);

    hips.position.y = -0.12;
    hips.scale.set(1.05, 1, 0.76);
    pelvisGroup.add(hips);
    group.add(pelvisGroup);

    // ==================== 4. SUIT SLEEVES, CUFFS & HANDS ====================
    const createArm = (isLeft) => {
      const dir = isLeft ? -1 : 1;
      const armPivot = new THREE.Group();
      armPivot.name = isLeft ? 'LeftArm' : 'RightArm';
      armPivot.position.set(dir * 0.34, 1.74, 0);

      const sleeveGeom = new THREE.CylinderGeometry(0.11, 0.15, 0.62, 16);
      const sleeve = this.createOutlinedMesh(sleeveGeom, this.materials.jacket, 0.03);
      sleeve.position.y = -0.28;
      armPivot.add(sleeve);

      const sleeveCuffGeom = new THREE.TorusGeometry(0.115, 0.035, 12, 20);
      const sleeveCuff = this.createOutlinedMesh(sleeveCuffGeom, this.materials.shirt, 0.03);
      sleeveCuff.rotation.x = Math.PI / 2;
      sleeveCuff.position.y = -0.58;
      armPivot.add(sleeveCuff);

      const handGroup = new THREE.Group();
      handGroup.name = 'Hand';
      handGroup.position.set(0, -0.68, 0);

      const palmGeom = new THREE.SphereGeometry(0.11, 16, 16);
      const palm = this.createOutlinedMesh(palmGeom, this.materials.skin, 0.035);
      palm.scale.set(1.08, 1.14, 0.72);
      handGroup.add(palm);


      // Gold wristwatch
      const watchBand = this.createOutlinedMesh(
        new THREE.TorusGeometry(0.105, 0.018, 6, 16),
        this.materials.gold,
        0.02
      );
      watchBand.rotation.x = Math.PI / 2;
      watchBand.position.set(0, 0.09, 0);
      handGroup.add(watchBand);

      armPivot.add(handGroup);
      armPivot.rotation.z = dir * 0.32;

      // ---- Props carried in the right hand ----
      if (!isLeft) {
        // Walking cane
        const cane = new THREE.Group();
        cane.name = 'Cane';
        const shaft = this.createOutlinedMesh(
          new THREE.CylinderGeometry(0.022, 0.026, 1.05, 12),
          this.materials.wood,
          0.03
        );
        shaft.position.y = -0.52;
        cane.add(shaft);
        const handle = this.createOutlinedMesh(
          new THREE.TorusGeometry(0.062, 0.021, 8, 14, Math.PI * 1.1),
          this.materials.wood,
          0.03
        );
        handle.rotation.z = -0.45;
        handle.position.set(0, -0.02, 0.02);
        cane.add(handle);
        const ferrule = this.createOutlinedMesh(
          new THREE.CylinderGeometry(0.03, 0.026, 0.07, 10),
          this.materials.shoes,
          0.03
        );
        ferrule.position.y = -1.06;
        cane.add(ferrule);
        cane.position.set(0, -0.06, 0.02);
        cane.visible = false;
        handGroup.add(cane);
        this.props.cane = cane;

        // Gavel
        const gavel = new THREE.Group();
        gavel.name = 'Gavel';
        const gavelHead = this.createOutlinedMesh(
          new THREE.CylinderGeometry(0.052, 0.052, 0.13, 14),
          this.materials.wood,
          0.03
        );
        gavelHead.rotation.z = Math.PI / 2;
        gavel.add(gavelHead);
        const gavelHandle = this.createOutlinedMesh(
          new THREE.CylinderGeometry(0.022, 0.026, 0.24, 10),
          this.materials.wood,
          0.03
        );
        gavelHandle.position.set(0, -0.16, 0);
        gavel.add(gavelHandle);
        gavel.position.set(0, -0.06, 0.06);
        gavel.rotation.x = -0.5;
        gavel.visible = false;
        handGroup.add(gavel);
        this.props.gavel = gavel;

        // Smoking pipe
        const pipe = new THREE.Group();
        pipe.name = 'Pipe';
        const bowl = this.createOutlinedMesh(
          new THREE.CylinderGeometry(0.045, 0.035, 0.08, 12),
          this.materials.wood,
          0.03
        );
        bowl.position.set(0, -0.06, 0.04);
        pipe.add(bowl);
        const stem = this.createOutlinedMesh(
          new THREE.TorusGeometry(0.06, 0.014, 6, 12, Math.PI),
          this.materials.wood,
          0.03
        );
        stem.rotation.y = Math.PI / 2;
        stem.position.set(0, -0.02, 0.0);
        pipe.add(stem);
        pipe.position.set(0, -0.04, 0.02);
        pipe.visible = false;
        handGroup.add(pipe);
        this.props.pipe = pipe;
      }

      return armPivot;
    };

    const leftArm = createArm(true);
    const rightArm = createArm(false);
    group.add(leftArm, rightArm);

    // ==================== 5. TROUSERS & DRESS SHOES ====================
    const createLeg = (isLeft) => {
      const dir = isLeft ? -1 : 1;
      const legPivot = new THREE.Group();
      legPivot.name = isLeft ? 'LeftLeg' : 'RightLeg';
      legPivot.position.set(dir * 0.18, 0.90, 0);

      const pantGeom = new THREE.CylinderGeometry(0.145, 0.155, 0.62, 18);
      const pant = this.createOutlinedMesh(pantGeom, this.materials.pants, 0.03);
      pant.position.y = -0.30;
      legPivot.add(pant);

      const cuffGeom = new THREE.CylinderGeometry(0.17, 0.17, 0.11, 20);
      const cuff = this.createOutlinedMesh(cuffGeom, this.materials.cuffs, 0.03);
      cuff.position.y = -0.60;
      legPivot.add(cuff);

      const shoeShaftGeom = new THREE.CylinderGeometry(0.135, 0.15, 0.22, 18);
      const shoeShaft = this.createOutlinedMesh(shoeShaftGeom, this.materials.shoes, 0.03);

      legPivot.add(shoeShaft);

      const shoeFootGeom = new THREE.CapsuleGeometry(0.13, 0.16, 12, 16);
      const shoeFoot = this.createOutlinedMesh(shoeFootGeom, this.materials.shoes, 0.03);

      shoeFoot.scale.set(1.12, 1.0, 0.85);
      legPivot.add(shoeFoot);

      return legPivot;
    };

    const leftLeg = createLeg(true);
    const rightLeg = createLeg(false);
    group.add(leftLeg, rightLeg);

    this.characterParts = {
      head: headGroup,
      torso: torsoGroup,
      pelvis: pelvisGroup,
      leftArm,
      rightArm,
      leftLeg,
      rightLeg
    };

    this.character = group;
    this.scene.add(this.character);
    this.setPose('idle');
    return group;
  }

  /**
   * Applies a named pose from the pose library.
   * @param {string} poseName one of idle | walk | stride | thoughtful | gavel | pipe
   */
  setPose(poseName) {
    const pose = this.poses[poseName];
    if (!pose) {
      console.warn(`Pose "${poseName}" not found.`);
      return;
    }
    this.currentPose = poseName;
    this.isWalking = poseName === 'walk' || poseName === 'stride';

    const apply = (part, rot) => {
      if (!part) return;
      part.rotation.set(rot.x || 0, rot.y || 0, rot.z || 0);
    };

    apply(this.characterParts.head, pose.head);
    apply(this.characterParts.torso, pose.torso);
    apply(this.characterParts.leftArm, pose.leftArm);
    apply(this.characterParts.rightArm, pose.rightArm);
    apply(this.characterParts.leftLeg, pose.leftLeg);
    apply(this.characterParts.rightLeg, pose.rightLeg);

    Object.keys(this.props || {}).forEach((key) => {
      this.props[key].visible = !!(pose.props && pose.props[key]);
    });
  }

  /**
   * Builds a hairstyle for the head rig using the shared style library.
   * @param {string} style one of HAIR_STYLES
   */
  buildHairstyle(style) {
    return createHairstyle(style, this.materials.hair,
      (geometry, material, thickness) => this.createOutlinedMesh(geometry, material, thickness),
      this.headRadius, this.headOffsetY);
  }

  /**
   * Swaps the character's hairstyle.
   * @param {string} style one of HAIR_STYLES
   */
  changeHairStyle(style) {
    if (!HAIR_STYLES.includes(style)) {
      console.warn(`Hair style "${style}" not found.`);
      return;
    }
    this.hairStyle = style;

    const head = this.characterParts.head;
    if (!head) return;

    if (this.hairGroup) {
      head.remove(this.hairGroup);
      this.hairGroup.traverse((child) => {
        if (child.isMesh) child.geometry.dispose();
      });
    }
    this.hairGroup = this.buildHairstyle(style);
    head.add(this.hairGroup);
  }

  changeOutfit(outfitName) {
    const palette = this.outfits[outfitName];
    if (!palette) return;

    this.materials.jacket.color.setHex(palette.jacket);
    this.materials.vest.color.setHex(palette.vest);
    this.materials.lapel.color.setHex(palette.lapel);
    this.materials.shirt.color.setHex(palette.shirt);
    this.materials.tie.color.setHex(palette.tie);
    this.materials.pocket.color.setHex(palette.pocket);
    this.materials.pants.color.setHex(palette.pants);
    this.materials.cuffs.color.setHex(palette.cuffs);
    this.materials.shoes.color.setHex(palette.shoes);
    this.materials.skin.color.setHex(palette.skin);
  }

  setWalking(walking) {
    this.isWalking = walking;
  }

  animate() {
    if (this._dead) return;
    requestAnimationFrame(() => this.animate());
    const elapsed = this.clock.getElapsedTime();

    if (this.character && this.characterParts.head) {
      const { head, leftArm, rightArm, leftLeg, rightLeg } = this.characterParts;

      if (this.isWalking) {
        const speed = 4.2;
        leftLeg.rotation.x = Math.sin(elapsed * speed) * 0.42;
        rightLeg.rotation.x = -Math.sin(elapsed * speed) * 0.42;
        leftArm.rotation.x = -Math.sin(elapsed * speed) * 0.30;
        rightArm.rotation.x = Math.sin(elapsed * speed) * 0.30;
        this.character.position.y = Math.abs(Math.cos(elapsed * speed)) * 0.05;
      } else {
        head.position.y = 1.95 + Math.sin(elapsed * 2) * 0.015;
        this.character.position.y = 0;
      }
    }

    this.controls.update();
    this.renderer.render(this.scene, this.camera);
  }

  onWindowResize() {
    const width = this.container.clientWidth;
    const height = this.container.clientHeight;
    this.camera.aspect = width / height;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(width, height);
  }

  resetScene() {
    this.dispose();
    this.setupScene();
    this.addLights();
    this.createProceduralCharacter();
  }

  dispose() {
    if (this.scene && this.character) {
      this.scene.remove(this.character);
      this.character.traverse((child) => {
        if (child.isMesh) {
          child.geometry.dispose();
          if (child.material) {
            Array.isArray(child.material)
              ? child.material.forEach(m => m.dispose())
              : child.material.dispose();
          }
        }
      });
    }
    this.character = null;
    this.characterParts = {};
    this.animations = {};
    this.props = {};
  }
}

 *

 * Owner shares the same proportions and joint positions as every other

 */

  }

  async init() {
    this.setupScene();
    this.setupCamera();
    this.setupRenderer();
    this.setupControls();
    this.addLights();
    this.createProceduralCharacter();
    this.animate();
    return this;
  }

  setupScene() {
    this.scene = new THREE.Scene();

    // Soft studio backdrop – keeps the near-white skin and trainers readable
    if (typeof document === 'undefined') {
      this.scene.background = new THREE.Color(0xd7d2c4);
      return;
    }
    const canvas = document.createElement('canvas');
    canvas.width = 8;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, '#9fb0ba');
    grad.addColorStop(0.5, '#d7d2c4');
    grad.addColorStop(1, '#efe9da');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 8, 256);
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    this.scene.background = texture;
  }

  setupCamera() {
    const aspect = this.container.clientWidth / this.container.clientHeight;
    this.camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
    this.camera.position.set(0, 1.8, 4.2);
    this.homeCamera = [0, 1.8, 4.2];
    this.homeTarget = [0, 1.3, 0];
  }

  setupRenderer() {
    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.container.appendChild(this.renderer.domElement);
  }

  setupControls() {
    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.05;
    this.controls.target.set(0, 1.3, 0);
  }

  addLights() {
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    this.scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
    directionalLight.position.set(4, 8, 5);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    this.scene.add(directionalLight);
  }

  createToonMaterial(colorHex) {
    const colors = new Uint8Array([215, 255]);
    const gradientMap = new THREE.DataTexture(colors, colors.length, 1, THREE.RedFormat);
    gradientMap.minFilter = THREE.NearestFilter;
    gradientMap.magFilter = THREE.NearestFilter;
    gradientMap.needsUpdate = true;

    return new THREE.MeshToonMaterial({
      color: colorHex,
      gradientMap: gradientMap
    });
  }

  createOutlinedMesh(geometry, material, outlineThickness = 0.022) {
    const group = new THREE.Group();
    const mesh = new THREE.Mesh(geometry, material);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    group.add(mesh);

    group.userData = { mainMesh: mesh };

    if (outlineThickness > 0) {
      const outlineMat = new THREE.MeshBasicMaterial({
        color: 0x0b0b0b,
        side: THREE.BackSide
      });
      const outlineMesh = new THREE.Mesh(geometry, outlineMat);
      outlineMesh.scale.setScalar(1 + outlineThickness);
      group.add(outlineMesh);
    }

    return group;
  }

  createProceduralCharacter() {
    if (this.character) {
      this.dispose();
    }

    const group = new THREE.Group();
    group.name = 'NewOwner';
    const palette = this.outfits.navyOwner;

    this.materials = {
      hair: this.createToonMaterial(0x5b3a25),
      skin: this.createToonMaterial(palette.skin),
      sweater: this.createToonMaterial(palette.sweater),
      sweaterDark: this.createToonMaterial(palette.sweaterDark),
      jeans: this.createToonMaterial(palette.jeans),
      jeansDark: this.createToonMaterial(palette.jeansDark),
      shoes: this.createToonMaterial(palette.shoes),
      leather: this.createToonMaterial(palette.leather),
      leatherDark: this.createToonMaterial(0x4d2a13),
      gold: this.createToonMaterial(0xd9a441),
      silver: this.createToonMaterial(0xd7dade),
      white: this.createToonMaterial(0xfaf8f2),

    this.props = {};

    // ==================== 1. FACELESS HEAD & NECK ====================
    const headGroup = new THREE.Group();

    const headGeom = new THREE.SphereGeometry(0.46, 32, 32);

    // Hairstyle

    headGroup.add(this.hairGroup);

    const neckGeom = new THREE.CylinderGeometry(0.11, 0.13, 0.22, 16);
    const neck = this.createOutlinedMesh(neckGeom, this.materials.skin, 0.025);
    neck.position.y = -0.02;
    headGroup.add(neck);
    group.add(headGroup);

    // ==================== 2. NAVY KNITTED SWEATER ====================
    const torsoGroup = new THREE.Group();
    torsoGroup.name = 'Torso';
    torsoGroup.position.set(0, 1.45, 0);

    const torsoGeom = new THREE.CylinderGeometry(0.30, 0.36, 0.72, 24);
    const torso = this.createOutlinedMesh(torsoGeom, this.materials.sweater, 0.028);
    torso.scale.set(1.08, 1, 0.78);

    // Ribbed crew collar

    collar.rotation.x = Math.PI / 2 + 0.15;

    // Kangaroo pocket
    const pocketGeom = new THREE.BoxGeometry(0.36, 0.17, 0.08);
    const pocket = this.createOutlinedMesh(pocketGeom, this.materials.sweaterDark, 0.025);
    pocket.position.set(0, -0.18, 0.25);
    torsoGroup.add(pocket);

    // Ribbed hem
    const hemGeom = new THREE.TorusGeometry(0.355, 0.05, 10, 24);
    const hem = this.createOutlinedMesh(hemGeom, this.materials.sweaterDark, 0.03);
    hem.position.set(0, -0.34, 0);
    hem.rotation.x = Math.PI / 2;
    hem.scale.set(1.06, 0.78, 1);
    torsoGroup.add(hem);

    const shoulderGeom = new THREE.SphereGeometry(0.32, 24, 16);
    const shoulders = this.createOutlinedMesh(shoulderGeom, this.materials.sweater, 0.025);
    shoulders.position.y = 0.26;
    shoulders.scale.set(1.12, 0.55, 0.78);
    torsoGroup.add(shoulders);

    // ==================== 3. MESSENGER BAG & STRAP ====================
    const bagGroup = new THREE.Group();
    bagGroup.name = 'MessengerBag';
    torsoGroup.add(bagGroup);

    const strapGeom = new THREE.BoxGeometry(0.09, 0.80, 0.03);
    const strap = this.createOutlinedMesh(strapGeom, this.materials.leatherDark, 0.025);
    strap.position.set(0, 0.02, 0.255);
    strap.rotation.z = -0.74;
    bagGroup.add(strap);

    const bagBody = this.createOutlinedMesh(new THREE.BoxGeometry(0.34, 0.27, 0.14), this.materials.leather, 0.025);
    bagBody.position.set(0.40, -0.30, 0.14);
    bagGroup.add(bagBody);

    const flap = this.createOutlinedMesh(new THREE.BoxGeometry(0.36, 0.14, 0.03), this.materials.leatherDark, 0.025);
    flap.position.set(0.40, -0.20, 0.215);
    bagGroup.add(flap);

    const bagBuckle = this.createOutlinedMesh(new THREE.BoxGeometry(0.07, 0.05, 0.03), this.materials.gold, 0.03);
    bagBuckle.position.set(0.40, -0.25, 0.235);
    bagGroup.add(bagBuckle);

    group.add(torsoGroup);
    this.props.bag = bagGroup;

    // ==================== 4. BELT & PELVIS ====================
    const pelvisGroup = new THREE.Group();
    pelvisGroup.name = 'Pelvis';
    pelvisGroup.position.set(0, 1.04, 0);

    const beltGeom = new THREE.CylinderGeometry(0.355, 0.355, 0.10, 24);
    const belt = this.createOutlinedMesh(beltGeom, this.materials.leatherDark, 0.025);
    belt.scale.set(1.06, 1, 0.78);
    pelvisGroup.add(belt);

    const buckleGeom = new THREE.CylinderGeometry(0.065, 0.065, 0.05, 20);
    const buckle = this.createOutlinedMesh(buckleGeom, this.materials.gold, 0.04);

    const loopGeom = new THREE.BoxGeometry(0.035, 0.11, 0.03);

    group.add(pelvisGroup);

    // ==================== 5. SWEATER SLEEVES, CUFFS & HANDS ====================
    const createArm = (isLeft) => {
      const dir = isLeft ? -1 : 1;
      const armPivot = new THREE.Group();

      const sleeveGeom = new THREE.CylinderGeometry(0.11, 0.15, 0.62, 16);
      const sleeve = this.createOutlinedMesh(sleeveGeom, this.materials.sweater, 0.03);

      const sleeveCuffGeom = new THREE.TorusGeometry(0.115, 0.035, 12, 20);
      const sleeveCuff = this.createOutlinedMesh(sleeveCuffGeom, this.materials.sweaterDark, 0.03);
      sleeveCuff.rotation.x = Math.PI / 2;
      sleeveCuff.position.y = -0.58;
      armPivot.add(sleeveCuff);

      const handGroup = new THREE.Group();
      handGroup.name = 'Hand';
      handGroup.position.set(0, -0.68, 0);

      const palmGeom = new THREE.SphereGeometry(0.11, 16, 16);
      const palm = this.createOutlinedMesh(palmGeom, this.materials.skin, 0.035);
      palm.scale.set(1.08, 1.14, 0.72);
      handGroup.add(palm);


      // Dark wristwatch
      const watchBand = this.createOutlinedMesh(
        new THREE.TorusGeometry(0.105, 0.018, 6, 16),
        this.materials.black,
        0.02
      );
      watchBand.rotation.x = Math.PI / 2;
      watchBand.position.set(0, 0.1, 0);
      handGroup.add(watchBand);

      armPivot.add(handGroup);
      armPivot.rotation.z = dir * 0.32;

      // ---- Props carried in the right hand ----
      if (!isLeft) {
        // Car keys
        const keys = new THREE.Group();
        keys.name = 'CarKeys';
        const fob = this.createOutlinedMesh(new THREE.BoxGeometry(0.1, 0.16, 0.03), this.materials.black, 0.03);
        fob.position.set(0, -0.04, 0.03);
        keys.add(fob);
        [0, 1].forEach((i) => {
          const key = this.createOutlinedMesh(new THREE.BoxGeometry(0.045, 0.14, 0.014), this.materials.silver, 0.03);
          key.position.set(-0.05 + i * 0.09, -0.16, 0.03);
          key.rotation.z = 0.2 - i * 0.4;
          keys.add(key);
        });
        keys.position.set(0, -0.04, 0.02);
        keys.visible = false;
        handGroup.add(keys);
        this.props.keys = keys;

        // Presented document
        const document = new THREE.Group();
        document.name = 'Document';
        const sheet = this.createOutlinedMesh(new THREE.BoxGeometry(0.27, 0.35, 0.01), this.materials.white, 0.02);
        sheet.rotation.x = -0.35;
        document.add(sheet);
        const clip = this.createOutlinedMesh(new THREE.BoxGeometry(0.09, 0.03, 0.02), this.materials.gold, 0.03);
        clip.position.set(0, 0.15, 0.02);
        document.add(clip);
        document.position.set(0, -0.14, 0.17);
        document.visible = false;
        handGroup.add(document);
        this.props.document = document;

        // Coffee cup
        const coffee = new THREE.Group();
        coffee.name = 'CoffeeCup';
        const cup = this.createOutlinedMesh(new THREE.CylinderGeometry(0.055, 0.045, 0.12, 16), this.materials.white, 0.03);
        coffee.add(cup);
        const cupHandle = this.createOutlinedMesh(new THREE.TorusGeometry(0.035, 0.012, 8, 14), this.materials.white, 0.03);

        cupHandle.position.set(0.06, 0, 0);
        coffee.add(cupHandle);
        const brew = this.createOutlinedMesh(new THREE.CylinderGeometry(0.05, 0.05, 0.01, 16), this.materials.leatherDark, 0.02);
        brew.position.y = 0.058;
        coffee.add(brew);
        coffee.position.set(0, -0.08, 0.04);
        coffee.visible = false;
        handGroup.add(coffee);
        this.props.coffee = coffee;
      }

      return armPivot;
    };

    const leftArm = createArm(true);
    const rightArm = createArm(false);
    group.add(leftArm, rightArm);

    // ==================== 6. BLUE JEANS & WHITE TRAINERS ====================
    const createLeg = (isLeft) => {
      const dir = isLeft ? -1 : 1;
      const legPivot = new THREE.Group();
      legPivot.name = isLeft ? 'LeftLeg' : 'RightLeg';
      legPivot.position.set(dir * 0.18, 0.90, 0);

      const pantGeom = new THREE.CylinderGeometry(0.145, 0.155, 0.62, 18);
      const pant = this.createOutlinedMesh(pantGeom, this.materials.jeans, 0.03);
      pant.position.y = -0.30;
      legPivot.add(pant);

      const cuffGeom = new THREE.CylinderGeometry(0.17, 0.17, 0.11, 20);
      const cuff = this.createOutlinedMesh(cuffGeom, this.materials.jeansDark, 0.03);
      cuff.position.y = -0.60;
      legPivot.add(cuff);

      const trainerShaftGeom = new THREE.CylinderGeometry(0.135, 0.15, 0.22, 18);
      const trainerShaft = this.createOutlinedMesh(trainerShaftGeom, this.materials.shoes, 0.03);
      trainerShaft.position.y = -0.74;
      legPivot.add(trainerShaft);

      const trainerFootGeom = new THREE.CapsuleGeometry(0.13, 0.16, 12, 16);
      const trainerFoot = this.createOutlinedMesh(trainerFootGeom, this.materials.shoes, 0.03);
      trainerFoot.rotation.x = Math.PI / 2;
      trainerFoot.position.set(0, -0.82, 0.07);
      trainerFoot.scale.set(1.12, 1.0, 0.85);
      legPivot.add(trainerFoot);

      return legPivot;
    };

    const leftLeg = createLeg(true);
    const rightLeg = createLeg(false);
    group.add(leftLeg, rightLeg);

    this.characterParts = {
      head: headGroup,
      torso: torsoGroup,
      pelvis: pelvisGroup,
      leftArm,
      rightArm,
      leftLeg,
      rightLeg
    };

    this.character = group;
    this.scene.add(this.character);
    this.setPose('idle');
    return group;
  }

  /**
   * Applies a named pose from the pose library.
   * @param {string} poseName one of idle | walkA | walkB | walkC | handshake |
   *                       document | coffee | keys
   */
  setPose(poseName) {
    const pose = this.poses[poseName];
    if (!pose) {
      console.warn(`Pose "${poseName}" not found.`);
      return;
    }
    this.currentPose = poseName;
    this.isWalking = poseName === 'walkA' || poseName === 'walkB' || poseName === 'walkC';

    const apply = (part, rot) => {
      if (!part) return;
      part.rotation.set(rot.x || 0, rot.y || 0, rot.z || 0);
    };

    apply(this.characterParts.head, pose.head);
    apply(this.characterParts.torso, pose.torso);
    apply(this.characterParts.leftArm, pose.leftArm);
    apply(this.characterParts.rightArm, pose.rightArm);
    apply(this.characterParts.leftLeg, pose.leftLeg);
    apply(this.characterParts.rightLeg, pose.rightLeg);

    Object.keys(this.props || {}).forEach((key) => {
      if (key === 'bag') return;
      this.props[key].visible = !!(pose.props && pose.props[key]);
    });

    // Messenger bag – worn across the body or slung on the back
    if (this.props.bag) {
      const bagOn = !!(pose.props && (pose.props.bag || pose.props.bagBack));
      this.props.bag.visible = bagOn;
      this.props.bag.rotation.y = (pose.props && pose.props.bagBack) ? Math.PI : 0;
    }
  }

  /**
   * Builds a hairstyle for the head rig using the shared style library.
   * @param {string} style one of HAIR_STYLES
   */
  buildHairstyle(style) {
    return createHairstyle(style, this.materials.hair,
      (geometry, material, thickness) => this.createOutlinedMesh(geometry, material, thickness),
      this.headRadius, this.headOffsetY);
  }

  /**
   * Swaps the character's hairstyle.
   * @param {string} style one of HAIR_STYLES
   */
  changeHairStyle(style) {
    if (!HAIR_STYLES.includes(style)) {
      console.warn(`Hair style "${style}" not found.`);
      return;
    }
    this.hairStyle = style;

    const head = this.characterParts.head;
    if (!head) return;

    if (this.hairGroup) {
      head.remove(this.hairGroup);
      this.hairGroup.traverse((child) => {
        if (child.isMesh) child.geometry.dispose();
      });
    }
    this.hairGroup = this.buildHairstyle(style);
    head.add(this.hairGroup);
  }

  changeOutfit(outfitName) {
    const palette = this.outfits[outfitName];
    if (!palette) return;

    this.materials.sweater.color.setHex(palette.sweater);
    this.materials.sweaterDark.color.setHex(palette.sweaterDark);
    this.materials.jeans.color.setHex(palette.jeans);
    this.materials.jeansDark.color.setHex(palette.jeansDark);
    this.materials.shoes.color.setHex(palette.shoes);
    this.materials.leather.color.setHex(palette.leather);
    this.materials.skin.color.setHex(palette.skin);
  }

  setWalking(walking) {
    this.isWalking = walking;
  }

  animate() {
    if (this._dead) return;
    requestAnimationFrame(() => this.animate());
    const elapsed = this.clock.getElapsedTime();

    if (this.character && this.characterParts.head) {
      const { head, leftArm, rightArm, leftLeg, rightLeg } = this.characterParts;

      if (this.isWalking) {
        const speed = 6.2;
        leftLeg.rotation.x = Math.sin(elapsed * speed) * 0.5;
        rightLeg.rotation.x = -Math.sin(elapsed * speed) * 0.5;
        leftArm.rotation.x = -Math.sin(elapsed * speed) * 0.42;
        rightArm.rotation.x = Math.sin(elapsed * speed) * 0.42;
        this.character.position.y = Math.abs(Math.cos(elapsed * speed)) * 0.06;
      } else {
        head.position.y = 1.95 + Math.sin(elapsed * 2) * 0.015;
        this.character.position.y = 0;
      }
    }

    this.controls.update();
    this.renderer.render(this.scene, this.camera);
  }

  onWindowResize() {
    const width = this.container.clientWidth;
    const height = this.container.clientHeight;
    this.camera.aspect = width / height;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(width, height);
  }

  resetScene() {
    this.dispose();
    this.setupScene();
    this.addLights();
    this.createProceduralCharacter();
  }

  dispose() {
    if (this.scene && this.character) {
      this.scene.remove(this.character);
      this.character.traverse((child) => {
        if (child.isMesh) {
          child.geometry.dispose();
          if (child.material) {
            Array.isArray(child.material)
              ? child.material.forEach(m => m.dispose())
              : child.material.dispose();
          }
        }
      });
    }
    this.character = null;
    this.characterParts = {};
    this.animations = {};
    this.props = {};
  }
}

  setupScene() {
    this.scene = new THREE.Scene();

    if (typeof document === 'undefined') {
      this.scene.background = new THREE.Color(0xd7d2c4);
      return;
    }
    const canvas = document.createElement('canvas');
    canvas.width = 8;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, '#9fb0ba');
    grad.addColorStop(0.5, '#d7d2c4');
    grad.addColorStop(1, '#efe9da');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 8, 256);
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    this.scene.background = texture;
  }

  setupCamera() {
    const aspect = this.container.clientWidth / this.container.clientHeight;
    this.camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
    this.camera.position.set(0, 1.8, 4.2);
    this.homeCamera = [0, 1.8, 4.2];
    this.homeTarget = [0, 1.3, 0];

    directionalLight.shadow.mapSize.height = 2048;
    this.scene.add(directionalLight);

  createToonMaterial(colorHex) {
    const colors = new Uint8Array([215, 255]);
    const gradientMap = new THREE.DataTexture(colors, colors.length, 1, THREE.RedFormat);
    gradientMap.minFilter = THREE.NearestFilter;
    gradientMap.magFilter = THREE.NearestFilter;
    gradientMap.needsUpdate = true;

    return new THREE.MeshToonMaterial({
      color: colorHex,
      gradientMap: gradientMap
    });
  }

  createOutlinedMesh(geometry, material, outlineThickness = 0.022) {
    const group = new THREE.Group();
    const mesh = new THREE.Mesh(geometry, material);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    group.add(mesh);

    group.userData = { mainMesh: mesh };

    if (outlineThickness > 0) {
      const outlineMat = new THREE.MeshBasicMaterial({
        color: 0x0b0b0b,
        side: THREE.BackSide
      });
      const outlineMesh = new THREE.Mesh(geometry, outlineMat);
      outlineMesh.scale.setScalar(1 + outlineThickness);
      group.add(outlineMesh);
    }

    return group;
  }

    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#f6f4ee';
    ctx.fillRect(0, 0, 256, 256);
    ctx.fillStyle = '#1f2b47';
    ctx.fillRect(0, 0, 256, 46);
    ctx.fillStyle = '#d4af37';
    ctx.fillRect(0, 232, 256, 24);
    ctx.fillStyle = '#f6f4ee';
    ctx.font = 'bold 26px sans-serif';
    ctx.fillText('BULUH FC', 18, 32);
    ctx.fillStyle = '#1f2b47';
    ctx.font = 'bold 22px sans-serif';
    ctx.fillText('SPONSORSHIP', 16, 96);
    ctx.font = '18px sans-serif';
    ctx.fillText('PARTNERSHIP', 16, 132);
    ctx.fillText('PROPOSAL 2026', 16, 162);
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    return new THREE.MeshBasicMaterial({ map: texture });

        folder.add(label);
        const clip = this.createOutlinedMesh(new THREE.BoxGeometry(0.09, 0.028, 0.02), this.materials.gold, 0.03);
        clip.position.set(0, 0.20, 0.032);
        folder.add(clip);
        folder.position.set(0, -0.16, 0.12);
        folder.rotation.x = -0.35;
        folder.visible = false;
        handGroup.add(folder);
        this.props.folder = folder;
      }

      armPivot.add(handGroup);
      armPivot.rotation.z = dir * 0.32;
      return armPivot;
    };

    const leftArm = createArm(true);
    const rightArm = createArm(false);
    group.add(leftArm, rightArm);

    // Tailored trousers and dress shoes
    const createLeg = (isLeft) => {
      const dir = isLeft ? -1 : 1;
      const legPivot = new THREE.Group();
      legPivot.name = isLeft ? 'LeftLeg' : 'RightLeg';
      legPivot.position.set(dir * 0.18, 0.90, 0);

      const pant = this.createOutlinedMesh(new THREE.CylinderGeometry(0.145, 0.155, 0.62, 18), this.materials.pants, 0.03);
      pant.position.y = -0.30;
      legPivot.add(pant);

      const cuff = this.createOutlinedMesh(new THREE.CylinderGeometry(0.17, 0.17, 0.11, 20), this.materials.cuffs, 0.03);
      cuff.position.y = -0.60;
      legPivot.add(cuff);

      const shoeShaft = this.createOutlinedMesh(new THREE.CylinderGeometry(0.135, 0.15, 0.22, 18), this.materials.shoes, 0.03);
      shoeShaft.position.y = -0.74;
      legPivot.add(shoeShaft);

      const shoeFoot = this.createOutlinedMesh(new THREE.SphereGeometry(0.15, 18, 12), this.materials.shoes, 0.03);
      shoeFoot.position.set(0, -0.84, 0.08);
      shoeFoot.scale.set(0.95, 0.55, 1.55);
      legPivot.add(shoeFoot);

      return legPivot;
    };

    const leftLeg = createLeg(true);
    const rightLeg = createLeg(false);
    group.add(leftLeg, rightLeg);

    this.characterParts = {
      head: headGroup,
      torso: torsoGroup,
      pelvis: pelvisGroup,
      leftArm,
      rightArm,
      leftLeg,
      rightLeg
    };

    this.character = group;
    this.scene.add(this.character);
    this.setPose('idle');
    return group;
  }

  setPose(poseName) {
    const pose = this.poses[poseName];
    if (!pose) {
      console.warn(`Pose "${poseName}" not found.`);
      return;
    }
    this.currentPose = poseName;
    this.isWalking = poseName === 'walk';

    const apply = (part, rot) => {
      if (!part) return;
      part.rotation.set(rot.x || 0, rot.y || 0, rot.z || 0);
    };

    apply(this.characterParts.head, pose.head);
    apply(this.characterParts.torso, pose.torso);
    apply(this.characterParts.leftArm, pose.leftArm);
    apply(this.characterParts.rightArm, pose.rightArm);
    apply(this.characterParts.leftLeg, pose.leftLeg);
    apply(this.characterParts.rightLeg, pose.rightLeg);

    Object.keys(this.props || {}).forEach((key) => {
      if (key === 'watch') return;
      this.props[key].visible = !!(pose.props && pose.props[key]);
    });
  }

  buildHairstyle(style) {
    return createHairstyle(style, this.materials.hair,
      (geometry, material, thickness) => this.createOutlinedMesh(geometry, material, thickness),
      this.headRadius, this.headOffsetY);
  }

  changeHairStyle(style) {
    if (!HAIR_STYLES.includes(style)) {
      console.warn(`Hair style "${style}" not found.`);
      return;
    }
    this.hairStyle = style;

    const head = this.characterParts.head;
    if (!head) return;

    if (this.hairGroup) {
      head.remove(this.hairGroup);
      this.hairGroup.traverse((child) => {
        if (child.isMesh) child.geometry.dispose();
      });
    }
    this.hairGroup = this.buildHairstyle(style);
    head.add(this.hairGroup);
  }

  changeOutfit(outfitName) {
    const palette = this.outfits[outfitName];
    if (!palette) return;

    this.materials.jacket.color.setHex(palette.jacket);
    this.materials.vest.color.setHex(palette.vest);
    this.materials.lapel.color.setHex(palette.lapel);
    this.materials.shirt.color.setHex(palette.shirt);
    this.materials.tie.color.setHex(palette.tie);
    this.materials.pocket.color.setHex(palette.pocket);
    this.materials.pants.color.setHex(palette.pants);
    this.materials.cuffs.color.setHex(palette.cuffs);
    this.materials.shoes.color.setHex(palette.shoes);
    this.materials.skin.color.setHex(palette.skin);
  }

  setWalking(walking) {
    this.isWalking = walking;
  }

  animate() {
    if (this._dead) return;
    requestAnimationFrame(() => this.animate());
    const elapsed = this.clock.getElapsedTime();

    if (this.character && this.characterParts.head) {
      const { head, leftArm, rightArm, leftLeg, rightLeg } = this.characterParts;

      if (this.isWalking) {
        const speed = 4.6;
        leftLeg.rotation.x = Math.sin(elapsed * speed) * 0.44;
        rightLeg.rotation.x = -Math.sin(elapsed * speed) * 0.44;
        leftArm.rotation.x = -Math.sin(elapsed * speed) * 0.32;
        rightArm.rotation.x = Math.sin(elapsed * speed) * 0.32;
        this.character.position.y = Math.abs(Math.cos(elapsed * speed)) * 0.05;
      } else {
        head.position.y = 1.95 + Math.sin(elapsed * 2) * 0.015;
        this.character.position.y = 0;
      }
    }

    this.controls.update();
    this.renderer.render(this.scene, this.camera);
  }

  onWindowResize() {
    const width = this.container.clientWidth;
    const height = this.container.clientHeight;
    this.camera.aspect = width / height;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(width, height);
  }

  resetScene() {
    this.dispose();
    this.setupScene();
    this.addLights();
    this.createProceduralCharacter();
  }

  dispose() {
    if (this.scene && this.character) {
      this.scene.remove(this.character);
      this.character.traverse((child) => {
        if (child.isMesh) {
          child.geometry.dispose();
          if (child.material) {
            Array.isArray(child.material)
              ? child.material.forEach(m => m.dispose())
              : child.material.dispose();
          }
        }
      });
    }
    this.character = null;
    this.characterParts = {};
    this.animations = {};
    this.props = {};
  }
}

/**
 * StadiumApp – Procedural 3D model of a small English non-league football ground
 * inspired by "Buluh FC".
 *
 * Key structures (matching the reference photo):
 *   1. Green football pitch with white line markings
 *   2. Main covered grandstand with brick base, terrace, roof + signage
 *   3. Clubhouse building (left of grandstand)
 *   4. Metal perimeter railing around the pitch
 *   5. Two football goals
 *   6. Scoreboard (far side)
 *   7. Advertising boards along the grandstand
 *   8. Dirt/gravel standing area behind the railings
 *   9. Surrounding grass embankment
 */
class StadiumApp {
  constructor(container) {
    this.container = container;
    this.scene = null;
    this.camera = null;
    this.renderer = null;
    this.controls = null;
    this.character = null;      // root group – named "character" for inspector compat
    this.characterParts = {};
    this.clock = new THREE.Clock();
    this._dead = false;
  }

  async init() {
    this.setupScene();
    this.setupCamera();
    this.setupRenderer();
    this.setupControls();
    this.addLights();
    this.createProceduralCharacter();   // builds the stadium
    this.animate();
    return this;
  }

  /* ------------------------------------------------------------------ */
  /*  Boilerplate (same pattern as existing character apps)              */
  /* ------------------------------------------------------------------ */

  setupScene() {
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x87ceeb);   // light sky blue
    this.scene.fog = new THREE.Fog(0x87ceeb, 80, 200);
  }

  setupCamera() {
    const aspect = this.container.clientWidth / this.container.clientHeight;
    this.camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 500);
    // Bird's-eye-ish view showing the pitch, grandstand and clubhouse complex
    this.camera.position.set(-42, 27, -30);
    this.homeCamera = [-42, 27, -30];
    this.homeTarget = [-8, 2, 27];
  }

  setupRenderer() {
    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.container.appendChild(this.renderer.domElement);
  }

  setupControls() {
    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.05;
    this.controls.target.set(-8, 2, 27);
    this.controls.maxPolarAngle = Math.PI / 2.05;  // prevent going underground
    this.controls.minDistance = 10;
    this.controls.maxDistance = 140;
  }

  addLights() {
    // Ambient
    const ambient = new THREE.AmbientLight(0xffffff, 1.6);
    this.scene.add(ambient);

    // Sun – low afternoon light from the south-west so the clubhouse and
    // grandstand facades (which face the pitch) are lit
    const sun = new THREE.DirectionalLight(0xfff5e6, 2.0);
    sun.position.set(-45, 50, -32);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 4096;
    sun.shadow.mapSize.height = 4096;
    sun.shadow.camera.left = -60;
    sun.shadow.camera.right = 60;
    sun.shadow.camera.top = 60;
    sun.shadow.camera.bottom = -60;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 120;
    sun.shadow.bias = -0.0003;
    this.scene.add(sun);

    // Fill light from opposite side
    const fill = new THREE.DirectionalLight(0xb0d0ff, 0.6);
    fill.position.set(35, 22, 30);
    this.scene.add(fill);

    // Hemisphere for nice outdoor feeling
    const hemi = new THREE.HemisphereLight(0x87ceeb, 0x2d5a27, 0.5);
    this.scene.add(hemi);
  }

  /* ------------------------------------------------------------------ */
  /*  Toon-style material helpers (matching existing codebase)          */
  /* ------------------------------------------------------------------ */

  createToonMaterial(colorHex) {
    const colors = new Uint8Array([200, 240, 255]);
    const gradientMap = new THREE.DataTexture(colors, colors.length, 1, THREE.RedFormat);
    gradientMap.minFilter = THREE.NearestFilter;
    gradientMap.magFilter = THREE.NearestFilter;
    gradientMap.needsUpdate = true;

    return new THREE.MeshToonMaterial({
      color: colorHex,
      gradientMap: gradientMap,
    });
  }

  createStdMaterial(colorHex, opts = {}) {
    return new THREE.MeshStandardMaterial({
      color: colorHex,
      roughness: opts.roughness ?? 0.7,
      metalness: opts.metalness ?? 0.0,
      ...opts,
    });
  }

  /**
   * Builds a CanvasTexture from a 2D drawing callback.
   * @param {number} width  texture width in px
   * @param {number} height texture height in px
   * @param {Function} draw receives (ctx, width, height)
   */
  makeCanvasTexture(width, height, draw) {
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    draw(ctx, width, height);
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = 4;
    return texture;
  }

  /* ------------------------------------------------------------------ */
  /*  MAIN BUILD                                                        */
  /* ------------------------------------------------------------------ */

  createProceduralCharacter() {
    if (this.character) this.dispose();

    const root = new THREE.Group();
    root.name = 'Stadium';

    // ============================
    // 0. MATERIALS
    // ============================
    const mat = {
      grass:       this.createStdMaterial(0x3a8c3f, { roughness: 0.95 }),
      grassDark:   this.createStdMaterial(0x2d6e31, { roughness: 0.95 }),
      pitchLine:   this.createStdMaterial(0xffffff, { roughness: 0.8 }),
      dirt:        this.createStdMaterial(0x9e8a6e, { roughness: 1.0 }),
      brick:       this.createStdMaterial(0x8b4513, { roughness: 0.9 }),
      brickDark:   this.createStdMaterial(0x6b3410, { roughness: 0.9 }),
      concrete:    this.createStdMaterial(0xa8a8a8, { roughness: 0.85 }),
      concreteDark:this.createStdMaterial(0x808080, { roughness: 0.85 }),
      metal:       this.createStdMaterial(0xcccccc, { roughness: 0.3, metalness: 0.7 }),
      metalRail:   this.createStdMaterial(0xdddddd, { roughness: 0.4, metalness: 0.6 }),
      roofWhite:   this.createStdMaterial(0xe8e8e8, { roughness: 0.5, metalness: 0.2 }),
      roofUnder:   this.createStdMaterial(0x888888, { roughness: 0.6 }),
      signWhite:   this.createStdMaterial(0xf5f5f0, { roughness: 0.6 }),
      signGreen:   this.createStdMaterial(0x1a6b1a, { roughness: 0.7 }),
      wood:        this.createStdMaterial(0x8B7355, { roughness: 0.8 }),
      woodDark:    this.createStdMaterial(0x5c4a32, { roughness: 0.85 }),
      goalNet:     this.createStdMaterial(0xf4f4f4, {
        roughness: 0.9,
        wireframe: true,
        transparent: true,
        opacity: 0.35,
        side: THREE.DoubleSide
      }),
      goalNetBacking: this.createStdMaterial(0xffffff, {
        roughness: 0.95,
        transparent: true,
        opacity: 0.12,
        side: THREE.DoubleSide
      }),
      goalPost:    this.createStdMaterial(0xffffff, { roughness: 0.25, metalness: 0.1 }),
      goalBaseBar: this.createStdMaterial(0xdddddd, { roughness: 0.4, metalness: 0.3 }),
      goalTension: this.createStdMaterial(0x222222, { roughness: 0.6, metalness: 0.5 }),
      fence:       this.createStdMaterial(0xd0d0d0, { roughness: 0.5, metalness: 0.5 }),
      seat:        this.createStdMaterial(0x4a90d9, { roughness: 0.6 }),
      adBoard:     this.createStdMaterial(0xffffff, { roughness: 0.5 }),
      adBoardBlue: this.createStdMaterial(0x1a3a6b, { roughness: 0.5 }),
      scoreboard:  this.createStdMaterial(0x222222, { roughness: 0.5 }),
      red:         this.createStdMaterial(0xcc2222, { roughness: 0.7 }),
      windowGlass: this.createStdMaterial(0x6699cc, { roughness: 0.2, metalness: 0.1, transparent: true, opacity: 0.5 }),
      officeGlass: this.createStdMaterial(0xffe0aa, {
        roughness: 0.15, metalness: 0.1, emissive: 0xffcf85, emissiveIntensity: 0.55,
        transparent: true, opacity: 0.85,
      }),
      lampGlass:   this.createStdMaterial(0xffffff, {
        roughness: 0.25, emissive: 0xfff6dd, emissiveIntensity: 2.4,
      }),
      tarmac:      this.createStdMaterial(0x3c3f42, { roughness: 0.95 }),
      gravel:      this.createStdMaterial(0x8d8578, { roughness: 1.0 }),
      black:       this.createStdMaterial(0x111111),
    };

    // Players' tunnel – cut through the far touchline railing, north-west side
    const tunnelX = -29.5;
    const TUNNEL_GAP = 4.4;

    // Pitch dimensions (roughly to non-league scale, in meters)
    const pitchW = 64;   // width (touchline)
    const pitchH = 100;  // length (goal line to goal line)
    const pitchY = 0.01;

    // ============================
    // 1. GROUND & SURROUNDING AREA
    // ============================

    // Large ground plane (surrounding grass)
    const groundGeom = new THREE.PlaneGeometry(200, 200);
    const ground = new THREE.Mesh(groundGeom, mat.grassDark);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.05;
    ground.receiveShadow = true;
    root.add(ground);

    // Dirt pathway around pitch
    const dirtGeom = new THREE.PlaneGeometry(pitchW + 8, pitchH + 8);
    const dirtPlane = new THREE.Mesh(dirtGeom, mat.dirt);
    dirtPlane.rotation.x = -Math.PI / 2;
    dirtPlane.position.y = -0.02;
    dirtPlane.receiveShadow = true;
    root.add(dirtPlane);

    // Pitch surface
    const pitchGeom = new THREE.PlaneGeometry(pitchW, pitchH);
    const pitchPlane = new THREE.Mesh(pitchGeom, mat.grass);
    pitchPlane.rotation.x = -Math.PI / 2;
    pitchPlane.position.y = pitchY;
    pitchPlane.receiveShadow = true;
    root.add(pitchPlane);

    // Mowing stripes (alternating lighter/darker bands)
    const stripeCount = 12;
    const stripeW = pitchH / stripeCount;
    for (let i = 0; i < stripeCount; i++) {
      if (i % 2 === 0) continue;  // skip every other
      const sg = new THREE.PlaneGeometry(pitchW - 0.5, stripeW - 0.3);
      const sm = new THREE.Mesh(sg, this.createStdMaterial(0x44a048, { roughness: 0.95 }));
      sm.rotation.x = -Math.PI / 2;
      sm.position.y = pitchY + 0.005;
      sm.position.z = -pitchH / 2 + stripeW * i + stripeW / 2;
      sm.receiveShadow = true;
      root.add(sm);
    }

    // ============================
    // 2. PITCH LINE MARKINGS
    // ============================
    const lineThick = 0.12;
    const lineY = pitchY + 0.015;
    const halfW = pitchW / 2;
    const halfH = pitchH / 2;

    const addLine = (x, z, w, h) => {
      const g = new THREE.PlaneGeometry(w, h);
      const m = new THREE.Mesh(g, mat.pitchLine);
      m.rotation.x = -Math.PI / 2;
      m.position.set(x, lineY, z);
      m.receiveShadow = true;
      root.add(m);
    };

    // Touchlines (long sides)
    addLine(0, -halfH, pitchW, lineThick);
    addLine(0, halfH, pitchW, lineThick);
    // Goal lines (short sides)
    addLine(-halfW, 0, lineThick, pitchH);
    addLine(halfW, 0, lineThick, pitchH);
    // Halfway line
    addLine(0, 0, pitchW, lineThick);

    // Centre circle
    const circleGeom = new THREE.RingGeometry(9.15 - lineThick / 2, 9.15 + lineThick / 2, 64);
    const circle = new THREE.Mesh(circleGeom, mat.pitchLine);
    circle.rotation.x = -Math.PI / 2;
    circle.position.y = lineY;
    circle.receiveShadow = true;
    root.add(circle);

    // Centre spot
    const spotGeom = new THREE.CircleGeometry(0.3, 16);
    const spot = new THREE.Mesh(spotGeom, mat.pitchLine);
    spot.rotation.x = -Math.PI / 2;
    spot.position.y = lineY;
    root.add(spot);

    // Penalty areas (both ends)
    const penW = 40.3;   // width of penalty area
    const penD = 16.5;   // depth
    const sixW = 18.3;
    const sixD = 5.5;

    [1, -1].forEach(side => {
      const pz = side * halfH;
      const dir = -side;  // inward direction

      // Penalty area box
      addLine(0, pz + dir * penD / 2, penW, lineThick);    // far line
      addLine(-penW / 2, pz + dir * penD / 2, lineThick, penD);  // left
      addLine(penW / 2, pz + dir * penD / 2, lineThick, penD);   // right

      // 6-yard box
      addLine(0, pz + dir * sixD / 2, sixW, lineThick);
      addLine(-sixW / 2, pz + dir * sixD / 2, lineThick, sixD);
      addLine(sixW / 2, pz + dir * sixD / 2, lineThick, sixD);

      // Penalty spot
      const ps = new THREE.Mesh(spotGeom, mat.pitchLine);
      ps.rotation.x = -Math.PI / 2;
      ps.position.set(0, lineY, pz + dir * 11);
      root.add(ps);

      // Penalty arc
      const arcGeom = new THREE.RingGeometry(9.15 - lineThick / 2, 9.15 + lineThick / 2, 32,
        1, side > 0 ? Math.PI * 0.62 : -Math.PI * 0.38, Math.PI * 0.38 * 2);
      const arcMesh = new THREE.Mesh(arcGeom, mat.pitchLine);
      arcMesh.rotation.x = -Math.PI / 2;
      arcMesh.position.set(0, lineY, pz + dir * 11);
      root.add(arcMesh);
    });

    // Corner arcs
    const cornerR = 1;
    [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([cx, cz]) => {
      const startAngle = (cx > 0 ? (cz > 0 ? Math.PI : Math.PI / 2) : (cz > 0 ? -Math.PI / 2 : 0));
      const cGeom = new THREE.RingGeometry(cornerR - lineThick / 2, cornerR + lineThick / 2, 16,
        1, startAngle, Math.PI / 2);
      const cMesh = new THREE.Mesh(cGeom, mat.pitchLine);
      cMesh.rotation.x = -Math.PI / 2;
      cMesh.position.set(cx * halfW, lineY, cz * halfH);
      root.add(cMesh);
    });

    // ============================
    // 3. PERIMETER RAILING
    // ============================
    const railHeight = 1.1;
    const railOffset = 2.5;   // distance from pitch edge

    const createRailingSegment = (startX, startZ, endX, endZ) => {
      const dx = endX - startX;
      const dz = endZ - startZ;
      const length = Math.sqrt(dx * dx + dz * dz);
      const angle = Math.atan2(dx, dz);

      const railGroup = new THREE.Group();

      // Posts
      const postCount = Math.max(2, Math.floor(length / 2.5));
      const postGeom = new THREE.CylinderGeometry(0.03, 0.03, railHeight, 8);
      for (let i = 0; i <= postCount; i++) {
        const t = i / postCount;
        const post = new THREE.Mesh(postGeom, mat.metalRail);
        post.position.set(
          startX + dx * t,
          railHeight / 2,
          startZ + dz * t
        );
        post.castShadow = true;
        railGroup.add(post);
      }

      // Horizontal rails (top and middle)
      [railHeight * 0.95, railHeight * 0.5, railHeight * 0.15].forEach(h => {
        const barGeom = new THREE.CylinderGeometry(0.02, 0.02, length, 8);
        const bar = new THREE.Mesh(barGeom, mat.metalRail);
        bar.position.set(
          (startX + endX) / 2,
          h,
          (startZ + endZ) / 2
        );
        bar.rotation.z = Math.PI / 2;
        bar.rotation.y = -angle;
        // Actually rotate to align with the segment direction
        const quat = new THREE.Quaternion();
        const dir = new THREE.Vector3(dx, 0, dz).normalize();
        const up = new THREE.Vector3(0, 1, 0);
        const right = new THREE.Vector3().crossVectors(up, dir).normalize();
        bar.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
        bar.castShadow = true;
        railGroup.add(bar);
      });

      root.add(railGroup);
    };

    // Near touchline (front, facing viewer in the photo – south side)
    createRailingSegment(-halfW - railOffset, -halfH - railOffset, halfW + railOffset, -halfH - railOffset);
    // Far touchline (split to leave a gap for the players' tunnel)
    createRailingSegment(-halfW - railOffset, halfH + railOffset, tunnelX - TUNNEL_GAP / 2, halfH + railOffset);
    createRailingSegment(tunnelX + TUNNEL_GAP / 2, halfH + railOffset, halfW + railOffset, halfH + railOffset);
    // Left goal line
    createRailingSegment(-halfW - railOffset, -halfH - railOffset, -halfW - railOffset, halfH + railOffset);
    // Right goal line
    createRailingSegment(halfW + railOffset, -halfH - railOffset, halfW + railOffset, halfH + railOffset);

    // ============================
    // 4. FOOTBALL GOALS
    // ============================
    const createGoal = (zPos, facingDir) => {
      const goalGroup = new THREE.Group();
      goalGroup.name = `Goal_${facingDir > 0 ? 'North' : 'South'}`;

      // Standard regulation dimensions
      const goalW = 7.32;   // width between inside of posts
      const goalH = 2.44;   // height to underside of crossbar
      const goalTopD = 0.8; // top roof net depth
      const goalBotD = 2.0; // bottom ground depth
      const postR = 0.06;   // 12cm regulation diameter (radius = 0.06m)
      const stanchionR = 0.035; // rear tension stanchion pipe
      const frameR = 0.03;      // ground and support frame tubes

      // Helper to add a cylinder bar between two 3D points
      const addBar = (p1, p2, radius, material, parent = goalGroup, castShadow = true) => {
        const v1 = new THREE.Vector3(...p1);
        const v2 = new THREE.Vector3(...p2);
        const dir = new THREE.Vector3().subVectors(v2, v1);
        const len = dir.length();
        const mid = new THREE.Vector3().addVectors(v1, v2).multiplyScalar(0.5);

        const geom = new THREE.CylinderGeometry(radius, radius, len, 16);
        const mesh = new THREE.Mesh(geom, material);
        mesh.position.copy(mid);
        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
        mesh.castShadow = castShadow;
        parent.add(mesh);
        return mesh;
      };

      // 4.1 White Main Frame: Uprights & Crossbar & Elbow Joints
      [-1, 1].forEach(side => {
        const x = side * (goalW / 2);
        // Upright post
        const uprightGeom = new THREE.CylinderGeometry(postR, postR, goalH, 20);
        const upright = new THREE.Mesh(uprightGeom, mat.goalPost);
        upright.position.set(x, goalH / 2, 0);
        upright.castShadow = true;
        goalGroup.add(upright);

        // Ground socket base collar
        const collarGeom = new THREE.CylinderGeometry(postR * 1.35, postR * 1.35, 0.08, 16);
        const collar = new THREE.Mesh(collarGeom, mat.goalBaseBar);
        collar.position.set(x, 0.04, 0);
        collar.castShadow = true;
        goalGroup.add(collar);

        // Top corner elbow sphere
        const cornerSphere = new THREE.Mesh(
          new THREE.SphereGeometry(postR * 1.02, 16, 16),
          mat.goalPost
        );
        cornerSphere.position.set(x, goalH, 0);
        goalGroup.add(cornerSphere);
      });

      // Crossbar
      const crossGeom = new THREE.CylinderGeometry(postR, postR, goalW, 20);
      const crossbar = new THREE.Mesh(crossGeom, mat.goalPost);
      crossbar.rotation.z = Math.PI / 2;
      crossbar.position.set(0, goalH, 0);
      crossbar.castShadow = true;
      goalGroup.add(crossbar);

      // 4.2 Rear Ground Frame & Bottom Net Bars
      // Left and right bottom ground bars
      [-1, 1].forEach(side => {
        const x = side * (goalW / 2);
        addBar([x, 0.03, 0], [x, 0.03, facingDir * goalBotD], frameR, mat.goalBaseBar);
      });
      // Back ground spreader bar
      addBar(
        [-goalW / 2, 0.03, facingDir * goalBotD],
        [goalW / 2, 0.03, facingDir * goalBotD],
        frameR,
        mat.goalBaseBar
      );

      // 4.3 Stanchion Net Supports (modern continental elbow / angled back posts)
      [-1, 1].forEach(side => {
        const x = side * (goalW / 2 + 0.15); // slightly outside the posts for real tensioning
        // Top horizontal roof brace from post back
        addBar(
          [side * (goalW / 2), goalH, 0],
          [x, goalH - 0.05, facingDir * goalTopD],
          stanchionR * 0.8,
          mat.goalBaseBar
        );

        // Angled stanchion pipe going down to the ground behind the net
        addBar(
          [x, goalH - 0.05, facingDir * goalTopD],
          [x, 0.02, facingDir * (goalBotD + 0.4)],
          stanchionR,
          mat.goalTension
        );

        // Ground anchor peg
        const peg = new THREE.Mesh(
          new THREE.CylinderGeometry(0.04, 0.04, 0.12, 12),
          mat.black
        );
        peg.position.set(x, 0.06, facingDir * (goalBotD + 0.4));
        goalGroup.add(peg);
      });

      // Rear top horizontal tension cable/bar across the roof edge
      addBar(
        [-goalW / 2, goalH - 0.05, facingDir * goalTopD],
        [goalW / 2, goalH - 0.05, facingDir * goalTopD],
        0.015,
        mat.goalTension
      );

      // 4.4 Realistic Box-Continental Netting (Top roof, Sloping back, Sides)
      // Top roof net plane (from crossbar back to goalTopD)
      const topNetGeom = new THREE.PlaneGeometry(goalW, goalTopD, 24, 6);
      const topNetWire = new THREE.Mesh(topNetGeom, mat.goalNet);
      topNetWire.rotation.x = -Math.PI / 2;
      topNetWire.position.set(0, goalH, facingDir * (goalTopD / 2));
      goalGroup.add(topNetWire);

      const topNetBacking = new THREE.Mesh(topNetGeom, mat.goalNetBacking);
      topNetBacking.rotation.x = -Math.PI / 2;
      topNetBacking.position.set(0, goalH, facingDir * (goalTopD / 2));
      goalGroup.add(topNetBacking);

      // Back net: runs from (y=goalH, z=goalTopD) down to (y=0, z=goalBotD)
      const backDz = goalBotD - goalTopD;
      const backDy = goalH;
      const backHypot = Math.sqrt(backDz * backDz + backDy * backDy);
      const backAngle = Math.atan2(backDz, backDy); // angle tilted back from vertical

      const backNetGeom = new THREE.PlaneGeometry(goalW, backHypot, 24, 16);
      const backNetWire = new THREE.Mesh(backNetGeom, mat.goalNet);
      backNetWire.position.set(0, goalH / 2, facingDir * (goalTopD + backDz / 2));
      backNetWire.rotation.x = (facingDir > 0 ? -1 : 1) * backAngle;
      goalGroup.add(backNetWire);

      const backNetBacking = new THREE.Mesh(backNetGeom, mat.goalNetBacking);
      backNetBacking.position.set(0, goalH / 2, facingDir * (goalTopD + backDz / 2));
      backNetBacking.rotation.x = (facingDir > 0 ? -1 : 1) * backAngle;
      goalGroup.add(backNetBacking);

      // Side nets (trapezoid: upright front y=0..goalH, flat top roof z=0..goalTopD, slope down to z=goalBotD at y=0)
      [-1, 1].forEach(side => {
        const sideShape = new THREE.Shape();
        sideShape.moveTo(0, 0);
        sideShape.lineTo(0, goalH);
        sideShape.lineTo(goalTopD, goalH);
        sideShape.lineTo(goalBotD, 0);
        sideShape.closePath();

        const sideGeom = new THREE.ShapeGeometry(sideShape);
        const sideNetWire = new THREE.Mesh(sideGeom, mat.goalNet);
        sideNetWire.position.set(side * (goalW / 2), 0, 0);
        sideNetWire.rotation.y = side > 0 ? Math.PI / 2 : -Math.PI / 2;
        if (facingDir < 0) sideNetWire.rotation.y += Math.PI;
        goalGroup.add(sideNetWire);

        const sideNetBacking = new THREE.Mesh(sideGeom, mat.goalNetBacking);
        sideNetBacking.position.set(side * (goalW / 2), 0, 0);
        sideNetBacking.rotation.y = side > 0 ? Math.PI / 2 : -Math.PI / 2;
        if (facingDir < 0) sideNetBacking.rotation.y += Math.PI;
        goalGroup.add(sideNetBacking);
      });

      goalGroup.position.set(0, 0, zPos);
      root.add(goalGroup);
    };

    createGoal(-halfH, -1);
    createGoal(halfH, 1);

    // ============================
    // 5. MAIN GRANDSTAND (far touchline – north side)
    // ============================
    const standGroup = new THREE.Group();
    const standZ = halfH + railOffset + 3;   // behind the far railing
    const standLength = 36;
    const standHeight = 5;

    // Brick base / terrace wall
    const baseGeom = new THREE.BoxGeometry(standLength, 3, 4);
    const baseMesh = new THREE.Mesh(baseGeom, mat.brick);
    baseMesh.position.set(0, 1.5, standZ);
    baseMesh.castShadow = true;
    baseMesh.receiveShadow = true;
    standGroup.add(baseMesh);

    // Brick detail strips
    for (let i = 0; i < 3; i++) {
      const stripGeom = new THREE.BoxGeometry(standLength + 0.1, 0.08, 4.05);
      const strip = new THREE.Mesh(stripGeom, mat.brickDark);
      strip.position.set(0, 0.7 + i * 0.9, standZ);
      standGroup.add(strip);

    // Concrete terrace steps (standing area)
    for (let step = 0; step < 4; step++) {

      const stepMesh = new THREE.Mesh(stepGeom, mat.concrete);

      stepMesh.receiveShadow = true;
      standGroup.add(stepMesh);

    // Concrete back wall of terrace
    const backWallGeom = new THREE.BoxGeometry(standLength, standHeight - 1, 0.3);
    const backWall = new THREE.Mesh(backWallGeom, mat.concrete);
    backWall.position.set(0, (standHeight - 1) / 2 + 1, standZ + 2.3);
    backWall.castShadow = true;
    standGroup.add(backWall);

    // Roof structure
    const roofGroup = new THREE.Group();

    // Roof support pillars (steel columns)
    const pillarCount = 8;
    const pillarSpacing = standLength / (pillarCount - 1);
    const pillarGeom = new THREE.BoxGeometry(0.15, standHeight + 1.5, 0.15);
    for (let i = 0; i < pillarCount; i++) {
      const pillar = new THREE.Mesh(pillarGeom, mat.metal);
      pillar.position.set(
        -standLength / 2 + i * pillarSpacing,
