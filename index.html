      }),
    };

    const box = (w, h, d, material, x, y, z, parent = root) => {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    };

    const brickTex = this.makeCanvasTexture(256, 256, (ctx, w, h) => {
      ctx.fillStyle = '#7a5146';
      ctx.fillRect(0, 0, w, h);
      const rows = 8;
      const bh = h / rows;
      for (let r = 0; r < rows; r++) {
        const offset = r % 2 ? 32 : 0;
        for (let x = -64; x < w + 64; x += 64) {
          ctx.fillStyle = r % 3 === 0 ? '#6d463d' : '#855a4c';
          ctx.fillRect(x + offset + 2, r * bh + 2, 60, bh - 4);
        }
      }
    });
    brickTex.wrapS = THREE.RepeatWrapping;
    brickTex.wrapT = THREE.RepeatWrapping;
    brickTex.repeat.set(4, 2);
    mat.brick.map = brickTex;

    const floor = box(W * 2, 0.12, L, mat.floor, 0, -0.06, 0);
    floor.castShadow = false;
    box(W * 2, 0.08, L, mat.dark, 0, 0.02, 0);

    for (const side of [-1, 1]) {
      const wall = box(0.18, H, L, mat.brick, side * W, H / 2, 0);
      wall.receiveShadow = true;
      const skirt = box(0.22, 0.85, L, mat.concrete, side * (W - 0.06), 0.42, 0);
      skirt.castShadow = false;
    }

    const ceiling = box(W * 2, 0.16, L, mat.concrete, 0, H, 0);
    ceiling.castShadow = false;
    for (let z = -halfL + 2; z < halfL; z += 3.2) {
      box(W * 2, 0.16, 0.2, mat.dark, 0, H - 0.14, z);
    }

    box(0.08, 0.012, L - 1, mat.yellow, 0, 0.07, 0);
    for (const side of [-1, 1]) {
      box(0.07, 0.012, L - 1, mat.yellow, side * (W - 0.5), 0.07, 0);
    }

    const strips = [];
    for (const z of [-8, -3, 2, 7]) {
      const light = box(0.5, 0.07, 2.4, mat.strip, 0, H - 0.2, z);
      light.castShadow = false;
      strips.push(light);
      box(0.62, 0.1, 2.55, mat.metal, 0, H - 0.13, z);
    }

    for (const side of [-1, 1]) {
      for (const z of [-6, 0, 5]) {
        box(0.55, 0.1, 2.0, mat.concrete, side * (W - 0.45), 0.48, z);
        box(0.08, 0.45, 0.08, mat.metal, side * (W - 0.65), 0.25, z - 0.8);
        box(0.08, 0.45, 0.08, mat.metal, side * (W - 0.65), 0.25, z + 0.8);
      }
      box(0.5, 0.45, 0.5, mat.dark, side * (W - 0.35), 0.23, 3);
    }

    const boardTex = this.makeCanvasTexture(512, 320, (ctx, w, h) => {
      ctx.fillStyle = '#16233c';
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = '#d8b26a';
      ctx.lineWidth = 8;
      ctx.strokeRect(16, 16, w - 32, h - 32);
      ctx.fillStyle = '#f4f1e4';
      ctx.textAlign = 'center';
      ctx.font = 'bold 66px Arial, sans-serif';
      ctx.fillText('BULUH FC', w / 2, 130);
      ctx.font = '30px Arial, sans-serif';
      ctx.fillText('PLAYERS ONLY', w / 2, 195);
      ctx.font = '22px Arial, sans-serif';
      ctx.fillText('THE TUNNEL · EST. 1954', w / 2, 245);
    });
    const board = new THREE.Mesh(
      new THREE.PlaneGeometry(2.1, 1.3),
      this.createStdMaterial(0xffffff, { map: boardTex, emissive: 0x1b2b4a, emissiveIntensity: 0.4 })
    );
    board.position.set(W - 0.11, 1.9, -2);
    board.rotation.y = -Math.PI / 2;
    root.add(board);

    const portalFrame = new THREE.Group();
    box(W * 2 + 0.4, 0.35, 0.35, mat.dark, 0, H + 0.1, halfL, portalFrame);
    for (const side of [-1, 1]) {
      box(0.35, H, 0.35, mat.dark, side * (W + 0.1), H / 2, halfL, portalFrame);
    }
    root.add(portalFrame);
    const pitch = box(80, 0.06, 80, mat.pitch, 0, -0.02, halfL + 40);
    pitch.castShadow = false;

    const skyTex = this.makeCanvasTexture(32, 256, (ctx, w, h) => {
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#071024');
      g.addColorStop(0.7, '#142346');
      g.addColorStop(1, '#3a4c6e');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    });
    const sky = new THREE.Mesh(
      new THREE.PlaneGeometry(160, 60),
      this.createStdMaterial(0xffffff, {
        map: skyTex,
        emissive: 0x162850,
        emissiveIntensity: 0.6,
        side: THREE.DoubleSide,
      })
    );
    sky.position.set(0, 24, halfL + 95);
    root.add(sky);

    for (const side of [-1, 1]) {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 18, 10), mat.metal);
      pole.position.set(side * 19, 9, halfL + 22);
      root.add(pole);
      const rig = box(3.2, 1.2, 0.3, mat.dark, side * 19, 18, halfL + 22);
      rig.castShadow = false;
      for (let i = 0; i < 6; i++) {
        const lamp = box(0.4, 0.7, 0.12, mat.strip, side * 19 - 1.3 + i * 0.5, 18, halfL + 22.2);
        lamp.castShadow = false;
      }
    }

    let seed = 42;
    const rand = () => {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    };
    const crowd = new THREE.InstancedMesh(
      new THREE.BoxGeometry(0.42, 0.75, 0.34),
      this.createStdMaterial(0x141a24, { roughness: 1 }),
      120
    );
    const dummy = new THREE.Object3D();
    let idx = 0;
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 40; c++) {
        dummy.position.set(-16 + c * 0.82 + rand() * 0.15, 1.1 + r * 0.35, halfL + 5 + r * 0.7);
        dummy.scale.setScalar(0.85 + rand() * 0.3);
        dummy.rotation.y = (rand() - 0.5) * 0.4;
        dummy.updateMatrix();
        crowd.setMatrixAt(idx++, dummy.matrix);
      }
    }
    crowd.instanceMatrix.needsUpdate = true;
    root.add(crowd);

    this.characterParts = { strips, board, pitch, crowd, portalFrame };
    this.character = root;
    this.scene.add(root);
    return root;
  }

  animate() {
    if (this._dead) return;
    requestAnimationFrame(() => this.animate());
    if (this.controls) this.controls.update();
    if (this.renderer) this.renderer.render(this.scene, this.camera);
  }

  onWindowResize() {
    const width = this.container.clientWidth;
    const height = this.container.clientHeight;
    if (this.camera) {
      this.camera.aspect = width / height;
      this.camera.updateProjectionMatrix();
    }
    if (this.renderer) this.renderer.setSize(width, height);
  }

  dispose() {
    if (this.scene && this.character) {
      this.scene.remove(this.character);
      this.character.traverse((child) => {
        if (child.isMesh) {
          child.geometry.dispose();
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          mats.forEach((m) => {
            if (m.map) m.map.dispose();
            if (m.gradientMap) m.gradientMap.dispose();
            m.dispose();
          });
        }
      });
    }
    this.character = null;
    this.characterParts = {};
  }
}

/**
 * SponsorOfficeApp – Procedural 3D model of "NEXUS SPORTS'" modern glass-walled
 * headquarters, used as a bright corporate film location.
 */
class SponsorOfficeApp {
  constructor(container) {
    this.container = container;
    this.scene = null;
    this.camera = null;
    this.renderer = null;
    this.controls = null;
    this.character = null;
    this.characterParts = {};
    this.clock = new THREE.Clock();
    this._dead = false;
    this.roomBounds = { halfW: 6, halfD: 5, height: 3.6 };
    this.wallCull = { back: [], front: [], left: [], right: [], ceiling: [] };
  }

  async init() {
    this.setupScene();
    this.setupCamera();
    this.setupRenderer();
    this.setupControls();
    this.addLights();
    this.createProceduralCharacter();
    this.animate();
    return this;
  }

  setupScene() {
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0xdbe7f0);
    this.scene.fog = new THREE.Fog(0xdbe7f0, 26, 62);
  }

  setupCamera() {
    const aspect = this.container.clientWidth / this.container.clientHeight;
    this.camera = new THREE.PerspectiveCamera(52, aspect, 0.1, 200);
    this.camera.position.set(3.2, 2.0, 4.8);
    this.homeCamera = [3.2, 2.0, 4.8];
    this.homeTarget = [0, 1.2, -0.8];
  }

  setupRenderer() {
    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.container.appendChild(this.renderer.domElement);
  }

  setupControls() {
    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.05;
    this.controls.target.set(0, 1.2, -0.8);
    this.controls.maxPolarAngle = Math.PI / 2.05;
    this.controls.minDistance = 2;
    this.controls.maxDistance = 24;
  }

  addLights() {
    this.scene.add(new THREE.AmbientLight(0xdfeaf5, 0.85));

    const key = new THREE.DirectionalLight(0xf2f8ff, 1.6);
    key.position.set(-6, 8, 6);
    key.castShadow = true;
    key.shadow.mapSize.width = 1024;
    key.shadow.mapSize.height = 1024;
    key.shadow.camera.left = -10;
    key.shadow.camera.right = 10;
    key.shadow.camera.top = 10;
    key.shadow.camera.bottom = -10;
    key.shadow.camera.far = 28;
    key.shadow.bias = -0.0004;
    this.scene.add(key);

    const hemi = new THREE.HemisphereLight(0xeaf4ff, 0x9aa6b2, 0.7);
    this.scene.add(hemi);

    const ceilingA = new THREE.PointLight(0xeaf4ff, 9, 13, 2);
    ceilingA.position.set(-2.6, 3.15, 0.5);
    this.scene.add(ceilingA);

    const ceilingB = new THREE.PointLight(0xeaf4ff, 9, 13, 2);
    ceilingB.position.set(2.6, 3.15, -1.2);
    this.scene.add(ceilingB);

    const deskFill = new THREE.PointLight(0xdcecff, 5, 7, 2);
    deskFill.position.set(0, 1.9, -1.0);
    this.scene.add(deskFill);
  }

  createStdMaterial(colorHex, opts = {}) {
    return new THREE.MeshStandardMaterial({
      color: colorHex,
      roughness: opts.roughness ?? 0.7,
      metalness: opts.metalness ?? 0,
      ...opts,
    });
  }

  makeCanvasTexture(width, height, draw) {
    if (typeof document === 'undefined') return null;
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    draw(ctx, width, height);
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = 4;
    return texture;
  }

  updateWallVisibility() {
    if (!this.camera || !this.wallCull) return;
    const p = this.camera.position;
    const { halfW, halfD, height } = this.roomBounds;
    this.wallCull.back.forEach((o) => { o.visible = p.z > -halfD - 0.05; });
    this.wallCull.front.forEach((o) => { o.visible = p.z < halfD + 0.05; });
    this.wallCull.left.forEach((o) => { o.visible = p.x > -halfW - 0.05; });
    this.wallCull.right.forEach((o) => { o.visible = p.x < halfW + 0.05; });
    this.wallCull.ceiling.forEach((o) => { o.visible = p.y < height + 0.05; });
  }

  // Misnamed on purpose: sceneKit.js calls this to build the environment.
  createProceduralCharacter() {
    if (this.character) this.dispose();

    const root = new THREE.Group();
    root.name = 'SponsorOffice';
    this.wallCull = { back: [], front: [], left: [], right: [], ceiling: [] };

    const { halfW: W, halfD: D, height: H } = this.roomBounds;

    const concreteTex = this.makeCanvasTexture(512, 512, (ctx, w, h) => {
      ctx.fillStyle = '#cbd5dd';
      ctx.fillRect(0, 0, w, h);
      let seed = 23;
      const rand = () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      };
      for (let i = 0; i < 2600; i++) {
        const s = rand() > 0.5 ? '#d8e0e6' : '#bcc7d0';
        ctx.globalAlpha = 0.25 + rand() * 0.35;
        ctx.fillStyle = s;
        ctx.fillRect(rand() * w, rand() * h, 1 + rand() * 2, 1 + rand() * 2);
      }
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#b3bfc9';
      ctx.lineWidth = 2;
      for (let i = 1; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo((i * w) / 4, 0);
        ctx.lineTo((i * w) / 4, h);
        ctx.moveTo(0, (i * h) / 4);
        ctx.lineTo(w, (i * h) / 4);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    });

    const cityTex = this.makeCanvasTexture(1024, 512, (ctx, w, h) => {
      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, '#7fb6dc');
      sky.addColorStop(0.6, '#c4e0f2');
      sky.addColorStop(1, '#eaf5fb');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      for (let i = 0; i < 6; i++) ctx.fillRect((i * 180) % w, 30 + (i % 3) * 25, 120, 14);
      let seed = 11;
      const rand = () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      };
      const shades = ['#8ba6bb', '#7d9ab2', '#9db3c5', '#6f8ba5'];
      let x = -20;
      while (x < w + 20) {
        const bw = 28 + rand() * 70;
        const bh = h * (0.22 + rand() * 0.5);
        const by = h - bh;
        ctx.fillStyle = shades[Math.floor(rand() * shades.length)];
        ctx.fillRect(x, by, bw, bh);
        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        for (let wy = by + 8; wy < h - 6; wy += 12) {
          for (let wx = x + 5; wx < x + bw - 4; wx += 9) {
            if (rand() > 0.45) ctx.fillRect(wx, wy, 3, 5);
          }
        }
        x += bw + 4;
      }
      ctx.fillStyle = 'rgba(220,235,245,0.35)';
      ctx.fillRect(0, h - 30, w, 30);
    });

    const ballTex = this.makeCanvasTexture(256, 128, (ctx, w, h) => {
      ctx.fillStyle = '#f4f6f5';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#26313c';
      const pent = (cx, cy, r, rot) => {
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const a = rot + (i * Math.PI * 2) / 5;
          const px = cx + Math.cos(a) * r;
          const py = cy + Math.sin(a) * r;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
      };
      pent(w * 0.16, h * 0.35, h * 0.26, -Math.PI / 2);
      pent(w * 0.52, h * 0.72, h * 0.26, -Math.PI / 2);
      pent(w * 0.88, h * 0.35, h * 0.26, -Math.PI / 2);
    });

    const jerseyTex = this.makeCanvasTexture(384, 512, (ctx, w, h) => {
      ctx.fillStyle = '#eef3f7';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#1d2b3a';
      ctx.beginPath();
      ctx.moveTo(w * 0.28, h * 0.16);
      ctx.lineTo(w * 0.4, h * 0.1);
      ctx.lineTo(w * 0.6, h * 0.1);
      ctx.lineTo(w * 0.72, h * 0.16);
      ctx.lineTo(w * 0.9, h * 0.34);
      ctx.lineTo(w * 0.75, h * 0.46);
      ctx.lineTo(w * 0.68, h * 0.36);
      ctx.lineTo(w * 0.68, h * 0.9);
      ctx.lineTo(w * 0.32, h * 0.9);
      ctx.lineTo(w * 0.32, h * 0.36);
      ctx.lineTo(w * 0.25, h * 0.46);
      ctx.lineTo(w * 0.1, h * 0.34);
      ctx.closePath();
      ctx.fill();
      ctx.save();
      ctx.clip();
      ctx.fillStyle = '#37b6d6';
      ctx.beginPath();
      ctx.moveTo(w * 0.1, h * 0.2);
      ctx.lineTo(w * 0.42, h * 0.1);
      ctx.lineTo(w * 0.9, h * 0.5);
      ctx.lineTo(w * 0.9, h * 0.66);
      ctx.lineTo(w * 0.1, h * 0.34);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#eef3f7';
      ctx.textAlign = 'center';
      ctx.font = `bold ${Math.round(w * 0.13)}px Arial, sans-serif`;
      ctx.fillText('NEXUS', w / 2, h * 0.28);
      ctx.font = `bold ${Math.round(w * 0.3)}px Arial, sans-serif`;
      ctx.fillText('10', w / 2, h * 0.68);
    });

    const clockTex = this.makeCanvasTexture(256, 256, (ctx, w, h) => {
      ctx.fillStyle = '#f7fafc';
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = '#4a5966';
      ctx.fillStyle = '#4a5966';
      ctx.lineWidth = 5;
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(w / 2 + Math.cos(a) * w * 0.38, h / 2 + Math.sin(a) * h * 0.38);
        ctx.lineTo(w / 2 + Math.cos(a) * w * 0.45, h / 2 + Math.sin(a) * h * 0.45);
        ctx.stroke();
      }
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.moveTo(w / 2, h / 2);
      ctx.lineTo(w / 2, h * 0.26);
      ctx.stroke();
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(w / 2, h / 2);
      ctx.lineTo(w * 0.72, h * 0.6);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(w / 2, h / 2, 7, 0, Math.PI * 2);
      ctx.fill();
    });

    const mat = {
      floor: this.createStdMaterial(0xffffff, { map: concreteTex, roughness: 0.34, metalness: 0.12 }),
      wall: this.createStdMaterial(0xe7edf2, { roughness: 0.9 }),
      panel: this.createStdMaterial(0xf4f7fa, { roughness: 0.85 }),
      ceiling: this.createStdMaterial(0xf7fafc, { roughness: 0.95 }),
      desk: this.createStdMaterial(0xf2f5f7, { roughness: 0.4 }),
      deskEdge: this.createStdMaterial(0xd6dfe6, { roughness: 0.5 }),
      metal: this.createStdMaterial(0xb6c2cc, { roughness: 0.28, metalness: 0.7 }),
      metalDark: this.createStdMaterial(0x6b7884, { roughness: 0.4, metalness: 0.6 }),
      leather: this.createStdMaterial(0x2e3a46, { roughness: 0.55 }),
      leatherLight: this.createStdMaterial(0x546675, { roughness: 0.6 }),
      glass: this.createStdMaterial(0xbcd8ea, {
        roughness: 0.08, metalness: 0.1, transparent: true, opacity: 0.24,
        depthWrite: false, side: THREE.DoubleSide,
      }),
      city: this.createStdMaterial(0xffffff, {
        map: cityTex, roughness: 1, emissive: 0x6f93b3, emissiveIntensity: 0.35,
      }),
      led: this.createStdMaterial(0xffffff, {
        emissive: 0xbfe0ff, emissiveIntensity: 1.4, roughness: 0.3,
      }),
      screen: this.createStdMaterial(0x1d2733, {
        roughness: 0.2, metalness: 0.3, emissive: 0x0f2130, emissiveIntensity: 0.4,
      }),
      silver: this.createStdMaterial(0xdfe6ec, { roughness: 0.2, metalness: 0.85 }),
      plantGreen: this.createStdMaterial(0x3f7d52, { roughness: 0.85 }),
      pot: this.createStdMaterial(0xd7dde2, { roughness: 0.6 }),
    };

    const box = (w, h, d, material, x, y, z, parent = root) => {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    };

    const cyl = (rTop, rBottom, height_, material, x, y, z, parent = root, segments = 16) => {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(rTop, rBottom, height_, segments),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    };

    const quad = (w, h, material, x, y, z, parent = root) => {
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), material);
      mesh.position.set(x, y, z);
      parent.add(mesh);
      return mesh;
    };

    // Shell
    const floor = box(W * 2, 0.12, D * 2, mat.floor, 0, -0.06, 0);
    floor.castShadow = false;

    const back = box(W * 2, H, 0.14, mat.wall, 0, H / 2, -D);
    this.wallCull.back.push(back);
    const right = box(0.14, H, D * 2, mat.wall, W, H / 2, 0);
    this.wallCull.right.push(right);

    const ceiling = box(W * 2, 0.12, D * 2, mat.ceiling, 0, H + 0.02, 0);
    ceiling.castShadow = false;
    this.wallCull.ceiling.push(ceiling);

    // Linear LED strips
    const ceilingLights = new THREE.Group();
    for (const x of [-4.2, -1.4, 1.4, 4.2]) {
      const strip = box(0.1, 0.06, 8.4, mat.led, x, H - 0.08, -0.2, ceilingLights);
      strip.castShadow = false;
      box(0.16, 0.04, 8.5, mat.metal, x, H - 0.04, -0.2, ceilingLights).castShadow = false;
    }
    root.add(ceilingLights);
    this.wallCull.ceiling.push(ceilingLights);

    // Glass curtain walls with a daylight city skyline
    const glassWall = new THREE.Group();
    root.add(glassWall);

    const leftGlass = new THREE.Group();
    glassWall.add(leftGlass);
    const leftCity = quad(D * 2 - 0.1, H - 0.1, mat.city, -W - 0.06, H / 2, 0, leftGlass);
    leftCity.rotation.y = Math.PI / 2;
    const leftPane = quad(D * 2 - 0.1, H - 0.1, mat.glass, -W + 0.02, H / 2, 0, leftGlass);
    leftPane.rotation.y = Math.PI / 2;
    for (let i = 0; i <= 5; i++) {
      box(0.09, H, 0.09, mat.metalDark, -W + 0.04, H / 2, -D + (i * D * 2) / 5, leftGlass);
    }
    box(0.14, 0.14, D * 2, mat.metalDark, -W + 0.04, 0.12, 0, leftGlass);
    box(0.14, 0.14, D * 2, mat.metalDark, -W + 0.04, H - 0.12, 0, leftGlass);
    this.wallCull.left.push(leftGlass);

    const frontGlass = new THREE.Group();
    glassWall.add(frontGlass);
    const frontCity = quad(W * 2 - 0.1, H - 0.1, mat.city, 0, H / 2, D + 0.06, frontGlass);
    frontCity.rotation.y = Math.PI;
    const frontPane = quad(W * 2 - 0.1, H - 0.1, mat.glass, 0, H / 2, D - 0.02, frontGlass);
    frontPane.rotation.y = Math.PI;
    for (let i = 0; i <= 6; i++) {
      box(0.09, H, 0.09, mat.metalDark, -W + (i * W * 2) / 6, H / 2, D - 0.04, frontGlass);
    }
    box(W * 2, 0.14, 0.14, mat.metalDark, 0, 0.12, D - 0.04, frontGlass);
    box(W * 2, 0.14, 0.14, mat.metalDark, 0, H - 0.12, D - 0.04, frontGlass);
    this.wallCull.front.push(frontGlass);

    // Feature wall with sponsor logo
    const logoWall = new THREE.Group();
    box(W * 1.1, 2.3, 0.05, mat.panel, 0, 1.9, -D + 0.1, logoWall);
    box(W * 1.1, 0.04, 0.07, mat.metal, 0, 0.75, -D + 0.14, logoWall);
    const logoTexture = this.makeCanvasTexture(768, 256, (ctx, w, h) => {
      ctx.fillStyle = '#f4f7fa';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#1d2b3a';
      ctx.beginPath();
      ctx.moveTo(h * 0.2, h * 0.18);
      ctx.lineTo(h * 0.52, h * 0.5);
      ctx.lineTo(h * 0.2, h * 0.82);
      ctx.lineTo(h * 0.04, h * 0.64);
      ctx.lineTo(h * 0.04, h * 0.36);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#37b6d6';
      ctx.beginPath();
      ctx.moveTo(h * 0.56, h * 0.18);
      ctx.lineTo(h * 0.88, h * 0.5);
      ctx.lineTo(h * 0.56, h * 0.82);
      ctx.lineTo(h * 0.4, h * 0.64);
      ctx.lineTo(h * 0.4, h * 0.36);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#1d2b3a';
      ctx.textAlign = 'left';
      ctx.font = `bold ${Math.round(h * 0.4)}px Arial, sans-serif`;
      ctx.fillText('NEXUS', h * 1.02, h * 0.52);
      ctx.fillStyle = '#5b6b79';
      ctx.font = `bold ${Math.round(h * 0.17)}px Arial, sans-serif`;
      ctx.fillText('S P O R T S', h * 1.04, h * 0.76);
    });
    const logo = quad(4.2, 1.4, this.createStdMaterial(0xffffff, {
      map: logoTexture, roughness: 0.7, emissive: 0x243647, emissiveIntensity: 0.12,
    }), 0, 1.95, -D + 0.15, logoWall);
    logo.castShadow = false;
    root.add(logoWall);
    this.wallCull.back.push(logoWall);

    // Long minimalist desk
    const desk = new THREE.Group();
    desk.position.set(0, 0, -1.0);
    box(3.8, 0.06, 1.3, mat.desk, 0, 0.76, 0, desk);
    box(3.82, 0.02, 1.32, mat.deskEdge, 0, 0.72, 0, desk);
    box(0.08, 0.72, 1.0, mat.metal, -1.62, 0.36, 0, desk);
    box(0.08, 0.72, 1.0, mat.metal, 1.62, 0.36, 0, desk);
    box(0.7, 0.04, 1.05, mat.metalDark, -1.62, 0.03, 0, desk);
    box(0.7, 0.04, 1.05, mat.metalDark, 1.62, 0.03, 0, desk);
    box(2.9, 0.38, 0.04, mat.panel, 0, 0.5, -0.55, desk);
    const monitor = new THREE.Group();
    monitor.position.set(-0.95, 0.8, -0.22);
    desk.add(monitor);
    box(0.5, 0.02, 0.24, mat.silver, 0, 0.01, 0, monitor);
    box(0.05, 0.26, 0.05, mat.metalDark, 0, 0.14, 0, monitor);
    const screen = box(1.1, 0.64, 0.04, mat.screen, 0, 0.56, -0.02, monitor);
    screen.rotation.x = -0.08;
    const laptop = new THREE.Group();
    laptop.position.set(0.95, 0.8, 0.12);
    desk.add(laptop);
    box(0.72, 0.02, 0.48, mat.silver, 0, 0, 0, laptop);
    const lid = box(0.72, 0.46, 0.02, mat.silver, 0, 0.23, -0.24, laptop);
    lid.rotation.x = -0.32;
    box(0.34, 0.008, 0.44, mat.screen, 0, 0.01, 0, laptop);
    box(0.42, 0.008, 0.3, mat.panel, -0.05, 0.8, 0.32, desk).rotation.y = 0.16;
    cyl(0.05, 0.045, 0.1, mat.panel, 1.5, 0.81, 0.28, desk, 16);
    const mugHandle = new THREE.Mesh(new THREE.TorusGeometry(0.032, 0.01, 8, 16), mat.panel);
    mugHandle.position.set(1.56, 0.81, 0.28);
    mugHandle.rotation.y = Math.PI / 2;
    desk.add(mugHandle);
    root.add(desk);

    // Leather chairs
    const chairs = new THREE.Group();
    const makeChair = (x, z, ry, material) => {
      const g = new THREE.Group();
      g.position.set(x, 0, z);
      g.rotation.y = ry;
      chairs.add(g);
      box(0.62, 0.12, 0.6, material, 0, 0.5, 0, g);
      box(0.6, 0.72, 0.12, material, 0, 0.92, -0.26, g);
      box(0.1, 0.05, 0.46, mat.metalDark, -0.34, 0.72, 0, g);
      box(0.1, 0.05, 0.46, mat.metalDark, 0.34, 0.72, 0, g);
      box(0.05, 0.22, 0.05, mat.metalDark, -0.34, 0.6, 0, g);
      box(0.05, 0.22, 0.05, mat.metalDark, 0.34, 0.6, 0, g);
      cyl(0.05, 0.05, 0.36, mat.metalDark, 0, 0.26, 0, g, 12);
      for (let s = 0; s < 5; s++) {
        const a = (s / 5) * Math.PI * 2;
        box(0.05, 0.04, 0.34, mat.metalDark, Math.sin(a) * 0.16, 0.08, Math.cos(a) * 0.16, g).rotation.y = a;
      }
      return g;
    };
    makeChair(0, -2.25, 0, mat.leather);
    makeChair(-1.15, 0.75, Math.PI, mat.leatherLight);
    makeChair(1.15, 0.75, Math.PI, mat.leatherLight);
    root.add(chairs);

    // Merchandise display shelf and framed jersey
    const displayShelf = new THREE.Group();
    displayShelf.position.set(3.7, 0, -D + 0.35);
    box(2.2, 1.9, 0.42, mat.panel, 0, 0.95, 0, displayShelf);
    box(2.1, 1.8, 0.02, mat.glass, 0, 0.95, 0.23, displayShelf).castShadow = false;
    box(2.24, 0.06, 0.46, mat.metal, 0, 1.92, 0, displayShelf);
    for (const sy of [0.62, 1.22]) {
      box(2.05, 0.05, 0.38, mat.desk, 0, sy, 0.02, displayShelf);
    }
    for (let i = 0; i < 3; i++) {
      const ball = new THREE.Mesh(
        new THREE.SphereGeometry(0.13, 18, 14),
        this.createStdMaterial(0xffffff, { map: ballTex, roughness: 0.55 })
      );
      ball.position.set(-0.65 + i * 0.55, 0.78, 0.05);
      ball.rotation.set(i * 0.7, i * 0.9, i * 0.3);
      ball.castShadow = true;
      displayShelf.add(ball);
    }
    for (let i = 0; i < 2; i++) {
      const ball = new THREE.Mesh(
        new THREE.SphereGeometry(0.13, 18, 14),
        this.createStdMaterial(0xffffff, { map: ballTex, roughness: 0.55 })
      );
      ball.position.set(-0.35 + i * 0.7, 1.38, 0.05);
      ball.rotation.set(i * 0.5, i * 1.1, 0.4);
      ball.castShadow = true;
      displayShelf.add(ball);
    }
    box(1.15, 1.45, 0.06, mat.metalDark, 0, 2.72, -0.08, displayShelf);
    quad(1.0, 1.3, this.createStdMaterial(0xffffff, { map: jerseyTex, roughness: 0.75 }),
      0, 2.72, -0.04, displayShelf);
    root.add(displayShelf);
    this.wallCull.back.push(displayShelf);

    // Potted plant
    const plant = new THREE.Group();
    plant.position.set(-4.7, 0, 3.6);
    cyl(0.3, 0.24, 0.52, mat.pot, 0, 0.26, 0, plant, 18);
    cyl(0.27, 0.27, 0.03, mat.metalDark, 0, 0.52, 0, plant, 18);
    cyl(0.04, 0.05, 0.9, mat.plantGreen, 0, 0.95, 0, plant, 10);
    for (let l = 0; l < 8; l++) {
      const a = (l / 8) * Math.PI * 2;
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.26, 12, 10), mat.plantGreen);
      leaf.scale.set(0.55, 0.3, 1);
      leaf.position.set(Math.sin(a) * 0.28, 1.15 + (l % 3) * 0.16, Math.cos(a) * 0.28);
      leaf.rotation.y = a;
      leaf.rotation.z = -0.4;
      leaf.castShadow = true;
      plant.add(leaf);
    }
    root.add(plant);

    // Wall clock
    const clock = new THREE.Group();
    clock.position.set(W - 0.08, 2.6, 0.6);
    clock.rotation.y = -Math.PI / 2;
    cyl(0.32, 0.32, 0.06, mat.silver, 0, 0, 0, clock, 24).rotation.x = Math.PI / 2;
    quad(0.56, 0.56, this.createStdMaterial(0xffffff, { map: clockTex, roughness: 0.6 }),
      0, 0, 0.035, clock);
    root.add(clock);
    this.wallCull.right.push(clock);

    this.characterParts = {
      floor, desk, logoWall, glassWall, chairs, displayShelf, clock,
      ceilingLights, plant,
    };
    this.character = root;
    this.scene.add(root);
    this.updateWallVisibility();
    return root;
  }

  animate() {
    if (this._dead) return;
    requestAnimationFrame(() => this.animate());
    if (this.controls) this.controls.update();
    if (this.renderer) this.renderer.render(this.scene, this.camera);
  }

  onWindowResize() {
    const width = this.container.clientWidth;
    const height = this.container.clientHeight;
    if (this.camera) {
      this.camera.aspect = width / height;
      this.camera.updateProjectionMatrix();
    }
    if (this.renderer) this.renderer.setSize(width, height);
  }

  resetScene() {
    this.dispose();
    this.setupScene();
    this.addLights();
    this.createProceduralCharacter();
  }

  dispose() {
    if (this.scene && this.character) {
      this.scene.remove(this.character);
      this.character.traverse((child) => {
        if (child.isMesh) {
          child.geometry.dispose();
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          mats.forEach((m) => {
            if (m.map) m.map.dispose();
            if (m.gradientMap) m.gradientMap.dispose();
            m.dispose();
          });
        }
      });
    }
    this.character = null;
    this.characterParts = {};
  }
}

/**
 * BakeryApp — a small, warm Malaysian neighbourhood bakery ("KEK MAJU").
 *
 * Deliberately distinct from the Buluh FC office and the sponsor offices:
 * front counter, glass cake display, tiled floor, shelves of bread, warm
 * pendant lights and a wall-mounted KEK MAJU sign. No outdoor signposts here.
 */
class BakeryApp {
  constructor(container) {
    this.container = container;
    this.scene = null;
    this.camera = null;
    this.renderer = null;
    this.controls = null;
    this.character = null;
    this.characterParts = {};
    this.clock = new THREE.Clock();
    this._dead = false;
    this.roomBounds = { halfW: 5, halfD: 4, height: 3.4 };
  }

  async init() {
    this.setupScene();
    this.setupCamera();
    this.setupRenderer();
    this.setupControls();
    this.addLights();
    this.createProceduralCharacter();
    this.animate();
    return this;
  }

  setupScene() {
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x2a1d13);
    this.scene.fog = new THREE.Fog(0x2a1d13, 18, 46);
  }

  setupCamera() {
    const aspect = this.container.clientWidth / this.container.clientHeight;
    this.camera = new THREE.PerspectiveCamera(52, aspect, 0.1, 200);
    this.camera.position.set(2.4, 1.9, 4.4);
    this.homeCamera = [2.4, 1.9, 4.4];
    this.homeTarget = [0, 1.2, 0];
  }

  setupRenderer() {
    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.container.appendChild(this.renderer.domElement);
  }

  setupControls() {
    this.controls = new OrbitControls(this.camera, this.renderer.domElement);
    this.controls.enableDamping = true;
    this.controls.dampingFactor = 0.05;
    this.controls.target.set(0, 1.2, 0);
    this.controls.maxPolarAngle = Math.PI / 2.05;
    this.controls.minDistance = 2;
    this.controls.maxDistance = 20;
  }

  addLights() {
    this.scene.add(new THREE.AmbientLight(0xffe9c9, 0.72));

    const hemi = new THREE.HemisphereLight(0xffe3b8, 0x5a3a22, 0.55);
    this.scene.add(hemi);

    const warmKey = new THREE.DirectionalLight(0xffd9a0, 1.05);
    warmKey.position.set(-4, 7, 5);
    warmKey.castShadow = true;
    warmKey.shadow.mapSize.width = 1024;
    warmKey.shadow.mapSize.height = 1024;
    warmKey.shadow.camera.left = -8;
    warmKey.shadow.camera.right = 8;
    warmKey.shadow.camera.top = 8;
    warmKey.shadow.camera.bottom = -8;
    warmKey.shadow.camera.far = 26;
    warmKey.shadow.bias = -0.0004;
    this.scene.add(warmKey);

    for (const [x, z] of [[-2.6, -0.4], [0.2, -1.4], [2.8, -0.2]]) {
      const lamp = new THREE.PointLight(0xffc078, 7, 9, 2);
      lamp.position.set(x, 2.72, z);
      this.scene.add(lamp);
    }

    const counterGlow = new THREE.PointLight(0xffdca8, 4, 6, 2);
    counterGlow.position.set(0, 1.5, 0.9);
    this.scene.add(counterGlow);
  }

  createStdMaterial(colorHex, opts = {}) {
    return new THREE.MeshStandardMaterial({
      color: colorHex,
      roughness: opts.roughness ?? 0.75,
      metalness: opts.metalness ?? 0,
      ...opts,
    });
  }

  makeCanvasTexture(width, height, draw) {
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    draw(ctx, width, height);
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = 8;
    return texture;
  }

  makeSignTexture() {
    return this.makeCanvasTexture(768, 320, (ctx, w, h) => {
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, '#fff6e2');
      grad.addColorStop(1, '#f7e5c4');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = '#b9602c';
      ctx.lineWidth = 16;
      ctx.strokeRect(16, 16, w - 32, h - 32);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#7a3a17';
      ctx.font = 'bold 128px Georgia, serif';
      ctx.fillText('KEK MAJU', w / 2, 158);
      ctx.fillStyle = '#b9602c';
      ctx.font = 'bold 34px Arial, sans-serif';
      ctx.fillText('KEDAI KECIL  ·  SOKONGAN BESAR', w / 2, 222);
      ctx.fillStyle = '#7a3a17';
      ctx.font = 'bold 30px Arial, sans-serif';
      ctx.fillText('Sokong Buluh FC', w / 2, 278);
    });
  }

  makeTileTexture() {
    return this.makeCanvasTexture(512, 512, (ctx, w, h) => {
      ctx.fillStyle = '#c98c63';
      ctx.fillRect(0, 0, w, h);
      const size = 64;
      for (let y = 0; y < h; y += size) {
        for (let x = 0; x < w; x += size) {
          const shade = (x / size + y / size) % 2 ? '#d89b70' : '#c07e55';
          ctx.fillStyle = shade;
          ctx.fillRect(x + 2, y + 2, size - 4, size - 4);
        }
      }
    });
  }

  // Misnamed on purpose: sceneKit.js calls this to build the environment.
  createProceduralCharacter() {
    if (this.character) this.dispose();

    const root = new THREE.Group();
    root.name = 'Bakery';
    const { halfW: W, halfD: D, height: H } = this.roomBounds;

    const mat = {
      floor: this.createStdMaterial(0xffffff, { map: this.makeTileTexture(), roughness: 0.9 }),
      wall: this.createStdMaterial(0xf6e2c4, { roughness: 0.95 }),
      wallLower: this.createStdMaterial(0xc98c63, { roughness: 0.9 }),
      trim: this.createStdMaterial(0x8b542c, { roughness: 0.7 }),
      wood: this.createStdMaterial(0xa9683a, { roughness: 0.62 }),
      woodDark: this.createStdMaterial(0x744326, { roughness: 0.7 }),
      woodTop: this.createStdMaterial(0xc98a56, { roughness: 0.42 }),
      glass: this.createStdMaterial(0xdff0f5, {
        roughness: 0.06, metalness: 0.05, transparent: true, opacity: 0.22,
        depthWrite: false, side: THREE.DoubleSide,
      }),
      metal: this.createStdMaterial(0xcbbda8, { roughness: 0.3, metalness: 0.6 }),
      bread: this.createStdMaterial(0xd8a258, { roughness: 0.92 }),
      breadLight: this.createStdMaterial(0xe8c184, { roughness: 0.92 }),
      icing: this.createStdMaterial(0xfff0dc, { roughness: 0.7 }),
      berry: this.createStdMaterial(0xc0374b, { roughness: 0.5 }),
      sign: this.createStdMaterial(0xffffff, {
        map: this.makeSignTexture(), roughness: 0.7,
        emissive: 0x4a2a10, emissiveIntensity: 0.35,
      }),
      lamp: this.createStdMaterial(0xffdca8, { emissive: 0xffb45e, emissiveIntensity: 1.3 }),
      bell: this.createStdMaterial(0xd8b45a, { roughness: 0.3, metalness: 0.75 }),
    };

    const box = (w, h, d, material, x, y, z, parent = root) => {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    };

    const cyl = (rTop, rBottom, height_, material, x, y, z, parent = root, segments = 16) => {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(rTop, rBottom, height_, segments), material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    };

    // Shell (front wall omitted — this is an open film set).
    const floor = box(W * 2, 0.12, D * 2, mat.floor, 0, -0.06, 0);
    floor.castShadow = false;
    box(W * 2, H, 0.14, mat.wall, 0, H / 2, -D);
    box(0.14, H, D * 2, mat.wall, -W, H / 2, 0);
    box(0.14, H, D * 2, mat.wall, W, H / 2, 0);
    box(W * 2, 1.1, 0.15, mat.wallLower, 0, 0.55, -D + 0.02);
    box(0.15, 1.1, D * 2, mat.wallLower, -W + 0.02, 0.55, 0);
    box(0.15, 1.1, D * 2, mat.wallLower, W - 0.02, 0.55, 0);

    // Wall-mounted KEK MAJU sign (no post, no outdoor board).
    const sign = new THREE.Group();
    box(3.3, 1.36, 0.09, mat.woodDark, 0, 2.4, -D + 0.12, sign);
    const signFace = new THREE.Mesh(new THREE.PlaneGeometry(3.16, 1.22), mat.sign);
    signFace.position.set(0, 2.4, -D + 0.175);
    sign.add(signFace);
    sign.position.set(-0.4, 0, 0);
    root.add(sign);

    // Back-shelf with bread loaves.
    const shelf = new THREE.Group();
    box(3.0, 0.08, 0.5, mat.wood, 0, 1.42, -D + 0.32, shelf);
    box(3.0, 0.08, 0.5, mat.wood, 0, 1.92, -D + 0.32, shelf);
    for (let i = 0; i < 6; i++) {
      const loaf = cyl(0.1, 0.13, 0.26, i % 2 ? mat.bread : mat.breadLight,
        -1.15 + i * 0.46, 1.6, -D + 0.34, shelf, 12);
      loaf.rotation.z = 0.12 * Math.sin(i);
    }
    for (let i = 0; i < 5; i++) {
      cyl(0.11, 0.13, 0.24, i % 2 ? mat.breadLight : mat.bread,
        -0.9 + i * 0.46, 2.1, -D + 0.34, shelf, 12);
    }
    root.add(shelf);

    // Front counter.
    const counter = new THREE.Group();
    counter.position.set(0, 0, 0.15);
    box(6.2, 0.1, 1.15, mat.woodTop, 0, 0.96, 0, counter);
    box(6.0, 0.84, 0.95, mat.wood, 0, 0.5, 0, counter);
    for (let i = -2; i <= 2; i++) {
      box(0.06, 0.72, 0.99, mat.woodDark, i * 1.12, 0.5, 0, counter);
    }
    box(6.24, 0.06, 1.19, mat.trim, 0, 0.9, 0, counter);
    root.add(counter);

    // Glass display case with cakes, sitting on the counter.
    const displayCase = new THREE.Group();
    displayCase.position.set(-0.5, 0, 0.15);
    box(2.5, 0.06, 1.0, mat.woodDark, 0, 1.02, 0, displayCase);
    box(2.42, 0.04, 0.92, mat.icing, 0, 1.06, 0, displayCase);
    const cakeColors = [0xf0b26b, 0xd98650, 0xf6d2a0, 0xe0a0a0, 0xf0b26b];
    for (let i = 0; i < 5; i++) {
      const x = -0.92 + i * 0.46;
      const cake = new THREE.Group();
      cyl(0.15, 0.16, 0.16, mat.icing, 0, 1.17, 0, cake, 16);
      cyl(0.16, 0.16, 0.035, this.createStdMaterial(cakeColors[i], { roughness: 0.6 }),
        0, 1.27, 0, cake, 16);
      const cherry = new THREE.Mesh(new THREE.SphereGeometry(0.045, 10, 10), mat.berry);
      cherry.position.set(0, 1.31, 0);
      cake.add(cherry);
      cake.position.x = x;
      displayCase.add(cake);
    }
    box(2.5, 0.05, 1.0, mat.metal, 0, 1.74, 0, displayCase);
    const glassFront = box(2.46, 0.68, 0.02, mat.glass, 0, 1.4, 0.5, displayCase);
    glassFront.castShadow = false;
    const glassBack = box(2.46, 0.68, 0.02, mat.glass, 0, 1.4, -0.5, displayCase);
    glassBack.castShadow = false;
    for (const x of [-1.24, 1.24]) {
      const side = box(0.02, 0.68, 0.98, mat.glass, x, 1.4, 0, displayCase);
      side.castShadow = false;
    }
    root.add(displayCase);

    // Pendant lamps over the counter.
    const pendants = new THREE.Group();
    for (const x of [-2.2, 0, 2.2]) {
      cyl(0.012, 0.012, 0.5, mat.metal, x, H - 0.32, 0.2, pendants, 8);
      const shade = cyl(0.08, 0.32, 0.28, mat.woodDark, x, H - 0.68, 0.2, pendants, 18);
      shade.castShadow = false;
      const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 12), mat.lamp);
      bulb.position.set(x, H - 0.8, 0.2);
      pendants.add(bulb);
    }
    root.add(pendants);

    // Shop bell by the entrance.
    const bell = new THREE.Group();
    cyl(0.16, 0.18, 0.05, mat.woodDark, 0, 1.0, 0, bell, 16);
    const dome = new THREE.Mesh(new THREE.SphereGeometry(0.12, 14, 10,
      0, Math.PI * 2, 0, Math.PI / 2), mat.bell);
    dome.position.y = 1.04;
    bell.add(dome);
    bell.position.set(3.5, 0, 2.4);
    root.add(bell);

    // A couple of small customer stools.
    for (const x of [-2.6, 2.6]) {
      const stool = new THREE.Group();
      cyl(0.26, 0.26, 0.07, mat.wood, 0, 0.66, 0, stool, 16);
      for (let s = 0; s < 3; s++) {
        const a = (s / 3) * Math.PI * 2;
        cyl(0.03, 0.04, 0.64, mat.woodDark, Math.sin(a) * 0.16, 0.32,
          Math.cos(a) * 0.16, stool, 8);
      }
      stool.position.set(x, 0, 1.9);
      root.add(stool);
    }

    this.characterParts = { floor, counter, displayCase, sign, shelf, pendants, bell };
    this.character = root;
    this.scene.add(root);
    return root;
  }

  animate() {
    if (this._dead) return;
    requestAnimationFrame(() => this.animate());
    if (this.controls) this.controls.update();
    if (this.renderer) this.renderer.render(this.scene, this.camera);
  }

  onWindowResize() {
    const width = this.container.clientWidth;
    const height = this.container.clientHeight;
    if (this.camera) {
      this.camera.aspect = width / height;
      this.camera.updateProjectionMatrix();
    }
    if (this.renderer) this.renderer.setSize(width, height);
  }

  resetScene() {
    this.dispose();
    this.setupScene();
    this.addLights();
    this.createProceduralCharacter();
  }

  dispose() {
    if (this.scene && this.character) {
      this.scene.remove(this.character);
      this.character.traverse((child) => {
        if (child.isMesh) {
          child.geometry.dispose();
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          mats.forEach((m) => {
            if (m && m.map) m.map.dispose();
            if (m) m.dispose();
          });
        }
      });
    }
    this.character = null;
    this.characterParts = {};
  }
}

class CharacterInspector {
  constructor(manager) {
    this.manager = manager;
    this.character = manager.character;
    this.inspectorPanel = null;
    this.selectedObject = null;
  }

  updateCharacter(character) {
    this.character = character;
    this.update();
  }

  setCharName(name) {
    if (this.character?.userData) {
      this.character.userData.charName = name;
    }
  }

  createPanel(container) {
    this.inspectorPanel = document.createElement('div');
    this.inspectorPanel.style.cssText = `
      position: absolute;
      top: 10px;
      right: 10px;
      width: 280px;
      max-height: 80vh;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      z-index: 100;
    `;
    container.appendChild(this.inspectorPanel);
    this.update();
    return this.inspectorPanel;
  }

  update() {
    if (!this.inspectorPanel || !this.character) return;

    const charName = this.character.userData.charName || 'Unknown';
    
    this.inspectorPanel.innerHTML = `
      <div style="margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px;">
        <div style="font-weight: bold; font-size: 14px; margin-bottom: 8px;">🧩 Character Inspector</div>
        <div style="color: #888;">Selection: ${this.selectedObject ? this.selectedObject.name || 'Unknown' : 'None (click on object)'}</div>
        <div style="font-size: 11px; color: #4a90d9; margin-top: 5px;">Current: ${charName}</div>
      </div>
      
      <div style="margin-bottom: 10px;">
        <div style="color: #888; font-size: 11px; margin-bottom: 5px;">POSITION</div>
        <div>pos: (${this.sanitize(this.character.position.x)}, ${this.sanitize(this.character.position.y)}, ${this.sanitize(this.character.position.z)})</div>
      </div>
      
      <div style="margin-bottom: 10px;">
        <div style="color: #888; font-size: 11px; margin-bottom: 5px;">ROTATION (Euler)</div>
        <div>rot: (${this.sanitize(this.character.rotation.x)}, ${this.sanitize(this.character.rotation.y)}, ${this.sanitize(this.character.rotation.z)})</div>
      </div>
      
      <div style="margin-bottom: 10px;">
        <div style="color: #888; font-size: 11px; margin-bottom: 5px;">SCALE</div>
        <div>scale: (${this.sanitize(this.character.scale.x)}, ${this.sanitize(this.character.scale.y)}, ${this.sanitize(this.character.scale.z)})</div>
      </div>
      
      <div style="margin-bottom: 15px;">
        <div style="color: #888; font-size: 11px; margin-bottom: 5px;">TRANSFORM</div>
        <div>matrix: 4x4</div>
      </div>
      
      <div style="margin-bottom: 15px;">
        <div style="color: #888; font-size: 11px; margin-bottom: 5px;">CHILD OBJECTS (${this.character.children.length})</div>
        ${this.character.children.map((child, i) => `
          <div style="display: flex; justify-content: space-between; padding: 3px 0; cursor: pointer;"
               onmouseover="this.style.background='rgba(255,255,255,0.1)'"
               onmouseout="this.style.background='transparent'"
               onclick="inspector.selectObject(${i})">
            <span style="color: ${child.isMesh ? '#90EE90' : '#87CEEB'}">${child.name || `Object ${i}`}</span>
            <span>(${child.type})</span>
          </div>
        `).join('')}
      </div>
    `;
  }

  selectObject(index) {
    this.selectedObject = this.character.children[index] || null;
    this.update();
  }

  sanitize(value) {
    const num = Number(value);
    if (isNaN(num)) return 'NaN';
    return num.toFixed(3);
  }
}

const container = document.getElementById('canvas-container');
const loadingEl = document.getElementById('loading');
const inspectorEl = document.getElementById('btn-inspector');
const characterSelector = document.getElementById('character-selector');

const characterClasses = {
  // Basic Characters
  default: DefaultApp,
  suit: SuitOutfitApp,
  soccer: SoccerOutfitApp,
  casual: AnotherCasualOutfitApp,
  coach: SoccerCoachOutfitApp,
  chairman: ChairmanApp,
  newowner: NewOwnerApp,
  sponsor: SponsorApp,
  // Season 1 Characters
  karim: KarimApp,
  azam: AzamApp,
  karimAway: KarimAwayApp,
  // Environments
  stadium: StadiumApp,
  locker: LockerRoomApp,
  managerOffice: ManagerOfficeApp,
  boardroom: LenderBoardroomApp,
  playersTunnel: PlayersTunnelApp,
  sponsorOffice: SponsorOfficeApp,
  bakery: BakeryApp,
  clubOffice: ClubOfficeApp,
  pitchHeroStand: PitchHeroStandApp,
  pitchCrisisNight: PitchCrisisNightApp,
  modularPitchZone: ModularPitchZoneApp
};
const characterLabels = {
  // Basic Characters
  default: 'Default Hoodie',
  suit: 'Three-Piece Suit',
  soccer: 'Soccer Jersey',
  casual: 'Casual Sweater',
  coach: 'Coach Tracksuit',
  chairman: 'The Chairman',
  newowner: 'The New Owner',
  sponsor: 'Sponsor Executive',
  // Season 1 Characters
  karim: 'Karim – Captain #8 (Match Jersey)',
  azam: 'Azam – Defender #7 (RM5)',
  karimAway: 'Karim Away – Divisyen 4 Kit (Ep. 12)',
  // Environments
  stadium: 'Stadium – Buluh FC',
  locker: 'Locker Room',
  managerOffice: 'Manager Office',
  boardroom: 'Lender Boardroom',
  playersTunnel: 'Players Tunnel',
  sponsorOffice: 'Sponsor Office – Nexus Sports',
  bakery: 'Bakery – Kek Maju',
  clubOffice: 'Club Office – Episode 4',
  pitchHeroStand: 'Pitch Hero Stand – Finale Set',
  pitchCrisisNight: 'Pitch Crisis Night – Floodlight Emergency',
  modularPitchZone: 'Modular Pitch Zone'
};

let manager = null;
let inspector = null;
let inspectorVisible = true;
let currentClass = null;

async function loadCharacter(characterType) {
  loadingEl.classList.add('active');
  try {
    const CharClass = characterClasses[characterType];
    if (!CharClass) throw new Error(`Unknown character type: ${characterType}`);

    if (manager) {
      manager._dead = true;
      manager.dispose();
      manager.renderer?.domElement?.remove();
      manager.renderer?.dispose(); // free the WebGL context, browsers cap them ~16
    }
    if (inspector?.inspectorPanel) inspector.inspectorPanel.remove();

    manager = new CharClass(container);
    await manager.init();

    manager.character.userData.charName = characterLabels[characterType] || characterType;
    currentClass = CharClass;

    inspector = new CharacterInspector(manager);
    inspector.createPanel(container);
    inspector.character = manager.character;
    inspector.selectedObject = null;
    inspector.update();
    window.inspector = inspector;
  } catch (err) {
    console.error('Error loading character:', err);
    alert(`Error loading ${characterType}: ${err.message}`);
  }
  loadingEl.classList.remove('active');
}

async function init() {
  await loadCharacter('default');
  window.addEventListener('resize', () => manager?.onWindowResize());
}

document.getElementById('btn-procedural').addEventListener('click', () => {
  if (characterSelector.value) loadCharacter(characterSelector.value);
});

characterSelector.addEventListener('change', () => {
  loadCharacter(characterSelector.value);
});

document.getElementById('btn-gltf').addEventListener('click', () => {
  if (!manager || !currentClass) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.gltf,.glb';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    loadingEl.classList.add('active');
    const url = URL.createObjectURL(file);
    try {
      const gltf = await new Promise((resolve, reject) => {
        new GLTFLoader().load(url, resolve, undefined, reject);
      });
      if (manager.character) {
        manager.scene.remove(manager.character);
        manager.character.traverse((child) => {
          if (!child.isMesh) return;
          child.geometry.dispose();
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          mats.forEach((m) => m?.dispose());
        });
      }
      manager.character = gltf.scene;
      manager.characterParts = {}; // stale parts would snap the model to y=0 every frame
      manager.scene.add(gltf.scene);
      inspector.character = manager.character;
      inspector.selectedObject = null;
      inspector.update();
    } catch (err) {
      console.error('Error loading GLTF:', err);
      alert('Error loading GLTF file');
    }
    loadingEl.classList.remove('active');
    URL.revokeObjectURL(url);
  };
  input.click();
});

inspectorEl.addEventListener('click', () => {
  inspectorVisible = !inspectorVisible;
  inspectorEl.textContent = inspectorVisible ? 'Inspector ON' : 'Inspector OFF';
  inspectorEl.classList.toggle('active', inspectorVisible);
  if (inspector?.inspectorPanel) {
    inspector.inspectorPanel.style.display = inspectorVisible ? 'block' : 'none';
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  if (manager?.homeCamera) {
    manager.camera.position.set(...manager.homeCamera);
    manager.controls.target.set(...manager.homeTarget);
  } else {
    manager.camera.position.set(3, 2, 3);
    manager.controls.target.set(0, 1, 0);
  }
  manager.controls.update();
});

init();
  </script>
